<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cold { fill: #eaf4ff; stroke: #2c5f8c; stroke-width: 1.5; }
      .label { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; }
      .mono { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 10px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">生成模型评估的三大支柱（Three-pillar Evaluation）</text>

  <!-- FID column -->
  <rect x="30" y="60" width="270" height="200" class="box"/>
  <text x="165" y="85" text-anchor="middle" class="label">FID：样本质量（Sample Quality）</text>
  <text x="165" y="110" text-anchor="middle" class="mono" style="font-size:8px">||&#956;_r - &#956;_g||&#178; + Tr(&#931;_r + &#931;_g - 2&#8730;&#931;_r&#931;_g)</text>
  <text x="165" y="140" text-anchor="middle" class="caption">弗雷歇距离（Fréchet Distance）：</text>
  <text x="165" y="158" text-anchor="middle" class="caption">Inception-v3 空间中高斯拟合之间</text>
  <text x="165" y="188" text-anchor="middle" class="caption">使用 N &#8805; 10k，否则数字不可信</text>
  <text x="165" y="206" text-anchor="middle" class="caption">偏向 ImageNet；域外使用 FD-DINO 或</text>
  <text x="165" y="224" text-anchor="middle" class="caption">CMMD</text>
  <text x="165" y="252" text-anchor="middle" class="caption">越低越好</text>

  <!-- CLIP column -->
  <rect x="315" y="60" width="270" height="200" class="box"/>
  <text x="450" y="85" text-anchor="middle" class="label">CLIP 分数：遵循（Adherence）</text>
  <text x="450" y="110" text-anchor="middle" class="mono">cos( CLIP_image(x), CLIP_text(p) )</text>
  <text x="450" y="140" text-anchor="middle" class="caption">输出与提示词匹配得如何？</text>
  <text x="450" y="170" text-anchor="middle" class="caption">组合性错误会漏检</text>
  <text x="450" y="188" text-anchor="middle" class="caption">短提示词因机制原因分数更高</text>
  <text x="450" y="206" text-anchor="middle" class="caption">CMMD + 视觉问答（VQA）测试覆盖 CLIP 盲点</text>
  <text x="450" y="252" text-anchor="middle" class="caption">越高越好</text>

  <!-- preference column -->
  <rect x="600" y="60" width="270" height="200" class="box"/>
  <text x="735" y="85" text-anchor="middle" class="label">人类偏好（Human Preference）：依据</text>
  <text x="735" y="110" text-anchor="middle" class="mono">配对胜负汇总为 Elo</text>
  <text x="735" y="140" text-anchor="middle" class="caption">同一提示词下 A 与 B 对比</text>
  <text x="735" y="158" text-anchor="middle" class="caption">HPSv2 / ImageReward / PickScore</text>
  <text x="735" y="188" text-anchor="middle" class="caption">作为自动代理指标</text>
  <text x="735" y="206" text-anchor="middle" class="caption">Chatbot Arena 式图像竞技场</text>
  <text x="735" y="252" text-anchor="middle" class="caption">胜率越高越好</text>

  <!-- failure modes -->
  <rect x="30" y="285" width="840" height="100" class="hot"/>
  <text x="450" y="310" text-anchor="middle" class="label">每种指标都有已知刷分方式</text>
  <text x="450" y="333" text-anchor="middle" class="caption">FID：过拟合 Inception 先验 &#8594; FID 更低，质量不变</text>
  <text x="450" y="353" text-anchor="middle" class="caption">CLIP：堆入“杰作、4k”使其饱和 &#8594; 分数虚高</text>
  <text x="450" y="373" text-anchor="middle" class="caption">偏好：提示词集与训练集重叠 &#8594; 结果失真</text>

  <!-- production report -->
  <rect x="30" y="410" width="840" height="100" class="cold"/>
  <text x="450" y="435" text-anchor="middle" class="label">生产评估报告（Production Eval Report）</text>
  <text x="450" y="458" text-anchor="middle" class="caption">1. 10k 至 30k 样本的 FID + 2. 同组样本的 CLIP / CMMD +</text>
  <text x="450" y="478" text-anchor="middle" class="caption">3. 200 对以上人类盲测 Elo + 4. 对 50 个输出做定性失效审计</text>
  <text x="450" y="498" text-anchor="middle" class="caption">一个指标是营销；四项共同构成证据</text>
</svg>
