<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">三份扩展政策，同一能力，三种分类（Three scaling policies）</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Column headers -->
  <rect x="60" y="80" width="250" height="36" class="cool"/>
  <text x="185" y="104" text-anchor="middle" class="label">OpenAI PF v2（2025 年 4 月）</text>

  <rect x="320" y="80" width="240" height="36" class="cold"/>
  <text x="440" y="104" text-anchor="middle" class="label">Anthropic RSP v3.0（2026 年 2 月）</text>

  <rect x="570" y="80" width="250" height="36" class="warn"/>
  <text x="695" y="104" text-anchor="middle" class="label" style="font-size: 11px">DeepMind FSF v3（2025-09 + 2026-04）</text>

  <!-- Long-range Autonomy row -->
  <rect x="60" y="130" width="760" height="46" class="box"/>
  <text x="76" y="152" class="label">长程自主性（long-range autonomy）</text>
  <text x="76" y="170" class="content" style="font-size: 10px">OpenAI：研究类，不触发措施 · Anthropic：明确列出，达到阈值须正面论证 · DeepMind：纳入 ML R&amp;D / Cyber</text>

  <!-- Undermining safeguards -->
  <rect x="60" y="184" width="760" height="46" class="box"/>
  <text x="76" y="206" class="label">破坏防护措施（undermining safeguards）</text>
  <text x="76" y="224" class="content" style="font-size: 10px">OpenAI：研究类 · Anthropic：硬编码禁令（拒绝） · DeepMind：欺骗性对齐监控</text>

  <!-- R&D automation -->
  <rect x="60" y="238" width="760" height="46" class="box"/>
  <text x="76" y="260" class="label">研发自动化（R&amp;D automation）</text>
  <text x="76" y="278" class="content" style="font-size: 10px">OpenAI：跟踪类 · Anthropic：AI R&amp;D-4 阈值（正面论证） · DeepMind：ML R&amp;D 自主性 1 级（TCL，2026-04）</text>

  <!-- Sandbagging -->
  <rect x="60" y="292" width="760" height="46" class="box"/>
  <text x="76" y="314" class="label">藏拙（sandbagging）</text>
  <text x="76" y="332" class="content" style="font-size: 10px">OpenAI：研究类 · Anthropic：通过评估情境差距处理 · DeepMind：欺骗性对齐监控（工具性推理）</text>

  <!-- Cyber uplift -->
  <rect x="60" y="346" width="760" height="46" class="box"/>
  <text x="76" y="368" class="label">网络攻击能力提升（cyber uplift）</text>
  <text x="76" y="386" class="content" style="font-size: 10px">OpenAI：跟踪类 · Anthropic：ASL-3 触发（安全 + 部署措施） · DeepMind：网络安全 CCL</text>

  <!-- Convergence note -->
  <rect x="60" y="400" width="760" height="90" class="hot"/>
  <text x="440" y="424" text-anchor="middle" class="label">共识与分歧（convergence + divergence）</text>
  <text x="80" y="446" class="content">共识：内部 SAG，明确将欺骗性对齐列为风险类别，持续维护的产出</text>
  <text x="80" y="462" class="content">分歧：仅 PF v2 区分跟踪与研究；DeepMind 将自主性归入其他领域；Anthropic 删除暂停条款</text>
  <text x="80" y="478" class="content">测量前提：只有能力测量不被投机行为操纵，三种框架才能发挥作用</text>
</svg>
