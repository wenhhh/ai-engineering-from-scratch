<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .warn { fill: #fde0b4; stroke: #b5651d; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">Claude Code 权限模式与 Auto Mode 分类器</text>

  <rect x="40" y="50" width="800" height="460" class="box"/>

  <!-- Permission ladder -->
  <text x="60" y="80" class="label">权限阶梯（Permission ladder，严格 -&gt; 宽松）</text>

  <rect x="60" y="96" width="130" height="46" class="cool"/>
  <text x="125" y="116" text-anchor="middle" class="label">plan</text>
  <text x="125" y="132" text-anchor="middle" class="small">所有动作前询问</text>

  <rect x="200" y="96" width="130" height="46" class="cold"/>
  <text x="265" y="116" text-anchor="middle" class="label">default</text>
  <text x="265" y="132" text-anchor="middle" class="small">风险操作时询问</text>

  <rect x="340" y="96" width="130" height="46" class="dsk"/>
  <text x="405" y="116" text-anchor="middle" class="label">acceptEdits</text>
  <text x="405" y="132" text-anchor="middle" class="small">写入自动，执行询问</text>

  <rect x="480" y="96" width="130" height="46" class="warn"/>
  <text x="545" y="116" text-anchor="middle" class="label">auto</text>
  <text x="545" y="132" text-anchor="middle" class="small">分类器批准</text>

  <rect x="620" y="96" width="90" height="46" class="hot"/>
  <text x="665" y="116" text-anchor="middle" class="label">dontAsk</text>
  <text x="665" y="132" text-anchor="middle" class="small">不询问</text>

  <rect x="720" y="96" width="110" height="46" class="hot"/>
  <text x="775" y="116" text-anchor="middle" class="label" style="font-size:10px">bypassPermissions</text>
  <text x="775" y="132" text-anchor="middle" class="small">可丢弃沙箱</text>

  <!-- Auto Mode internals -->
  <rect x="60" y="170" width="770" height="200" class="box"/>
  <text x="445" y="192" text-anchor="middle" class="label">Auto Mode（2026 年 3 月 24 日）：动作审查分类器</text>

  <rect x="80" y="210" width="180" height="110" class="cool"/>
  <text x="170" y="232" text-anchor="middle" class="label">拟议动作</text>
  <text x="170" y="252" text-anchor="middle" class="small">工具 + 载荷</text>
  <text x="170" y="270" text-anchor="middle" class="small">来自智能体循环</text>

  <rect x="290" y="210" width="180" height="110" class="warn"/>
  <text x="380" y="232" text-anchor="middle" class="label">分类器模型</text>
  <text x="380" y="252" text-anchor="middle" class="small">独立模型</text>
  <text x="380" y="270" text-anchor="middle" class="small">在运行前</text>
  <text x="380" y="288" text-anchor="middle" class="small">审查每个动作</text>

  <rect x="500" y="210" width="180" height="110" class="hot"/>
  <text x="590" y="232" text-anchor="middle" class="label">阻止越界升级</text>
  <text x="590" y="252" text-anchor="middle" class="small">阻止超出</text>
  <text x="590" y="270" text-anchor="middle" class="small">请求范围的</text>
  <text x="590" y="288" text-anchor="middle" class="small">升级动作</text>

  <rect x="710" y="210" width="120" height="110" class="cold"/>
  <text x="770" y="232" text-anchor="middle" class="label" style="font-size: 11px">人在回路（HITL）</text>
  <text x="770" y="252" text-anchor="middle" class="small">被阻止的动作</text>
  <text x="770" y="270" text-anchor="middle" class="small">交回用户</text>

  <path d="M260 265 L290 265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M470 265 L500 265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680 265 L710 265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="380" y="340" text-anchor="middle" class="small">批准 -&gt; 立即执行</text>
  <text x="590" y="340" text-anchor="middle" class="small">强制阻止提权 / 数据外泄行为</text>

  <!-- Budget line -->
  <rect x="60" y="390" width="770" height="100" class="hot"/>
  <text x="445" y="412" text-anchor="middle" class="label">预算控制不可妥协（第 13 课）</text>
  <text x="80" y="434" class="content">max_turns = 智能体循环迭代次数硬上限</text>
  <text x="80" y="450" class="content">max_budget_usd = 美元紧急停止阈值，超限即中止会话</text>
  <text x="80" y="466" class="content">每工具上限 = 例如每会话最多 N 次 WebFetch 调用</text>
  <text x="80" y="482" class="small">可用性取决于套餐、组织启用、模型、服务商；分类器是一层防护，不是完整方案。</text>
</svg>
