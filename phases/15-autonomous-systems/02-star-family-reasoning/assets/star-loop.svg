<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; font-family: 'Menlo', monospace; fill: #333; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">STaR 自举循环（Bootstrap loop）及捷径如何混入</text>

  <!-- Left: the loop -->
  <rect x="40" y="56" width="380" height="480" class="box"/>
  <text x="230" y="80" text-anchor="middle" class="label">STaR 循环</text>

  <rect x="60" y="100" width="340" height="56" class="cool"/>
  <text x="230" y="124" text-anchor="middle" class="content">1. 采样（推理依据、答案）</text>
  <text x="230" y="140" text-anchor="middle" class="small">基础模型，T &gt; 0</text>

  <path d="M230 160 L230 180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="186" width="340" height="56" class="hot"/>
  <text x="230" y="210" text-anchor="middle" class="content">2. 过滤：answer == label 则保留</text>
  <text x="230" y="226" text-anchor="middle" class="small">完全丢弃错误推理依据</text>

  <path d="M230 246 L230 266" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="272" width="340" height="56" class="cool"/>
  <text x="230" y="296" text-anchor="middle" class="content">3. 对保留的推理依据做监督微调（SFT）</text>
  <text x="230" y="312" text-anchor="middle" class="small" style="font-size:9px">对（问题、推理依据、答案）做教师强制（Teacher forcing）</text>

  <path d="M230 332 L230 352" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="358" width="340" height="56" class="cold"/>
  <text x="230" y="382" text-anchor="middle" class="content">4. 对失败做事后合理化（Rationalization）</text>
  <text x="230" y="398" text-anchor="middle" class="small">注入答案，重新要求提供推理依据</text>

  <path d="M60 386 Q 20 386 20 140 Q 20 100 60 128" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="28" y="260" class="small">重复</text>

  <rect x="60" y="438" width="340" height="80" class="box"/>
  <text x="230" y="458" text-anchor="middle" class="label">循环强化什么</text>
  <text x="230" y="478" text-anchor="middle" class="content">合理推理依据 · 正确答案</text>
  <text x="230" y="494" text-anchor="middle" class="content">捷径推理依据 · 正确答案</text>
  <text x="230" y="510" text-anchor="middle" class="small">两者都保留，过滤器无法区分。</text>

  <!-- Right: three variants -->
  <rect x="450" y="56" width="410" height="480" class="box"/>
  <text x="655" y="80" text-anchor="middle" class="label">三种变体，三种信号形式</text>

  <rect x="470" y="100" width="372" height="106" class="cool"/>
  <text x="480" y="122" class="label">STaR (Zelikman 2022)</text>
  <text x="480" y="142" class="content">对生成器采用答对即保留过滤器。</text>
  <text x="480" y="158" class="content">重复监督微调（SFT）轮次。</text>
  <text x="480" y="174" class="content">GPT-J + STaR ≈ 经微调、规模为其 30x 的模型</text>
  <text x="480" y="190" class="content">在 GSM8K 上（无新增人工标签）。</text>

  <rect x="470" y="212" width="372" height="110" class="cold"/>
  <text x="480" y="234" class="label">V-STaR (Hosseini 2024)</text>
  <text x="480" y="254" class="content">在正确及错误推理依据上，</text>
  <text x="480" y="270" class="content">用 DPO 训练验证器（利用 STaR 丢弃的数据）。</text>
  <text x="480" y="286" class="content">推理：采样 N 条，选择验证器首选。</text>
  <text x="480" y="302" class="content">比此前自我改进提高 +4 至 +17 个百分点。</text>

  <rect x="470" y="328" width="372" height="110" class="hot"/>
  <text x="480" y="350" class="label">Quiet-STaR (Zelikman 2024)</text>
  <text x="480" y="370" class="content">逐词元内部推理依据。</text>
  <text x="480" y="386" class="content">思考结束词元 + 混合头（Mixing head）。</text>
  <text x="480" y="402" class="content">Mistral 7B GSM8K 5.9% -&gt; 10.9%</text>
  <text x="480" y="418" class="content">无需任务特定微调。</text>

  <rect x="470" y="444" width="372" height="84" class="box"/>
  <text x="480" y="466" class="label">共同弱点</text>
  <text x="480" y="486" class="content">三者都使用以答案为条件的梯度。</text>
  <text x="480" y="502" class="content">捷径推理同样能得到标签。</text>
  <text x="480" y="518" class="content">修正：过程奖励模型 + 分布外（OOD）评估。</text>
</svg>
