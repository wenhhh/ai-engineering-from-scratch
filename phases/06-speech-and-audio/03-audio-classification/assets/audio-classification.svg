<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .col { font-size: 11px; fill: #1a1a1a; font-weight: 600; }
    </style>
  </defs>

  <text x="440" y="30" text-anchor="middle" class="title">三十年音频分类器（Audio Classifiers），相同对数梅尔输入</text>

  <!-- shared input -->
  <rect x="40" y="60" width="800" height="60" class="box"/>
  <text x="440" y="82" text-anchor="middle" class="label">输入：10 秒对数梅尔频谱图（Log-Mel），形状 [T=998, n_mels=80]</text>
  <text x="440" y="102" text-anchor="middle" class="caption">相同前端（Frontend），三代后端（Backends）</text>

  <!-- Era 1: k-NN -->
  <rect x="40" y="145" width="250" height="280" class="box"/>
  <text x="165" y="170" text-anchor="middle" class="label" style="font-size: 13.2px">1990 年代：MFCC 的 k 近邻（k-NN）</text>
  <rect x="60" y="195" width="210" height="35" class="box"/>
  <text x="165" y="218" text-anchor="middle" class="content" style="font-size: 10.5px">MFCC-13 + 均值/方差池化（Pooling）</text>
  <line x1="165" y1="232" x2="165" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="255" width="210" height="35" class="box"/>
  <text x="165" y="278" text-anchor="middle" class="content">余弦（Cosine）→ top-K 投票</text>
  <text x="165" y="318" text-anchor="middle" class="caption">零训练，无需 GPU</text>
  <text x="165" y="336" text-anchor="middle" class="caption">ESC-50 上表现强</text>
  <text x="165" y="354" text-anchor="middle" class="caption">AudioSet 上失效</text>
  <text x="165" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 准确率（Accuracy）：~65%</text>
  <text x="165" y="406" text-anchor="middle" class="caption">你的首个基线（Baseline）</text>

  <!-- Era 2: CNN -->
  <rect x="315" y="145" width="250" height="280" class="box"/>
  <text x="440" y="170" text-anchor="middle" class="label" style="font-size: 12.7px">2015–2021：二维卷积网络（2D CNN）</text>
  <rect x="335" y="195" width="210" height="35" class="box"/>
  <text x="440" y="218" text-anchor="middle" class="content">对数梅尔（Log-Mel）作为图像</text>
  <line x1="440" y1="232" x2="440" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="335" y="255" width="210" height="35" class="box"/>
  <text x="440" y="278" text-anchor="middle" class="content">卷积 + 池化 × 3，softmax</text>
  <text x="440" y="318" text-anchor="middle" class="caption">300 万参数，训练 10 分钟</text>
  <text x="440" y="336" text-anchor="middle" class="caption" style="font-size: 10.8px">频谱增强（SpecAugment）+ 混合增强（Mixup）</text>
  <text x="440" y="354" text-anchor="middle" class="caption">仍是关键词检测（KWS）的基线</text>
  <text x="440" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 准确率（Accuracy）：~82%</text>
  <text x="440" y="406" text-anchor="middle" class="caption">边缘端（Edge）与语音命令</text>

  <!-- Era 3: SSL -->
  <rect x="590" y="145" width="250" height="280" class="hot"/>
  <text x="715" y="170" text-anchor="middle" class="label">2024–2026：BEATs / AST</text>
  <rect x="610" y="195" width="210" height="35" class="box"/>
  <text x="715" y="218" text-anchor="middle" class="content" style="font-size: 11.7px">对数梅尔切块（Patchify，16×16）</text>
  <line x1="715" y1="232" x2="715" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="610" y="255" width="210" height="35" class="box"/>
  <text x="715" y="278" text-anchor="middle" class="content">自监督预训练（SSL）Transformer</text>
  <text x="715" y="318" text-anchor="middle" class="caption">用 1–10% 标签微调（Fine-Tune）</text>
  <text x="715" y="336" text-anchor="middle" class="caption">BEATs-iter3 领先 AudioSet</text>
  <text x="715" y="354" text-anchor="middle" class="caption">2026 年非语音默认方案</text>
  <text x="715" y="386" text-anchor="middle" class="content" font-size="11">ESC-50 准确率（Accuracy）：97.0%</text>
  <text x="715" y="406" text-anchor="middle" class="caption">AudioSet 平均精度均值（mAP）：0.548</text>

  <text x="440" y="450" text-anchor="middle" class="caption">特征三十年未变，后端（Backend）才是改进关键</text>
</svg>
