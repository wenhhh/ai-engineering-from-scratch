<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="title">将 T 个音频帧映射为 U 个词元（Tokens）的三种方式</text>

  <!-- CTC column -->
  <rect x="40" y="60" width="260" height="380" class="box"/>
  <text x="170" y="85" text-anchor="middle" class="label">CTC：帧级预测 + 空白（Blank）</text>

  <rect x="60" y="105" width="220" height="30" class="box"/>
  <text x="170" y="125" text-anchor="middle" class="content">对数梅尔（Log-Mel）→ 编码器</text>
  <line x1="170" y1="140" x2="170" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="163" width="220" height="30" class="hot"/>
  <text x="170" y="183" text-anchor="middle" class="content" style="font-size: 10.8px">逐帧分布（Per-Frame Distribution）</text>
  <line x1="170" y1="198" x2="170" y2="216" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="221" width="220" height="54" class="box"/>
  <text x="170" y="240" text-anchor="middle" class="content">逐帧取最大项（argmax）：</text>
  <text x="170" y="258" text-anchor="middle" class="content">a a _ _ a b b _ c</text>
  <line x1="170" y1="282" x2="170" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="305" width="220" height="32" class="box"/>
  <text x="170" y="325" text-anchor="middle" class="content">合并重复、去空白 → "aabc"</text>

  <text x="170" y="365" text-anchor="middle" class="caption">非自回归（Non-AR），可流式</text>
  <text x="170" y="382" text-anchor="middle" class="caption">无内部语言模型（LM）</text>
  <text x="170" y="399" text-anchor="middle" class="caption">wav2vec 2.0, MMS</text>
  <text x="170" y="423" text-anchor="middle" class="content" font-size="11" style="font-size: 11.5px">LibriSpeech-clean：词错误率（WER）~1.9</text>

  <!-- RNN-T column -->
  <rect x="320" y="60" width="260" height="380" class="hot"/>
  <text x="450" y="85" text-anchor="middle" class="label">RNN-T：编码器 + 预测器</text>

  <rect x="340" y="105" width="220" height="30" class="box"/>
  <text x="450" y="125" text-anchor="middle" class="content">音频编码器（Audio Encoder），帧</text>
  <line x1="450" y1="140" x2="450" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="163" width="220" height="54" class="box"/>
  <text x="450" y="182" text-anchor="middle" class="content">预测器（Predictor）：先前词元 →</text>
  <text x="450" y="200" text-anchor="middle" class="content">状态（State）</text>
  <line x1="450" y1="222" x2="450" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="245" width="220" height="30" class="box"/>
  <text x="450" y="265" text-anchor="middle" class="content" style="font-size: 8.5px">连接器（Joiner）→ P(next | frame, history)</text>
  <line x1="450" y1="282" x2="450" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="305" width="220" height="30" class="box"/>
  <text x="450" y="325" text-anchor="middle" class="content">输出词元（Token）或跳过帧</text>

  <text x="450" y="365" text-anchor="middle" class="caption">可流式，含内部语言模型（LM）</text>
  <text x="450" y="382" text-anchor="middle" class="caption">复杂三维损失格（Loss Lattice）</text>
  <text x="450" y="399" text-anchor="middle" class="caption">Parakeet、Riva、Google 端侧</text>
  <text x="450" y="423" text-anchor="middle" class="content" font-size="11" style="font-size: 10.7px">LibriSpeech-clean：WER 1.40（2026 最佳）</text>

  <!-- Attention Enc-Dec column -->
  <rect x="600" y="60" width="260" height="380" class="box"/>
  <text x="730" y="85" text-anchor="middle" class="label">注意力（Attention）：序列到序列</text>

  <rect x="620" y="105" width="220" height="30" class="box"/>
  <text x="730" y="125" text-anchor="middle" class="content" style="font-size: 10.7px">音频编码器（Audio Encoder），6–32 层</text>
  <line x1="730" y1="140" x2="730" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="163" width="220" height="30" class="box"/>
  <text x="730" y="183" text-anchor="middle" class="content" style="font-size: 10.9px">解码器交叉注意力（Cross-Attention）</text>
  <line x1="730" y1="198" x2="730" y2="216" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="221" width="220" height="54" class="box"/>
  <text x="730" y="240" text-anchor="middle" class="content" style="font-size: 10.3px">自回归词元（Autoregressive Tokens）：</text>
  <text x="730" y="258" text-anchor="middle" class="content">BOS → hello → world → EOS</text>
  <line x1="730" y1="282" x2="730" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="305" width="220" height="30" class="box"/>
  <text x="730" y="325" text-anchor="middle" class="content">由注意力得到时间戳（Timestamps）</text>

  <text x="730" y="365" text-anchor="middle" class="caption">离线质量（Offline Quality）最高</text>
  <text x="730" y="382" text-anchor="middle" class="caption">默认非流式（Non-Streaming）</text>
  <text x="730" y="399" text-anchor="middle" class="caption">Whisper v3, SeamlessM4T</text>
  <text x="730" y="423" text-anchor="middle" class="content" font-size="11" style="font-size: 11.5px">LibriSpeech-clean：词错误率（WER）1.58</text>
</svg>
