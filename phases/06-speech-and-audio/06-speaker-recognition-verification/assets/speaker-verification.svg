<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="title">注册（Enroll）→ 嵌入（Embed）→ 余弦（Cosine）→ 等错误率（EER）</text>

  <!-- Enrollment row -->
  <rect x="40" y="60" width="180" height="80" class="box"/>
  <text x="130" y="80" text-anchor="middle" class="label">注册（Enrollment）</text>
  <text x="130" y="105" text-anchor="middle" class="content">3–5 段干净音频</text>
  <text x="130" y="123" text-anchor="middle" class="caption">每段 &gt; 3 秒，同通道（Channel）</text>

  <line x1="225" y1="100" x2="250" y2="100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="255" y="60" width="180" height="80" class="hot"/>
  <text x="345" y="80" text-anchor="middle" class="label">嵌入模型（Embedder）</text>
  <text x="345" y="105" text-anchor="middle" class="content">ECAPA / WavLM-SV</text>
  <text x="345" y="123" text-anchor="middle" class="caption">192 或 256 维，L2 归一化</text>

  <line x1="440" y1="100" x2="465" y2="100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="470" y="60" width="180" height="80" class="box"/>
  <text x="560" y="80" text-anchor="middle" class="label">锚点（Anchor）</text>
  <text x="560" y="105" text-anchor="middle" class="content" style="font-size: 11.1px">注册嵌入（Embeddings）的均值</text>
  <text x="560" y="123" text-anchor="middle" class="caption">单一说话人向量（Vector）</text>

  <!-- Verification row -->
  <rect x="40" y="165" width="180" height="80" class="box"/>
  <text x="130" y="185" text-anchor="middle" class="label" style="font-size: 12.4px">测试语句（Test Utterance）</text>
  <text x="130" y="210" text-anchor="middle" class="content">1 段音频（&gt; 2 秒）</text>
  <text x="130" y="228" text-anchor="middle" class="caption">尽可能匹配通道（Channel）</text>

  <line x1="225" y1="205" x2="250" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="255" y="165" width="180" height="80" class="hot"/>
  <text x="345" y="185" text-anchor="middle" class="label">嵌入模型（Embedder）</text>
  <text x="345" y="210" text-anchor="middle" class="content">相同模型（Model）</text>
  <text x="345" y="228" text-anchor="middle" class="caption">对输出做 L2 归一化</text>

  <line x1="440" y1="205" x2="465" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="470" y="165" width="180" height="80" class="box"/>
  <text x="560" y="185" text-anchor="middle" class="label">分数（Score）</text>
  <text x="560" y="210" text-anchor="middle" class="content">cosine(anchor, test)</text>
  <text x="560" y="228" text-anchor="middle" class="caption" style="font-size: 9.2px">可选领域自适应分数归一化（AS-norm）</text>

  <line x1="655" y1="155" x2="680" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="685" y="115" width="175" height="80" class="hot"/>
  <text x="772" y="135" text-anchor="middle" class="label">阈值（Threshold）</text>
  <text x="772" y="160" text-anchor="middle" class="content" style="font-size: 9.6px">接受 / 拒绝（Accept / Reject）</text>
  <text x="772" y="178" text-anchor="middle" class="caption">在开发集（Dev Set）调优</text>

  <!-- EER curve -->
  <rect x="40" y="270" width="400" height="170" class="box"/>
  <text x="240" y="292" text-anchor="middle" class="label">在等错误率（EER）处选阈值</text>
  <line x1="80" y1="410" x2="420" y2="410" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="80" y1="410" x2="80" y2="310" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M80,315 Q160,370 240,380 T420,405" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M80,405 Q160,390 240,380 T420,315" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="240" cy="380" r="5" fill="#1a1a1a"/>
  <text x="253" y="378" class="content" font-size="11">等错误率（EER）</text>
  <text x="250" y="395" class="caption" font-size="10">FA = FR</text>
  <text x="90" y="310" class="caption" font-size="10">误拒（FR）</text>
  <text x="410" y="310" class="caption" font-size="10" style="font-size: 8.3px">误受（FA）</text>
  <text x="240" y="430" text-anchor="middle" class="caption">低阈值 → 高误受（FA）；高阈值 → 高误拒（FR）</text>

  <!-- Model table -->
  <rect x="460" y="270" width="385" height="170" class="box"/>
  <text x="652" y="292" text-anchor="middle" class="label">2026 年 VoxCeleb1-O 等错误率（EER）</text>
  <text x="475" y="320" class="content">ReDimNet (2024)</text>        <text x="820" y="320" text-anchor="end" class="content">0.39%</text>
  <text x="475" y="340" class="content">WavLM-SV large</text>         <text x="820" y="340" text-anchor="end" class="content">0.42%</text>
  <text x="475" y="360" class="content">Pyannote 3.1</text>           <text x="820" y="360" text-anchor="end" class="content">0.65%</text>
  <text x="475" y="380" class="content">ECAPA-TDNN</text>             <text x="820" y="380" text-anchor="end" class="content">0.87%</text>
  <text x="475" y="400" class="content">x-vector（经典）</text>    <text x="820" y="400" text-anchor="end" class="content">3.10%</text>
  <text x="652" y="428" text-anchor="middle" class="caption">先用 ECAPA，领域需要时换 WavLM</text>
</svg>
