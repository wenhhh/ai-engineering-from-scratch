<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">音乐生成（Music Generation）：两种范式，同一法律环境</text>

  <rect x="30" y="55" width="400" height="170" class="box"/>
  <text x="230" y="78" text-anchor="middle" class="label">A. 神经编解码上的自回归词元语言模型（AR LM）</text>
  <text x="230" y="96" text-anchor="middle" class="tag">MusicGen · ACE-Step · YuE · VALL-E-Music</text>
  <text x="50" y="124" class="content">文本提示词（Prompt）→ T5 / CLAP 嵌入</text>
  <text x="50" y="142" class="content">→ EnCodec 词元上的自回归（AR）Transformer</text>
  <text x="50" y="160" class="content">→ EnCodec 解码器（Decoder）→ 32 kHz 音频</text>
  <text x="50" y="188" class="caption">流式（未来）；带歌词的结构化歌曲</text>
  <text x="50" y="205" class="caption">超过 30 秒会漂移、循环，需交叉淡化（Crossfade）</text>

  <rect x="450" y="55" width="400" height="170" class="box"/>
  <text x="650" y="78" text-anchor="middle" class="label">B. 梅尔 / 潜在编解码上的潜在扩散（Latent Diffusion）</text>
  <text x="650" y="96" text-anchor="middle" class="tag">Stable Audio · AudioLDM 2 · Riffusion</text>
  <text x="470" y="124" class="content">文本 → CLAP 嵌入（Embedding）</text>
  <text x="470" y="142" class="content">→ 潜在扩散（DDPM / Flow）</text>
  <text x="470" y="160" class="content">→ 解码器（Decoder）→ 44.1 / 48 kHz 音频</text>
  <text x="470" y="188" class="caption">擅长循环（Loops）、音色质感和声音设计</text>
  <text x="470" y="205" class="caption">结构与人声（Vocals）较弱</text>

  <rect x="30" y="250" width="820" height="180" class="hot"/>
  <text x="440" y="272" text-anchor="middle" class="label">2026 年排行榜（Leaderboard）与法律说明</text>
  <text x="60" y="300" class="content">MusicGen-large　3.3B　30 秒　无人声　MIT　器乐基线（Instrumental Baseline）</text>
  <text x="60" y="318" class="content">Stable Audio Open　1.2B　47 秒　无人声　非商业　循环与音色质感（Textures）</text>
  <text x="60" y="336" class="content">ACE-Step XL（2026 年 4 月）4B　&gt; 2 分钟　有人声　Apache-2.0　开放完整歌曲</text>
  <text x="60" y="354" class="content">Suno v5（闭源）?　4 分钟　有人声　商业　ELO 1293，质量领先</text>
  <text x="60" y="372" class="content">Udio v4（闭源）?　4 分钟　人声与分轨（Stems）　商业　局部重绘、分轨分离</text>
  <text x="60" y="400" class="caption">法律：Warner 与 UMG 在 2025–26 年同 Suno / Udio 和解；欧盟 AI Act、加州 SB 942 要求披露及水印</text>
  <text x="60" y="418" class="caption">可交付：MIT/CC0 器乐、获许可商业 API、自有曲库训练</text>
</svg>
