<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">音频语言模型（Audio-Language Model）：三组件模板，2026 年</text>

  <rect x="30" y="55" width="180" height="100" class="box"/>
  <text x="120" y="78" text-anchor="middle" class="label" style="font-size: 10.6px">1. 音频编码器（Audio Encoder）</text>
  <text x="120" y="96" text-anchor="middle" class="content">Whisper / BEATs / CLAP</text>
  <text x="120" y="114" text-anchor="middle" class="content">→ (T, d_audio)</text>
  <text x="120" y="138" text-anchor="middle" class="caption">阶段 1 冻结（Frozen）</text>

  <line x1="212" y1="105" x2="233" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="235" y="55" width="180" height="100" class="hot"/>
  <text x="325" y="78" text-anchor="middle" class="label">2. 投影器（Projector）</text>
  <text x="325" y="96" text-anchor="middle" class="content" style="font-size: 10.3px">1–3 个线性层（Linear Layers）</text>
  <text x="325" y="114" text-anchor="middle" class="content">d_audio → d_llm</text>
  <text x="325" y="138" text-anchor="middle" class="caption">首先训练（Train First）</text>

  <line x1="417" y1="105" x2="438" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="440" y="55" width="180" height="100" class="box"/>
  <text x="530" y="78" text-anchor="middle" class="label" style="font-size: 12.3px">3. 大语言模型（LLM）解码器</text>
  <text x="530" y="96" text-anchor="middle" class="content">Llama / Qwen / Gemma</text>
  <text x="530" y="114" text-anchor="middle" class="content">文本与音频词元（Tokens）</text>
  <text x="530" y="138" text-anchor="middle" class="caption">阶段 2 低秩适配（LoRA）微调</text>

  <line x1="622" y1="105" x2="643" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="645" y="55" width="200" height="100" class="box"/>
  <text x="745" y="78" text-anchor="middle" class="label" style="font-size: 12.4px">4. 文本或语音（Text / Speech）</text>
  <text x="745" y="96" text-anchor="middle" class="content">Qwen2.5-Omni：两者均可</text>
  <text x="745" y="114" text-anchor="middle" class="content">GPT-4o Audio：两者均可</text>
  <text x="745" y="138" text-anchor="middle" class="caption">语音解码器（Decoder）可选</text>

  <rect x="30" y="175" width="815" height="100" class="box"/>
  <text x="437" y="195" text-anchor="middle" class="label">训练方案（Training Recipe）</text>
  <text x="60" y="220" class="content">阶段 1：冻结编码器与 LLM；在 ASR / 音频描述数据对上训练投影器（Projector）</text>
  <text x="60" y="238" class="content">阶段 2：对编码器与 LLM 做 LoRA；使用音频问答（QA）/ 指令遵循数据</text>
  <text x="60" y="256" class="content">阶段 3（可选）：增加语音解码器，实现语音输入与输出（Voice-In / Voice-Out）</text>

  <rect x="30" y="295" width="815" height="130" class="hot"/>
  <text x="437" y="315" text-anchor="middle" class="label">MMAU-Pro 2026：开放权重已追平，唯独多音频（Multi-Audio）仍是短板</text>
  <text x="60" y="342" class="content">Gemini 2.5 Pro　总体 ~60%　语音 73.4%　声音 51.9%　音乐 64.9%　多音频 ~22%</text>
  <text x="60" y="360" class="content">GPT-4o Audio　52.5%　—　—　—　多音频 26.5%</text>
  <text x="60" y="378" class="content">Qwen2.5-Omni-7B　52.2%　语音 57.4%　声音 47.6%　音乐 61.5%　多音频 ~20%</text>
  <text x="60" y="396" class="content">Audio Flamingo 3　~54%　—（通过 AF-CLAP 专攻音乐）</text>
  <text x="60" y="414" class="caption">四选一随机概率 = 25%；所有模型的多音频（Multi-Audio）能力都确实失效</text>
</svg>
