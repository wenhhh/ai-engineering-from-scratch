<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="title">分解（Factor）→ 替换说话人 → 重组（Recombine），再加水印</text>

  <rect x="40" y="60" width="180" height="70" class="box"/>
  <text x="130" y="82" text-anchor="middle" class="label" style="font-size: 11.9px">目标参考（Reference，5 秒）</text>
  <text x="130" y="105" text-anchor="middle" class="content">alice_5s.wav</text>
  <text x="130" y="121" text-anchor="middle" class="caption">干声（Dry）、近麦、单说话人</text>

  <line x1="225" y1="95" x2="248" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="252" y="60" width="180" height="70" class="hot"/>
  <text x="342" y="82" text-anchor="middle" class="label" style="font-size: 10px">说话人编码器（Speaker Encoder）</text>
  <text x="342" y="105" text-anchor="middle" class="content">ECAPA / WavLM-SV</text>
  <text x="342" y="121" text-anchor="middle" class="caption">192 维嵌入（Embedding）</text>

  <line x1="437" y1="95" x2="460" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="464" y="60" width="180" height="70" class="box"/>
  <text x="554" y="82" text-anchor="middle" class="label" style="font-size: 11.7px">克隆语音合成（Cloning TTS）</text>
  <text x="554" y="105" text-anchor="middle" class="content">F5 / XTTS / VALL-E 2</text>
  <text x="554" y="121" text-anchor="middle" class="caption" style="font-size: 10.2px">文本 + speaker_emb → 梅尔（Mel）</text>

  <line x1="649" y1="95" x2="672" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="676" y="60" width="170" height="70" class="hot"/>
  <text x="761" y="82" text-anchor="middle" class="label">水印（Watermark）</text>
  <text x="761" y="105" text-anchor="middle" class="content">SilentCipher</text>
  <text x="761" y="121" text-anchor="middle" class="caption">约 32 位，不可听（Inaudible）</text>

  <rect x="252" y="155" width="180" height="40" class="box"/>
  <text x="342" y="180" text-anchor="middle" class="content" style="font-size: 9.4px">文本（Text）："add milk to list"</text>
  <line x1="342" y1="155" x2="342" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="230" width="180" height="70" class="box"/>
  <text x="130" y="252" text-anchor="middle" class="label" style="font-size: 13.4px">源语音（Source Speech）</text>
  <text x="130" y="275" text-anchor="middle" class="content">Bob 说 "turn off"</text>
  <text x="130" y="291" text-anchor="middle" class="caption">任意说话人、任意文本</text>

  <line x1="225" y1="265" x2="248" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="252" y="230" width="180" height="70" class="hot"/>
  <text x="342" y="252" text-anchor="middle" class="label" style="font-size: 10.3px">内容提取器（Content Extractor）</text>
  <text x="342" y="275" text-anchor="middle" class="content" style="font-size: 9.8px">ASR 音素后验图（PPG）/ WavLM 帧</text>
  <text x="342" y="291" text-anchor="middle" class="caption" style="font-size: 9.6px">说话人不变表示（Speaker-Invariant）</text>

  <line x1="437" y1="265" x2="460" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="464" y="230" width="180" height="70" class="box"/>
  <text x="554" y="252" text-anchor="middle" class="label" style="font-size: 12.6px">重合成器（Resynthesizer）</text>
  <text x="554" y="275" text-anchor="middle" class="content">KNN-VC / Diff-HierVC</text>
  <text x="554" y="291" text-anchor="middle" class="caption" style="font-size: 10.9px">内容 + alice_emb → 波形（Wav）</text>

  <line x1="649" y1="265" x2="672" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="676" y="230" width="170" height="70" class="hot"/>
  <text x="761" y="252" text-anchor="middle" class="label">输出（Output）</text>
  <text x="761" y="275" text-anchor="middle" class="content">Alice 说 "turn off"</text>
  <text x="761" y="291" text-anchor="middle" class="caption">保留内容（Content）</text>

  <rect x="40" y="330" width="800" height="130" class="hot"/>
  <text x="440" y="354" text-anchor="middle" class="label">法律与伦理技术栈（Legal and Ethical Stack，2026 年必需）</text>
  <text x="60"  y="382" class="content">授权门控（Consent Gate）</text>    <text x="230" y="382" class="caption">推理前检查签名记录与说话人哈希（Hash）匹配</text>
  <text x="60"  y="402" class="content">水印（Watermark）</text>       <text x="230" y="402" class="caption">SilentCipher 或 PerTh；约 32 位载荷（Payload），耐受 MP3</text>
  <text x="60"  y="422" class="content">配套检测器（Detector）</text>   <text x="230" y="422" class="caption">AASIST / RawNet2，与生成器（Generator）一同交付</text>
  <text x="60"  y="442" class="content">审计日志（Audit Log）</text>       <text x="230" y="442" class="caption">每次合成请求均留可检测篡改的记录（Tamper-Evident）</text>
</svg>
