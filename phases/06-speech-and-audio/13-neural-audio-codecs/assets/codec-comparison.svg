<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .tag { font-size: 10px; fill: #c0392b; font-weight: 600; }
      .line { stroke: #1a1a1a; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" class="title">神经音频编解码器（Neural Audio Codecs）：四种 RVQ 变体，语义 / 声学分离</text>

  <rect x="20" y="55" width="200" height="150" class="box"/>
  <text x="120" y="78" text-anchor="middle" class="label">EnCodec (Meta, 2022)</text>
  <text x="120" y="96" text-anchor="middle" class="tag">声学残差量化（RVQ）基线</text>
  <text x="30" y="120" class="content" style="font-size: 10.1px">波形 → 卷积 + Transformer + 卷积</text>
  <text x="30" y="138" class="content">→ 残差量化（RVQ，4–32 个码本）</text>
  <text x="30" y="156" class="content">→ 解码器（Decoder）→ 波形</text>
  <text x="30" y="178" class="caption">75 Hz，24 kHz，MusicGen 使用</text>
  <text x="30" y="196" class="caption">6 kbps 时质量（PESQ）3.2</text>

  <rect x="235" y="55" width="200" height="150" class="box"/>
  <text x="335" y="78" text-anchor="middle" class="label">DAC (Descript, 2023)</text>
  <text x="335" y="96" text-anchor="middle" class="tag">重建领先（Reconstruction）</text>
  <text x="245" y="120" class="content">EnCodec +</text>
  <text x="245" y="138" class="content">L2 归一化码本（Codebooks）</text>
  <text x="245" y="156" class="content" style="font-size: 10.1px">周期激活（Periodic Activations）</text>
  <text x="245" y="174" class="content">改进损失（Losses）</text>
  <text x="245" y="196" class="caption">44.1 kHz 全频带，6 kbps 时 PESQ 3.5</text>

  <rect x="450" y="55" width="200" height="150" class="box"/>
  <text x="550" y="78" text-anchor="middle" class="label">SNAC (Siuzdak 2024)</text>
  <text x="550" y="96" text-anchor="middle" class="tag">多尺度残差量化（Multi-Scale RVQ）</text>
  <text x="460" y="120" class="content">粗码（Coarse）12 Hz</text>
  <text x="460" y="138" class="content">中码（Medium）25 Hz</text>
  <text x="460" y="156" class="content">细码（Fine）50 Hz</text>
  <text x="460" y="178" class="caption" style="font-size: 10.5px">层次化（Hierarchical）→ 适合 AR-LM</text>
  <text x="460" y="196" class="caption">Orpheus-3B 使用</text>

  <rect x="665" y="55" width="200" height="150" class="hot"/>
  <text x="765" y="78" text-anchor="middle" class="label">Mimi (Kyutai 2024)</text>
  <text x="765" y="96" text-anchor="middle" class="tag" style="font-size: 9.8px">语义 / 声学分离（Semantic / Acoustic）</text>
  <text x="675" y="120" class="content">码本 0，从 WavLM 蒸馏</text>
  <text x="675" y="138" class="content">（语义，Semantic）</text>
  <text x="675" y="156" class="content">码本 1–7：声学（Acoustic）</text>
  <text x="675" y="178" class="caption">12.5 Hz，4.4 kbps，支撑 Moshi</text>
  <text x="675" y="196" class="caption">Sesame CSM 使用</text>

  <rect x="20" y="225" width="845" height="100" class="box"/>
  <text x="440" y="247" text-anchor="middle" class="label">为何这对音频语言建模（Language Modeling）重要</text>
  <text x="50" y="274" class="content">10 秒语音 × 12.5 Hz × 8 个码本 = 1000 词元 → 很短的 Transformer 上下文</text>
  <text x="50" y="294" class="content">分解（Factorize）：LM 先预测与文本对齐的语义码本 0，再预测声学码本 1–7</text>
  <text x="50" y="314" class="content">结果：零样本声音克隆（Zero-Shot Cloning），语义 = 内容，声学以参考为条件</text>

  <rect x="20" y="335" width="845" height="115" class="hot"/>
  <text x="440" y="356" text-anchor="middle" class="label">按问题选择（Pick by the Problem）</text>
  <text x="50" y="382" class="content">音乐生成（Music Generation）→ EnCodec-24k，MusicGen、AudioLDM</text>
  <text x="50" y="400" class="content">最高保真度（Fidelity）→ DAC-44.1k，音频修复、编辑</text>
  <text x="50" y="418" class="content">语音自回归语言模型（AR LM）→ SNAC 或 Mimi，TTS、编解码语言模型</text>
  <text x="50" y="436" class="content">全双工流式（Full-Duplex Streaming）→ 仅 Mimi，Moshi、Sesame CSM</text>
</svg>
