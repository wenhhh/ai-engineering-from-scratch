<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e8f1fb; stroke: #2471a3; stroke-width: 1.5; }
      .label { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 10px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">人类反馈强化学习（RLHF）：三个阶段，一个语言模型</text>

  <rect x="30" y="60" width="270" height="360" class="box"/>
  <text x="165" y="88" text-anchor="middle" class="label">阶段 1：监督微调（SFT）</text>
  <text x="50" y="118" class="content">数据：(prompt, ideal_response)</text>
  <text x="50" y="140" class="content">损失：下一词元对数似然</text>
  <text x="50" y="162" class="content">输出：pi_SFT（示范）</text>
  <text x="165" y="200" text-anchor="middle" class="caption">偏向良好行为</text>
  <text x="165" y="220" text-anchor="middle" class="caption">仍是语言模型，可能说谎、啰嗦</text>

  <rect x="50" y="255" width="230" height="140" class="hot"/>
  <text x="165" y="280" text-anchor="middle" class="label">冻结锚点（Frozen Anchor）</text>
  <text x="70" y="310" class="content">pi_ref = pi_SFT</text>
  <text x="70" y="332" class="content">R_phi 从 pi_SFT 初始化</text>
  <text x="165" y="370" text-anchor="middle" class="caption">在阶段 2-3 保持不变</text>

  <rect x="315" y="60" width="270" height="360" class="box"/>
  <text x="450" y="88" text-anchor="middle" class="label">阶段 2：奖励模型（Reward Model）</text>
  <text x="335" y="118" class="content">数据：(x, y_+, y_-) 偏好</text>
  <text x="335" y="140" class="content">损失：Bradley-Terry</text>
  <text x="335" y="162" class="content">  -log sig(R_phi(x,y_+)-R_phi(x,y_-))</text>
  <text x="335" y="200" class="content">输出：标量 R_phi(x, y)</text>
  <text x="450" y="235" text-anchor="middle" class="caption">偏好（Preferences）-&gt; 奖励（Reward）</text>

  <rect x="335" y="280" width="230" height="120" class="cool"/>
  <text x="450" y="305" text-anchor="middle" class="label">2026 年替代方案</text>
  <text x="355" y="330" class="content">DPO 完全跳过 R_phi：</text>
  <text x="355" y="352" class="content">pi 上的闭式偏好损失</text>
  <text x="450" y="385" text-anchor="middle" class="caption">质量相同，计算更少</text>

  <rect x="600" y="60" width="270" height="360" class="box"/>
  <text x="735" y="88" text-anchor="middle" class="label">阶段 3：近端策略优化（PPO）</text>
  <text x="620" y="118" class="content">采样 y ~ pi_theta(. | x)</text>
  <text x="620" y="140" class="content">reward = R_phi(x, y)</text>
  <text x="620" y="162" class="content" style="font-size: 8px">          - beta * KL(pi_theta || pi_ref)</text>
  <text x="620" y="185" class="content">PPO 裁剪替代目标更新</text>
  <text x="735" y="225" text-anchor="middle" class="caption">KL 使 pi 保持在流形（Manifold）附近</text>
  <text x="735" y="245" text-anchor="middle" class="caption">即 R_phi 接受训练的区域</text>

  <rect x="620" y="275" width="230" height="125" class="hot"/>
  <text x="735" y="300" text-anchor="middle" class="label">诊断（Diagnostics）</text>
  <text x="640" y="325" class="content">平均 KL &lt; 10</text>
  <text x="640" y="345" class="content">RM 得分上升</text>
  <text x="640" y="365" class="content">人工评估：稳定或上升</text>
  <text x="735" y="390" text-anchor="middle" class="caption" style="font-size: 9px">留出集：奖励投机（Reward Hacking）告警</text>

  <text x="450" y="450" text-anchor="middle" class="caption">2022 年：InstructGPT / ChatGPT 基于此方案发布 · 2026 年：DPO + GRPO 承担多数工作</text>
</svg>
