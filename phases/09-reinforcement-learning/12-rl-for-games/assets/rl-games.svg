<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e8f1fb; stroke: #2471a3; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 10px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">自我对弈（Self-play）+ 搜索 + 策略改进：一套方案，三个时代</text>

  <rect x="40" y="60" width="260" height="360" class="box"/>
  <text x="170" y="88" text-anchor="middle" class="label">AlphaZero (2017)</text>
  <text x="60" y="115" class="content">环境：国际象棋 / 将棋 / 围棋</text>
  <text x="60" y="135" class="content">规则：已知</text>
  <text x="60" y="160" class="content" style="font-size: 9px">策略—价值网络（Policy-Value Net）(p, v)</text>
  <text x="60" y="180" class="content">采用 PUCT 的蒙特卡洛树搜索（MCTS）</text>
  <text x="60" y="205" class="content">目标：pi_MCTS, z_outcome</text>
  <text x="60" y="225" class="content">L = (v-z)^2 - pi * log p</text>
  <text x="170" y="265" text-anchor="middle" class="caption">从零开始自我对弈</text>
  <text x="170" y="285" text-anchor="middle" class="caption">围棋、国际象棋、将棋</text>
  <text x="170" y="320" text-anchor="middle" class="caption">要求：完美仿真（Perfect Simulation）</text>
  <text x="170" y="340" text-anchor="middle" class="caption">离散动作（Discrete Actions）</text>
  <text x="170" y="360" text-anchor="middle" class="caption">零和（Zero-sum）</text>

  <rect x="320" y="60" width="260" height="360" class="hot"/>
  <text x="450" y="88" text-anchor="middle" class="label">MuZero (2019)</text>
  <text x="340" y="115" class="content">环境：任意</text>
  <text x="340" y="135" class="content">规则：学习得到（g）</text>
  <text x="340" y="160" class="content" style="font-size: 9px">编码器（Encoder）h，动力学（Dynamics）g</text>
  <text x="340" y="180" class="content">在潜在空间（Latent Space）执行 MCTS</text>
  <text x="340" y="205" class="content">目标：pi_MCTS, z, reward</text>
  <text x="340" y="225" class="content">L = 在时域上求和</text>
  <text x="450" y="265" text-anchor="middle" class="caption">无需仿真器</text>
  <text x="450" y="285" text-anchor="middle" class="caption">Atari、围棋、国际象棋、将棋</text>
  <text x="450" y="320" text-anchor="middle" class="caption">相同循环，学习得到的模型</text>
  <text x="450" y="340" text-anchor="middle" class="caption">计算成本更高</text>
  <text x="450" y="360" text-anchor="middle" class="caption">已有随机扩展（Stochastic Extensions）</text>

  <rect x="600" y="60" width="260" height="360" class="cool"/>
  <text x="730" y="88" text-anchor="middle" class="label">GRPO (2024-2025)</text>
  <text x="620" y="115" class="content">环境：大语言模型推理</text>
  <text x="620" y="135" class="content">动作：下一个词元（Token）</text>
  <text x="620" y="160" class="content">验证器（Verifier）：测试 / 数学检查</text>
  <text x="620" y="180" class="content">组采样（Group Sampling），G 条轨迹</text>
  <text x="620" y="205" class="content">A_i = (r_i - mean_r) / std_r</text>
  <text x="620" y="225" class="content">L = -A * log pi + beta KL</text>
  <text x="730" y="265" text-anchor="middle" class="caption">无评论家（Critic），无奖励模型</text>
  <text x="730" y="285" text-anchor="middle" class="caption">数学、代码、推理</text>
  <text x="730" y="320" text-anchor="middle" class="caption">DeepSeek-R1 方案</text>
  <text x="730" y="340" text-anchor="middle" class="caption">组相对基线（Group-relative Baseline）</text>
  <text x="730" y="360" text-anchor="middle" class="caption">与 AlphaZero 思路相同</text>

  <text x="450" y="445" text-anchor="middle" class="caption">模式：采样多条轨迹，排序，训练策略以提高优质轨迹的概率</text>
</svg>
