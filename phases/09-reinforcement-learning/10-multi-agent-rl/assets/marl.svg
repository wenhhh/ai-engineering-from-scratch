<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e8f1fb; stroke: #2471a3; stroke-width: 1.5; }
      .label { font-size: 11px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 10px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">四种多智能体强化学习（MARL）范式，相同环境结构</text>

  <rect x="40" y="60" width="200" height="170" class="box"/>
  <text x="140" y="88" text-anchor="middle" class="label">独立 PPO / Q（Independent）</text>
  <text x="60" y="115" class="content">每个智能体拥有自己的</text>
  <text x="60" y="135" class="content">策略（Policy）与评论家（Critic）</text>
  <text x="60" y="160" class="content">把其他智能体视为环境</text>
  <text x="140" y="195" text-anchor="middle" class="caption">简单，没有协调信号</text>
  <text x="140" y="215" text-anchor="middle" class="caption">紧耦合时失效</text>

  <rect x="260" y="60" width="200" height="170" class="hot"/>
  <text x="360" y="88" text-anchor="middle" class="label">集中训练、分散执行（CTDE）</text>
  <text x="280" y="115" class="content" style="font-size: 8px">分散式演员（Decentralized Actor）：</text>
  <text x="280" y="133" class="content">  pi_i(a_i | o_i)</text>
  <text x="280" y="158" class="content" style="font-size: 8px">集中式评论家（Centralized Critic）：</text>
  <text x="280" y="176" class="content">  Q(s, a_1, .., a_n)</text>
  <text x="360" y="210" text-anchor="middle" class="caption">2026 年合作默认方案：MAPPO/QMIX</text>

  <rect x="480" y="60" width="200" height="170" class="cool"/>
  <text x="580" y="88" text-anchor="middle" class="label">自我对弈（Self-play）</text>
  <text x="500" y="115" class="content">单个智能体，两个角色</text>
  <text x="500" y="135" class="content">对手 = 历史快照</text>
  <text x="500" y="160" class="content">对称梯度（Symmetric Gradients）</text>
  <text x="580" y="195" text-anchor="middle" class="caption">零和游戏（Zero-sum Games）</text>
  <text x="580" y="215" text-anchor="middle" class="caption">AlphaGo / AlphaZero</text>

  <rect x="700" y="60" width="160" height="170" class="box"/>
  <text x="780" y="88" text-anchor="middle" class="label">联赛（League Play）</text>
  <text x="715" y="115" class="content">策略种群（Population）：</text>
  <text x="715" y="133" class="content">历史 + 当前</text>
  <text x="715" y="153" class="content">策略；从中采样</text>
  <text x="715" y="171" class="content">对手</text>
  <text x="780" y="210" text-anchor="middle" class="caption">AlphaStar</text>

  <rect x="40" y="260" width="820" height="150" class="box"/>
  <text x="450" y="285" text-anchor="middle" class="label">核心困难（Core Difficulty）</text>
  <text x="60" y="315" class="content">从智能体 i 的角度看，环境现在包含 pi_{-i}</text>
  <text x="60" y="335" class="content">随着 pi_{-i} 学习，转移 P(s' | s, a_i) 变得非平稳（Non-stationary）</text>
  <text x="60" y="355" class="content">马尔可夫性质（Markov Property）失效 -&gt; 表格方法的收敛证明不再适用</text>
  <text x="60" y="378" class="caption">CTDE 让评论家以完整联合动作为条件解决此问题；自我对弈通过结构解决</text>

  <text x="450" y="445" text-anchor="middle" class="caption">加入通信（Communication）、语言或 MCTS，就得到 StarCraft II / Dota 2 / 多智能体大语言模型系统</text>
</svg>
