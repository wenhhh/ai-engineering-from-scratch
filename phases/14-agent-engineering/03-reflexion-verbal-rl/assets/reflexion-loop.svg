<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">Reflexion：行动者、评估器、自我反思器与情景记忆</text>

  <rect x="60" y="60" width="180" height="60" class="cool"/>
  <text x="150" y="84" text-anchor="middle" class="step">行动者（Actor）</text>
  <text x="150" y="102" text-anchor="middle" class="small">ReAct 轨迹（Trajectory）</text>

  <rect x="60" y="180" width="180" height="60" class="cold"/>
  <text x="150" y="204" text-anchor="middle" class="step">评估器（Evaluator）</text>
  <text x="150" y="222" text-anchor="middle" class="small">二元 / 启发式 / 自我评估</text>

  <rect x="60" y="300" width="180" height="60" class="hot"/>
  <text x="150" y="320" text-anchor="middle" class="step">自我反思器（Self-Reflector）</text>
  <text x="150" y="342" text-anchor="middle" class="small">用自然语言诊断失败原因</text>

  <rect x="60" y="420" width="180" height="80" class="dsk"/>
  <text x="150" y="440" text-anchor="middle" class="step">情景记忆（Episodic memory）</text>
  <text x="150" y="460" text-anchor="middle" class="small">长度有上限的反思列表</text>
  <text x="150" y="480" text-anchor="middle" class="small">放在下一次试验的提示词开头</text>

  <line x1="150" y1="120" x2="150" y2="180" class="edge" marker-end="url(#arrow)"/>
  <line x1="150" y1="240" x2="150" y2="300" class="edge" marker-end="url(#arrow)"/>
  <line x1="150" y1="360" x2="150" y2="420" class="edge" marker-end="url(#arrow)"/>
  <path d="M240,450 Q340,450 340,90 L240,90" class="edge" marker-end="url(#arrow)"/>
  <text x="330" y="270" class="small">反馈循环</text>

  <rect x="380" y="60" width="540" height="200" class="box"/>
  <text x="650" y="84" text-anchor="middle" class="head">三类评估器（Evaluator）</text>

  <rect x="400" y="100" width="500" height="40" class="cool"/>
  <text x="420" y="124" class="step">标量（Scalar）：二元或数值参照（测试通过、答案正确）</text>

  <rect x="400" y="148" width="500" height="40" class="cold"/>
  <text x="420" y="172" class="step">启发式（Heuristic）：循环卡住、步数过多、重复行动等特征</text>

  <rect x="400" y="196" width="500" height="40" class="hot"/>
  <text x="420" y="220" class="step">自评（Self-eval）：LLM 评判自身轨迹（信号弱，需工具依据）</text>

  <rect x="380" y="280" width="540" height="220" class="box"/>
  <text x="650" y="304" text-anchor="middle" class="head">2026 年的实现实例</text>
  <text x="400" y="328" class="step">Letta 休眠时计算（Sleep-time compute）</text>
  <text x="400" y="346" class="small">独立反思智能体在关键执行路径之外运行，写入记忆块</text>
  <text x="400" y="368" class="step">pro-workflow /learn-rule</text>
  <text x="400" y="386" class="small">人工记录反思并写入项目记忆，随时间整理维护</text>
  <text x="400" y="408" class="step">Claude Code /memory</text>
  <text x="400" y="426" class="small">CLAUDE.md 充当跨会话的长期情景缓冲区</text>
  <text x="400" y="448" class="step">LangGraph 反思节点（Reflection nodes）</text>
  <text x="400" y="466" class="small">图节点负责评分，并路由到改进或结束</text>
  <text x="400" y="488" class="small">记忆腐化（Memory rot）：反思积累后会过时；采用压缩、TTL 或去重</text>
</svg>
