<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">工具使用栈：结构定义（Schema）-&gt; 验证 -&gt; 分派 -&gt; 结构化观察结果</text>

  <rect x="40" y="60" width="880" height="80" class="box"/>
  <text x="480" y="84" text-anchor="middle" class="head">工具目录（Tool catalog）：模型看到的内容</text>
  <text x="60" y="108" class="step">add(a int, b int)  --  将整数 a 和 b 相加。适用于任何整数加法。</text>
  <text x="60" y="124" class="step">multiply(a int, b int)  --  将两个整数相乘。优先用乘法，而不是循环相加。</text>

  <rect x="40" y="160" width="280" height="360" class="box"/>
  <text x="180" y="184" text-anchor="middle" class="head">参数验证（Argument validation）</text>
  <rect x="60" y="200" width="240" height="46" class="cool"/>
  <text x="80" y="224" class="step">类型强制转换（Type coercion）</text>
  <text x="80" y="240" class="small">无歧义时："5" -&gt; 5</text>

  <rect x="60" y="254" width="240" height="46" class="cold"/>
  <text x="80" y="278" class="step">枚举检查（Enum check）</text>
  <text x="80" y="294" class="small">status in {open,closed,pending}</text>

  <rect x="60" y="308" width="240" height="46" class="hot"/>
  <text x="80" y="332" class="step">必填字段（Required fields）</text>
  <text x="80" y="348" class="small">缺失 -&gt; 结构化错误观察结果</text>

  <rect x="60" y="362" width="240" height="46" class="dsk"/>
  <text x="80" y="386" class="step">范围 / 最小值 / 最大值</text>
  <text x="80" y="402" class="small">检查数值边界（Range / min / max）</text>

  <rect x="60" y="416" width="240" height="46" class="box"/>
  <text x="80" y="440" class="step">沙箱策略（Sandbox policy）</text>
  <text x="80" y="456" class="small">每工具的超时、文件系统范围、网络</text>

  <text x="60" y="484" class="small">绝不向循环抛出异常；每次失败</text>
  <text x="60" y="500" class="small">都成为模型可读的观察结果</text>

  <rect x="340" y="160" width="280" height="360" class="box"/>
  <text x="480" y="184" text-anchor="middle" class="head">分派（Dispatch）</text>
  <rect x="360" y="200" width="240" height="140" class="cool"/>
  <text x="480" y="224" text-anchor="middle" class="step">并行工具调用</text>
  <text x="380" y="248" class="small">助手轮次输出 N 个 tool_use 块</text>
  <text x="380" y="264" class="small">每个都有不同的 tool_use_id</text>
  <text x="380" y="280" class="small">运行时并行执行独立调用</text>
  <text x="380" y="296" class="small">结果通过 tool_use_id 关联回去</text>
  <text x="380" y="312" class="small">交换标识就会路由错误</text>
  <text x="380" y="332" class="small">Anthropic、OpenAI、Bedrock 均要求</text>

  <rect x="360" y="350" width="240" height="160" class="cold"/>
  <text x="480" y="374" text-anchor="middle" class="step">执行（Execution）</text>
  <text x="380" y="398" class="small">捕获异常</text>
  <text x="380" y="414" class="small">强制超时</text>
  <text x="380" y="430" class="small">结果转为字符串，附带结构提示</text>
  <text x="380" y="446" class="small">优先使用结构化 JSON，而非自然语言</text>
  <text x="380" y="462" class="small">重复失败时触发熔断器</text>
  <text x="380" y="478" class="small">输出跨度（OTel GenAI tool_call）</text>
  <text x="380" y="494" class="small">为事后复盘保留审计轨迹</text>

  <rect x="640" y="160" width="280" height="360" class="box"/>
  <text x="780" y="184" text-anchor="middle" class="head">BFCL V4 组成</text>
  <rect x="660" y="200" width="240" height="44" class="cool"/>
  <text x="780" y="226" text-anchor="middle" class="step">智能体式（Agentic）40%</text>

  <rect x="660" y="250" width="240" height="44" class="cold"/>
  <text x="780" y="276" text-anchor="middle" class="step">多轮（Multi-turn）30%</text>

  <rect x="660" y="300" width="240" height="44" class="hot"/>
  <text x="780" y="326" text-anchor="middle" class="step">真实请求（Live）10%</text>

  <rect x="660" y="350" width="240" height="44" class="dsk"/>
  <text x="780" y="376" text-anchor="middle" class="step">合成请求（Non-Live）10%</text>

  <rect x="660" y="400" width="240" height="44" class="box"/>
  <text x="780" y="426" text-anchor="middle" class="step">幻觉（Hallucination）10%</text>

  <text x="660" y="456" class="small">单轮已解决；记忆、动态决策</text>
  <text x="660" y="472" class="small">和长链仍是未解决问题</text>
  <text x="660" y="496" class="small">gorilla.cs.berkeley.edu/leaderboard.html</text>
</svg>
