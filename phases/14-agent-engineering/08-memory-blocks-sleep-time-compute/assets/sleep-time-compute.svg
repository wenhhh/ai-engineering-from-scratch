<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .primary { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .sleep { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .block { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">Letta V1：记忆块（Memory blocks）与休眠时计算（Sleep-time compute）</text>

  <rect x="40" y="50" width="420" height="220" class="primary"/>
  <text x="250" y="72" text-anchor="middle" class="head">主智能体（Primary agent，位于关键路径）</text>
  <text x="60" y="96" class="small">响应用户；快速写入原始事实；不进行整合</text>

  <rect x="60" y="108" width="380" height="46" class="box"/>
  <text x="78" y="130" class="step">第 1 轮 用户：“我叫 ava，住在柏林”</text>
  <text x="78" y="146" class="small">block_append human "name=ava city=Berlin"</text>

  <rect x="60" y="162" width="380" height="46" class="box"/>
  <text x="78" y="184" class="step">第 2 轮 用户：“为高级工程师规划课程”</text>
  <text x="78" y="200" class="small">block_append task "audience=senior eng"</text>

  <rect x="60" y="208" width="380" height="46" class="box"/>
  <text x="78" y="230" class="step">第 3 轮 用户：“我搬到了里斯本”</text>
  <text x="78" y="246" class="small">block_append human "city=Lisbon"；块中现有两座城市</text>

  <rect x="500" y="50" width="420" height="220" class="sleep"/>
  <text x="710" y="72" text-anchor="middle" class="head">休眠时智能体（Sleep-time agent，位于关键路径外）</text>
  <text x="520" y="96" class="small">轮次间运行；允许更强模型；没有延迟代价</text>

  <rect x="520" y="108" width="380" height="46" class="box"/>
  <text x="538" y="130" class="step">扫描块；near_limit 时总结</text>
  <text x="538" y="146" class="small">压缩用户块：去掉重复项，保留最新值</text>

  <rect x="520" y="162" width="380" height="46" class="box"/>
  <text x="538" y="184" class="step">协调归档；使过时事实失效</text>
  <text x="538" y="200" class="small">与核心层矛盾时触发失效，而非删除</text>

  <rect x="520" y="208" width="380" height="46" class="box"/>
  <text x="538" y="230" class="step">将 learned_context 写入共享块</text>
  <text x="538" y="246" class="small">为下一轮生成新的稳定事实</text>

  <rect x="40" y="290" width="880" height="220" class="block"/>
  <text x="480" y="312" text-anchor="middle" class="head">Letta 记忆的三个层级</text>

  <rect x="60" y="322" width="280" height="170" class="box"/>
  <text x="200" y="342" text-anchor="middle" class="head">核心（Core，始终可见）</text>
  <text x="78" y="364" class="step">块：human, persona, task</text>
  <text x="78" y="382" class="small">通过 block_{append,replace,rewrite} 编辑</text>
  <text x="78" y="400" class="small">每块的字符上限</text>
  <text x="78" y="418" class="small">near_limit 触发休眠时总结</text>
  <text x="78" y="438" class="small">角色设定块 / 安全块写入需要评审</text>
  <text x="78" y="458" class="small">带版本；差异显示在轨迹中</text>
  <text x="78" y="478" class="small">每轮固定在提示词中</text>

  <rect x="350" y="322" width="280" height="170" class="box"/>
  <text x="490" y="342" text-anchor="middle" class="head">回忆（Recall，对话）</text>
  <text x="368" y="364" class="step">分页的轮次日志</text>
  <text x="368" y="382" class="small">每轮自动写入</text>
  <text x="368" y="400" class="small">通过 conversation_search 检索</text>
  <text x="368" y="418" class="small">达到上限时驱逐尾部</text>
  <text x="368" y="438" class="small">引用：session_id + turn_id</text>
  <text x="368" y="458" class="small">主智能体读取；休眠时智能体总结</text>
  <text x="368" y="478" class="small">有损，但始终可寻址</text>

  <rect x="640" y="322" width="280" height="170" class="box"/>
  <text x="780" y="342" text-anchor="middle" class="head">归档（Archival，外部）</text>
  <text x="658" y="364" class="step">向量 + KV + 图（第 09 课）</text>
  <text x="658" y="382" class="small">archival_memory_{insert,search}</text>
  <text x="658" y="400" class="small">出现矛盾时使其失效，而非删除</text>
  <text x="658" y="418" class="small">作用域标签：user/session/agent</text>
  <text x="658" y="438" class="small">检索时视为不可信（第 27 课）</text>
  <text x="658" y="458" class="small">休眠时对词元重叠 &gt;90% 的内容去重</text>
  <text x="658" y="478" class="small">可扩展到上下文窗口之外</text>

  <text x="480" y="540" text-anchor="middle" class="caption">Letta V1 用原生推理替换 send_message + 心跳；循环形态不变。</text>
</svg>
