<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">ReAct 循环：思考（Thought）、行动（Action）、观察（Observation），直到触发停止条件</text>

  <rect x="40" y="60" width="340" height="460" class="box"/>
  <text x="210" y="82" text-anchor="middle" class="head">五个要素（The five ingredients）</text>

  <rect x="60" y="100" width="300" height="64" class="cool"/>
  <text x="80" y="122" class="step">1. 消息缓冲区（Message buffer）</text>
  <text x="80" y="140" class="small">user, assistant, tool, assistant, tool, ...</text>
  <text x="80" y="156" class="small" style="font-size:9px">Anthropic 与 OpenAI 的结构定义（Schema）均表达此结构</text>

  <rect x="60" y="172" width="300" height="64" class="cold"/>
  <text x="80" y="194" class="step">2. 工具注册表（Tool registry）</text>
  <text x="80" y="212" class="small" style="font-size:9px">名称 - 结构定义（Schema）- 可调用对象；分派时验证</text>
  <text x="80" y="228" class="small">注册表就是沙箱（Sandbox）边界</text>

  <rect x="60" y="244" width="300" height="64" class="hot"/>
  <text x="80" y="266" class="step">3. 停止条件（Stop condition）</text>
  <text x="80" y="284" class="small">显式 finish、没有工具调用、预算耗尽</text>
  <text x="80" y="300" class="small">选择一种；混用会掩盖提前终止错误</text>

  <rect x="60" y="316" width="300" height="64" class="dsk"/>
  <text x="80" y="338" class="step">4. 轮次预算（Turn budget）</text>
  <text x="80" y="356" class="small">迭代次数的硬上限；40-400 步很常见</text>
  <text x="80" y="372" class="small">按任务类别调整，不使用单一全局值</text>

  <rect x="60" y="388" width="300" height="64" class="box"/>
  <text x="80" y="406" class="step">5. 观察结果格式化器</text>
  <text x="80" y="419" class="small">（Observation formatter）</text>
  <text x="80" y="433" class="small">每个 400 错误转为字符串，不导致崩溃</text>
  <text x="80" y="447" class="small">并行工具调用需要 tool_use_id</text>

  <rect x="400" y="60" width="540" height="460" class="box"/>
  <text x="670" y="82" text-anchor="middle" class="head">一个循环及其注解</text>

  <rect x="420" y="100" width="500" height="50" class="cool"/>
  <text x="440" y="122" class="step">思考（Thought） “需要算出 120 的税额再加上它”</text>
  <text x="440" y="140" class="small">2026 年使用原生推理通道（Responses API），此前是内联词元</text>

  <rect x="420" y="158" width="500" height="50" class="cold"/>
  <text x="440" y="180" class="step">行动（Action） calculator(expr="120 * 0.15")</text>
  <text x="440" y="198" class="small">结构化输出，通过工具注册表分派</text>

  <rect x="420" y="216" width="500" height="50" class="hot"/>
  <text x="440" y="238" class="step">观察（Observation） 18.0</text>
  <text x="440" y="256" class="small">不可信；检索内容可能含有注入指令</text>

  <rect x="420" y="274" width="500" height="50" class="cool"/>
  <text x="440" y="296" class="step">思考（Thought） “计算 120 + 18.0，然后结束”</text>
  <text x="440" y="314" class="small">重复循环，直到某个助手轮次没有工具调用</text>

  <rect x="420" y="332" width="500" height="50" class="cold"/>
  <text x="440" y="354" class="step">行动（Action） calculator(expr="120 + 18.0")</text>
  <text x="440" y="372" class="small">可以并行分派；tool_use_id 用于关联结果</text>

  <rect x="420" y="390" width="500" height="50" class="hot"/>
  <text x="440" y="412" class="step">观察（Observation） 138.0</text>
  <text x="440" y="430" class="small">反馈观察结果；递减循环预算</text>

  <rect x="420" y="448" width="500" height="50" class="box"/>
  <text x="440" y="470" class="step">结束（Finish） “含 15% 税的总额为 138.0”</text>
  <text x="440" y="488" class="small">满足停止条件；按 OTel GenAI 以跨度（Span）输出轨迹</text>

  <text x="480" y="540" text-anchor="middle" class="caption">ReAct（Yao 等人，2023）是 2026 年的基础。框架封装它，循环本身不变。</text>
</svg>
