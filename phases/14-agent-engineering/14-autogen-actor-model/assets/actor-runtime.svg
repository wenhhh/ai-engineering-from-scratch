<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .actor { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .msg { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .rt { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dlq { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">AutoGen v0.4：带故障隔离的参与者模型运行时（Actor model runtime）</text>

  <rect x="40" y="50" width="880" height="200" class="rt"/>
  <text x="480" y="72" text-anchor="middle" class="head">运行时：事件循环、每参与者收件箱、带故障隔离的投递</text>

  <rect x="60" y="90" width="220" height="140" class="actor"/>
  <text x="170" y="112" text-anchor="middle" class="head">参与者：checklist</text>
  <text x="78" y="134" class="small">私有状态（结果、共识）</text>
  <text x="78" y="152" class="small">收件箱双端队列（Deque）</text>
  <text x="78" y="170" class="small">receive(message, runtime)</text>
  <text x="78" y="188" class="small">send() 放入运行时队列</text>
  <text x="78" y="208" class="small">不与其他参与者共享内存</text>

  <rect x="300" y="90" width="220" height="140" class="actor"/>
  <text x="410" y="112" text-anchor="middle" class="head">参与者：reviewer</text>
  <text x="318" y="134" class="small">私有状态（结论）</text>
  <text x="318" y="152" class="small">处理 topic=review</text>
  <text x="318" y="170" class="small">以 review_result 回复</text>
  <text x="318" y="188" class="small">处理器可能抛异常，路由到 DLQ</text>
  <text x="318" y="208" class="small">其他参与者继续运行</text>

  <rect x="540" y="90" width="360" height="140" class="box"/>
  <text x="720" y="112" text-anchor="middle" class="head">共享运行时队列</text>
  <rect x="560" y="128" width="320" height="26" class="msg"/>
  <text x="578" y="146" class="step">m001 checklist "start" [snippets]</text>
  <rect x="560" y="160" width="320" height="26" class="msg"/>
  <text x="578" y="178" class="step">m002 reviewer "crash_me"（将失败）</text>
  <rect x="560" y="192" width="320" height="26" class="msg"/>
  <text x="578" y="210" class="step">m003-m005 reviewer "review" 3x</text>

  <rect x="40" y="270" width="440" height="220" class="box"/>
  <text x="260" y="292" text-anchor="middle" class="head">轨迹示例：故障隔离</text>
  <rect x="60" y="308" width="400" height="26" class="box"/>
  <text x="78" y="326" class="step">运行时投递 m002，reviewer 抛出异常</text>
  <rect x="60" y="340" width="400" height="26" class="box"/>
  <text x="78" y="358" class="step">DLQ: m002 "RuntimeError: simulated handler failure"</text>
  <rect x="60" y="372" width="400" height="26" class="box"/>
  <text x="78" y="390" class="step">运行时继续投递 m003-m005</text>
  <rect x="60" y="404" width="400" height="26" class="box"/>
  <text x="78" y="422" class="step">reviewer 为每条回复 review_result</text>
  <rect x="60" y="436" width="400" height="26" class="box"/>
  <text x="78" y="454" class="step">checklist 对 3 个结果达成共识</text>

  <rect x="500" y="270" width="420" height="220" class="dlq"/>
  <text x="710" y="292" text-anchor="middle" class="head">v0.4 的三个 API 层</text>
  <rect x="520" y="308" width="380" height="46" class="box"/>
  <text x="538" y="330" class="step" style="font-size:10px">核心层 Core：AgentRuntime, Agent, Message, Topic</text>
  <text x="538" y="346" class="small">底层、异步、事件驱动</text>
  <rect x="520" y="360" width="380" height="46" class="box"/>
  <text x="538" y="382" class="step">AgentChat  RoundRobin, Selector, AssistantAgent</text>
  <text x="538" y="398" class="small">任务驱动高层 API（替代 v0.2）</text>
  <rect x="520" y="412" width="380" height="66" class="box"/>
  <text x="538" y="434" class="step" style="font-size:10px">扩展层 Extensions：OpenAI, Anthropic, Azure, 工具</text>
  <text x="538" y="452" class="small">Magentic-One 是基于 AgentChat 的参考团队</text>
  <text x="538" y="470" class="small">默认启用 OTel GenAI 跨度（第 23 课）</text>

  <text x="480" y="540" text-anchor="middle" class="caption">v0.7.x 处于维护模式。Microsoft Agent Framework（2025 年 10 月预览）是后续方向，思想相同。</text>
</svg>
