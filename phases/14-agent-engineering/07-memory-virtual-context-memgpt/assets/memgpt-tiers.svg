<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .ram { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .disk { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .tool { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">MemGPT：将虚拟上下文类比为操作系统内存（Packer 等人，2023）</text>

  <rect x="40" y="60" width="380" height="200" class="ram"/>
  <text x="230" y="82" text-anchor="middle" class="head">主上下文（Main context，类比 RAM）</text>
  <text x="60" y="108" class="small">固定大小的提示词窗口，始终对模型可见</text>

  <rect x="60" y="118" width="340" height="60" class="box"/>
  <text x="80" y="138" class="step">[core] 角色设定、用户、任务</text>
  <text x="80" y="156" class="small">命名章节固定在提示词中</text>
  <text x="80" y="172" class="small">通过 core_memory_{append,replace} 编辑</text>

  <rect x="60" y="186" width="340" height="60" class="box"/>
  <text x="80" y="206" class="step">[messages] 最近轮次</text>
  <text x="80" y="224" class="small">FIFO 缓冲区；达到上限时驱逐最旧轮次</text>
  <text x="80" y="240" class="small">被驱逐轮次可通过 conversation_search 获取</text>

  <rect x="40" y="280" width="380" height="240" class="disk"/>
  <text x="230" y="302" text-anchor="middle" class="head">归档记忆（Archival memory，类比磁盘）</text>
  <text x="60" y="328" class="small">无界、可搜索的外部存储</text>

  <rect x="60" y="340" width="340" height="60" class="box"/>
  <text x="80" y="360" class="step">记录：id, text, tags, session, turn</text>
  <text x="80" y="378" class="small">通过 archival_memory_insert 写入</text>
  <text x="80" y="394" class="small">通过 archival_memory_search(top_k) 检索</text>

  <rect x="60" y="408" width="340" height="60" class="box"/>
  <text x="80" y="428" class="step">可插拔后端（Pluggable backend）</text>
  <text x="80" y="446" class="small">向量（语义）、KV（事实）、图（关系）</text>
  <text x="80" y="462" class="small">第 09 课（Mem0）融合三者</text>

  <text x="230" y="496" text-anchor="middle" class="caption">每次写入携带引用（session_id, turn_id）</text>

  <rect x="440" y="60" width="500" height="460" class="box"/>
  <text x="690" y="82" text-anchor="middle" class="head">中断模式（Interrupt pattern）：一个轮次</text>

  <rect x="460" y="100" width="460" height="46" class="ram"/>
  <text x="478" y="122" class="step">1. 助手：“需要知道用户当前的项目”</text>
  <text x="478" y="138" class="small">主上下文缺少该事实；仅靠窗口无法回答</text>

  <rect x="460" y="154" width="460" height="46" class="tool"/>
  <text x="478" y="176" class="step">2. 工具调用 archival_memory_search("project for ava")</text>
  <text x="478" y="192" class="small">发出记忆工具调用；运行时像服务系统调用一样处理</text>

  <rect x="460" y="208" width="460" height="46" class="disk"/>
  <text x="478" y="230" class="step">3. 归档返回记录 a001</text>
  <text x="478" y="246" class="small">“ava 正在构建包含 12 个工具的检索机器人”</text>

  <rect x="460" y="262" width="460" height="46" class="tool"/>
  <text x="478" y="284" class="step">4. 运行时将观察结果拼接到下一助手轮次</text>
  <text x="478" y="300" class="small">与 ReAct 循环中的其他工具观察结果形态相同</text>

  <rect x="460" y="316" width="460" height="46" class="ram"/>
  <text x="478" y="338" class="step">5. 助手回答并引用 a001</text>
  <text x="478" y="354" class="small">检索可追溯到来源记录</text>

  <rect x="460" y="370" width="460" height="46" class="box"/>
  <text x="478" y="392" class="step">6. 出现新事实：archival_memory_insert</text>
  <text x="478" y="408" class="small">写回为下一次会话闭合循环</text>

  <rect x="460" y="424" width="460" height="46" class="box"/>
  <text x="478" y="446" class="step">7. 定期整合（Letta 休眠时处理，第 08 课）</text>
  <text x="478" y="462" class="small">过时记录去重，使被反驳的事实失效</text>

  <line x1="420" y1="170" x2="460" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="230" x2="460" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="390" x2="420" y2="390" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="480" y="540" text-anchor="middle" class="caption">Letta（2024）扩展到三层。Mem0（2025）用向量 + KV + 图替代归档。模式仍然延续。</text>
</svg>
