<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .mode { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .mit { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .tax { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">智能体失效模式（Failure modes）：分类、五种常见模式、缓解措施</text>

  <rect x="40" y="50" width="440" height="250" class="tax"/>
  <text x="260" y="72" text-anchor="middle" class="head">2024–2026 年分类体系</text>
  <rect x="60" y="88" width="400" height="46" class="box"/>
  <text x="78" y="108" class="step">MASFT（Berkeley，2025）：14 种模式、3 类</text>
  <text x="78" y="124" class="small">标注 Cohen's Kappa 为 0.88，类别可可靠区分</text>
  <rect x="60" y="140" width="400" height="46" class="box"/>
  <text x="78" y="160" class="step">Microsoft 分类：自主性放大 AI 失败</text>
  <text x="78" y="176" class="small">智能体拥有工具时，偏见、幻觉和泄漏更严重</text>
  <rect x="60" y="192" width="400" height="46" class="box"/>
  <text x="78" y="212" class="step" style="font-size: 10px">智能体 AI 故障特征（Characterizing Faults in Agentic AI）</text>
  <text x="78" y="228" class="small">编排 + 状态演化 + 环境交互</text>
  <rect x="60" y="244" width="400" height="46" class="box"/>
  <text x="78" y="264" class="step" style="font-size: 10px">幻觉综述（Hallucinations Survey，arXiv:2509.18970）</text>
  <text x="78" y="280" class="small">指令偏离 + 长距离上下文误用</text>

  <rect x="500" y="50" width="420" height="250" class="mode"/>
  <text x="710" y="72" text-anchor="middle" class="head">行业反复出现的五种模式</text>
  <rect x="520" y="88" width="380" height="36" class="box"/>
  <text x="538" y="110" class="step">1. 幻觉动作：虚构工具、捏造参数</text>
  <rect x="520" y="128" width="380" height="36" class="box"/>
  <text x="538" y="150" class="step">2. 范围蔓延：额外 PR、邮件、写入</text>
  <rect x="520" y="168" width="380" height="36" class="box"/>
  <text x="538" y="190" class="step">3. 级联错误：一次错误，N 次下游操作</text>
  <rect x="520" y="208" width="380" height="36" class="box"/>
  <text x="538" y="230" class="step">4. 上下文丢失：忘记早期轮次约束</text>
  <rect x="520" y="248" width="380" height="36" class="box"/>
  <text x="538" y="270" class="step">5. 工具误用：参数错误、工具错误</text>

  <rect x="40" y="320" width="880" height="190" class="mit"/>
  <text x="480" y="342" text-anchor="middle" class="head">缓解措施：每一步都设置门禁</text>
  <rect x="60" y="358" width="840" height="30" class="box"/>
  <text x="78" y="378" class="step">逐步骤安全分类器（第 21 课）</text>
  <rect x="60" y="392" width="840" height="30" class="box"/>
  <text x="78" y="412" class="step">工具调用参数校验（第 06 课）</text>
  <rect x="60" y="426" width="840" height="30" class="box"/>
  <text x="78" y="446" class="step">通过 CRITIC 式外部依据核验主张（第 05 课）</text>
  <rect x="60" y="460" width="840" height="30" class="box"/>
  <text x="78" y="480" class="step">重新探测状态以捕获成功幻觉（“文件是否真的创建了？”）</text>
  <rect x="60" y="494" width="840" height="14" class="box"/>
  <text x="78" y="506" class="step">Phoenix 追踪聚类，用于生产漂移检测</text>

  <text x="480" y="540" text-anchor="middle" class="caption">级联最具破坏性：一个虚构 SKU，四次 API 调用，演变为多系统事故。</text>
</svg>
