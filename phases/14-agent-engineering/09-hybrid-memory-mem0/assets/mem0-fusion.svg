<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .vec { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .kv { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .graph { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .fuse { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">Mem0：三种存储并行写入，检索时融合</text>

  <rect x="40" y="50" width="200" height="46" class="box"/>
  <text x="140" y="74" text-anchor="middle" class="head">add(text, user_id, metadata)</text>
  <text x="140" y="90" text-anchor="middle" class="small">抽取事实，写入全部三种存储</text>

  <rect x="40" y="120" width="280" height="260" class="vec"/>
  <text x="180" y="142" text-anchor="middle" class="head">向量存储（Vector store）</text>
  <text x="60" y="166" class="small">语义相似度；按余弦相似度取 top-k</text>
  <text x="60" y="186" class="small">最适合：“我们讨论过什么”</text>
  <text x="60" y="206" class="small">最不适合：精确事实查询</text>
  <rect x="60" y="220" width="240" height="60" class="box"/>
  <text x="78" y="240" class="step" style="font-size:9px">记录：embedding(text), scope, user_id</text>
  <text x="78" y="258" class="small">tags、importance、ts 用于融合</text>
  <text x="78" y="272" class="small">定期为使用最多的子集重新嵌入</text>
  <rect x="60" y="290" width="240" height="76" class="box"/>
  <text x="78" y="310" class="step">故障：嵌入偏移</text>
  <text x="78" y="328" class="small">质量随语料增长而退化</text>
  <text x="78" y="344" class="small">修复：定期重新嵌入，监控 recall@k</text>
  <text x="78" y="360" class="small">Mem0 论文中 LoCoMo：91.6</text>

  <rect x="340" y="120" width="280" height="260" class="kv"/>
  <text x="480" y="142" text-anchor="middle" class="head">键值存储（KV store）</text>
  <text x="360" y="166" class="small">按 (user_id, type, entity) 以 O(1) 查询</text>
  <text x="360" y="186" class="small">最适合：“用户的电话是什么”</text>
  <text x="360" y="206" class="small">最不适合：语义 / 模糊匹配</text>
  <rect x="360" y="220" width="240" height="60" class="box"/>
  <text x="378" y="240" class="step">key = (user_id, fact_type, entity)</text>
  <text x="378" y="258" class="small">value = 记录标识</text>
  <text x="378" y="272" class="small">每季度审计 fact_type 集合</text>
  <rect x="360" y="290" width="240" height="76" class="box"/>
  <text x="378" y="310" class="step" style="font-size:10px">结构定义无序扩张（Schema creep）</text>
  <text x="378" y="328" class="small">每个团队都发明新的 fact_type</text>
  <text x="378" y="344" class="small">修复：集中类型注册表 + 评审</text>
  <text x="378" y="360" class="small">Mem0 论文中 LongMemEval：93.4</text>

  <rect x="640" y="120" width="280" height="260" class="graph"/>
  <text x="780" y="142" text-anchor="middle" class="head">图存储（Graph store，Mem0g）</text>
  <text x="660" y="166" class="small">带类型的边；时态有效性</text>
  <text x="660" y="186" class="small">最适合：关系推理</text>
  <text x="660" y="206" class="small">最不适合：非结构化自然语言</text>
  <rect x="660" y="220" width="240" height="60" class="box"/>
  <text x="678" y="240" class="step">(subject, relation, object, valid)</text>
  <text x="678" y="258" class="small">冲突检测器使其失效，而非删除</text>
  <text x="678" y="272" class="small">时态查询：指定时间有效的子图</text>
  <rect x="660" y="290" width="240" height="76" class="box"/>
  <text x="678" y="310" class="step">故障：图膨胀</text>
  <text x="678" y="328" class="small">带噪抽取器每条消息添加 50 条边</text>
  <text x="678" y="344" class="small">修复：限制每次 add 的边数，丢弃低置信边</text>
  <text x="678" y="360" class="small">Mem0 论文中 BEAM 1M：64.1</text>

  <rect x="80" y="400" width="800" height="110" class="fuse"/>
  <text x="480" y="422" text-anchor="middle" class="head">融合评分：score = w_rel * relevance + w_imp * importance + w_rec * recency</text>
  <text x="100" y="448" class="small">相关性：向量余弦、KV 精确匹配、图路径权重</text>
  <text x="100" y="468" class="small">重要性：写入时标注，或从使用情况中学习</text>
  <text x="100" y="488" class="small">近期性：按距上次写入或读取时间指数衰减</text>
  <text x="500" y="448" class="small">按产品调整权重：</text>
  <text x="500" y="468" class="small">语音智能体侧重近期性；合规侧重重要性</text>
  <text x="500" y="488" class="small">检索智能体侧重相关性；相同抽取器，不同策略</text>

  <text x="480" y="540" text-anchor="middle" class="caption">作用域：user / session / agent。每次写入选择一个；检索跨作用域加权查询。</text>
</svg>
