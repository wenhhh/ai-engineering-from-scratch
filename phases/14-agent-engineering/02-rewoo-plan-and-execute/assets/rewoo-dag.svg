<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">ReWOO：规划器（Planner）、执行器（Workers）、求解器（Solver）（Xu 等人，2023）</text>

  <rect x="40" y="60" width="170" height="80" class="cool"/>
  <text x="125" y="88" text-anchor="middle" class="step">规划器（Planner）</text>
  <text x="125" y="108" text-anchor="middle" class="small">调用一次；只能看到</text>
  <text x="125" y="124" text-anchor="middle" class="small">用户的问题</text>

  <rect x="260" y="60" width="460" height="320" class="box"/>
  <text x="490" y="84" text-anchor="middle" class="head">计划有向无环图（DAG）与执行器</text>

  <rect x="290" y="110" width="160" height="60" class="cold"/>
  <text x="370" y="134" text-anchor="middle" class="step">E1 = search</text>
  <text x="370" y="152" text-anchor="middle" class="small">法国首都</text>

  <rect x="530" y="110" width="160" height="60" class="cold"/>
  <text x="610" y="134" text-anchor="middle" class="step">E2 = search</text>
  <text x="610" y="152" text-anchor="middle" class="small">#E1 的人口</text>

  <rect x="410" y="220" width="160" height="60" class="hot"/>
  <text x="490" y="244" text-anchor="middle" class="step">E3 = round_million</text>
  <text x="490" y="262" text-anchor="middle" class="small">text = #E2</text>

  <line x1="210" y1="100" x2="290" y2="140" class="edge" marker-end="url(#arrow)"/>
  <line x1="450" y1="140" x2="530" y2="140" class="edge" marker-end="url(#arrow)"/>
  <line x1="610" y1="170" x2="520" y2="220" class="edge" marker-end="url(#arrow)"/>
  <line x1="370" y1="170" x2="470" y2="220" class="edge" marker-end="url(#arrow)"/>

  <rect x="290" y="310" width="400" height="50" class="dsk"/>
  <text x="490" y="330" text-anchor="middle" class="step">证据表（Evidence table）：E1=Paris</text>
  <text x="490" y="348" text-anchor="middle" class="step">E2="11.2M metro", E3="11 million"</text>

  <rect x="750" y="60" width="170" height="80" class="cool"/>
  <text x="835" y="88" text-anchor="middle" class="step">求解器（Solver）</text>
  <text x="835" y="108" text-anchor="middle" class="small">调用一次；读取</text>
  <text x="835" y="124" text-anchor="middle" class="small">证据 + 计划</text>

  <line x1="720" y1="335" x2="790" y2="140" class="edge" marker-end="url(#arrow)"/>

  <rect x="40" y="160" width="170" height="220" class="box"/>
  <text x="125" y="184" text-anchor="middle" class="head">为什么选 ReWOO</text>
  <text x="50" y="206" class="small">规划器没有观察结果</text>
  <text x="50" y="222" class="small">也就没有反馈噪声</text>
  <text x="50" y="246" class="small">执行器沿独立分支</text>
  <text x="50" y="262" class="small">并行展开</text>
  <text x="50" y="286" class="small">词元更少：</text>
  <text x="50" y="302" class="small">1 个规划器 + N 个小执行器</text>
  <text x="50" y="318" class="small">提示词 + 1 次求解器调用</text>
  <text x="50" y="342" class="small">论文：HotpotQA 用量降至 1/5</text>
  <text x="50" y="358" class="small">准确率提高 4 个百分点</text>

  <rect x="750" y="160" width="170" height="220" class="box"/>
  <text x="835" y="184" text-anchor="middle" class="head">何时选择它</text>
  <text x="760" y="206" class="small">任务形态结构化</text>
  <text x="760" y="222" class="small">事先知道工具</text>
  <text x="760" y="246" class="small">证据获取可并行</text>
  <text x="760" y="262" class="small">词元预算很重要</text>
  <text x="760" y="286" class="small">否则，未知环境优先</text>
  <text x="760" y="302" class="small">使用 ReAct；30+ 步的</text>
  <text x="760" y="318" class="small">网页或移动轨迹使用</text>
  <text x="760" y="334" class="small" style="font-size:9px">计划后行动（Plan-and-Act）</text>

  <rect x="40" y="400" width="880" height="100" class="box"/>
  <text x="480" y="424" text-anchor="middle" class="head">蒸馏（Distillation）视角（ReWOO 第 4 节）</text>
  <text x="60" y="446" class="small">规划器不看观察结果，因此训练信号干净；可以用 GPT-3.5 的规划轨迹微调 LLaMA 7B，</text>
  <text x="60" y="462" class="small">使其达到相当的规划质量。2026 年生产系统：小规划器 + 大执行器（或反过来），</text>
  <text x="60" y="478" class="small">通过模型路由器（Model router，Mastra）或动态交接（Dynamic handoff，OpenAI Agents SDK）实现。</text>
</svg>
