<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="28" text-anchor="middle" class="title">心智理论（Theory of Mind）的阶数与协调假象</text>

  <rect x="40" y="60" width="280" height="200" class="hot"/>
  <text x="180" y="84" text-anchor="middle" class="head">零阶（zeroth-order）</text>
  <text x="180" y="108" text-anchor="middle" class="step">没有他人模型</text>
  <text x="180" y="138" text-anchor="middle" class="small">智能体只根据自身观察行动</text>
  <text x="180" y="156" text-anchor="middle" class="small">与其他智能体发生冲突</text>
  <text x="180" y="174" text-anchor="middle" class="small">在共享资源上重复工作</text>
  <text x="180" y="206" text-anchor="middle" class="caption">测量：每次试验约 0.96 次冲突</text>
  <text x="180" y="224" text-anchor="middle" class="caption">（3 个智能体、3 个盒子、无 ToM）</text>

  <rect x="340" y="60" width="280" height="200" class="cool"/>
  <text x="480" y="84" text-anchor="middle" class="head">一阶（first-order）</text>
  <text x="480" y="108" text-anchor="middle" class="step">“A 相信 X”</text>
  <text x="480" y="138" text-anchor="middle" class="small">智能体追踪彼此的信念</text>
  <text x="480" y="156" text-anchor="middle" class="small">根据信念模型预测行动</text>
  <text x="480" y="174" text-anchor="middle" class="small">避免冗余，并预判需求</text>
  <text x="480" y="206" text-anchor="middle" class="caption">测量：每次试验约 0.00 次冲突</text>
  <text x="480" y="224" text-anchor="middle" class="caption">（采用偏好启动）</text>

  <rect x="640" y="60" width="280" height="200" class="cold"/>
  <text x="780" y="84" text-anchor="middle" class="head">二阶（second-order）</text>
  <text x="780" y="108" text-anchor="middle" class="step">“A 认为 B 相信 X”</text>
  <text x="780" y="138" text-anchor="middle" class="small">递归信念建模</text>
  <text x="780" y="156" text-anchor="middle" class="small">在协作游戏中涌现</text>
  <text x="780" y="174" text-anchor="middle" class="small">在长程任务中退化</text>
  <text x="780" y="206" text-anchor="middle" class="caption">Li 等 2023：上下文失败模式</text>
  <text x="780" y="224" text-anchor="middle" class="caption">身份与信念的绑定随轮次减弱</text>

  <rect x="40" y="290" width="880" height="200" class="box"/>
  <text x="480" y="314" text-anchor="middle" class="head">协调假象（Riedl 2025，arXiv:2510.05174）</text>
  <text x="70" y="346" class="step">主张</text>
  <text x="140" y="346" class="small">“我们的智能体具有涌现协调”</text>
  <text x="70" y="372" class="step">失败</text>
  <text x="140" y="372" class="small">协调源于提示包装；从系统提示中移除“共同合作”，效果就消失</text>
  <text x="70" y="398" class="step">审计</text>
  <text x="140" y="398" class="small">要求对照条件、统计检验、互补性指标和能力检查</text>
  <text x="70" y="424" class="step">真实</text>
  <text x="140" y="424" class="small">身份关联分化 + 目标导向互补 + 高阶协同效应</text>
  <text x="70" y="450" class="step">仅有</text>
  <text x="140" y="450" class="small">在 Riedl 的群体实验中，只有 ToM 提示条件的三项指标均高于随机水平</text>
  <text x="70" y="476" class="caption">较大模型在没有 ToM 提示时也有一定协调，但效果较弱</text>
</svg>
