<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <text x="450" y="28" text-anchor="middle" class="title">Swarm：例程 + 交接（OpenAI，2024；Agents SDK 2025）</text>

  <rect x="320" y="60" width="260" height="100" class="hot"/>
  <text x="450" y="82" text-anchor="middle" class="head">分流智能体（Triage Agent）</text>
  <text x="450" y="104" text-anchor="middle" class="small">指令：</text>
  <text x="450" y="120" text-anchor="middle" class="small">“将用户路由到合适的专职智能体”</text>
  <text x="450" y="140" text-anchor="middle" class="small">函数：transfer_to_refunds, sales, support</text>

  <line x1="380" y1="160" x2="200" y2="220" class="edge" marker-end="url(#arrow)"/>
  <text x="260" y="195" class="small">工具返回 refund_agent</text>

  <line x1="450" y1="160" x2="450" y2="220" class="edge" marker-end="url(#arrow)"/>
  <text x="460" y="195" class="small">工具返回 sales_agent</text>

  <line x1="520" y1="160" x2="700" y2="220" class="edge" marker-end="url(#arrow)"/>
  <text x="620" y="195" class="small">工具返回 support_agent</text>

  <rect x="100" y="220" width="200" height="80" class="cool"/>
  <text x="200" y="242" text-anchor="middle" class="head">退款智能体（Refund Agent）</text>
  <text x="200" y="262" text-anchor="middle" class="small">process_refund(order_id)</text>
  <text x="200" y="282" text-anchor="middle" class="small">“订单 77 退款已处理”</text>

  <rect x="350" y="220" width="200" height="80" class="cool"/>
  <text x="450" y="242" text-anchor="middle" class="head">销售智能体（Sales Agent）</text>
  <text x="450" y="262" text-anchor="middle" class="small">quote_product(product)</text>
  <text x="450" y="282" text-anchor="middle" class="small">“报价：$99/月”</text>

  <rect x="600" y="220" width="200" height="80" class="cool"/>
  <text x="700" y="242" text-anchor="middle" class="head">支持智能体（Support Agent）</text>
  <text x="700" y="262" text-anchor="middle" class="small">open_ticket(issue)</text>
  <text x="700" y="282" text-anchor="middle" class="small">“工单已创建”</text>

  <rect x="60" y="340" width="380" height="150" class="box"/>
  <text x="250" y="362" text-anchor="middle" class="head">原语如何工作</text>
  <text x="250" y="384" text-anchor="middle" class="small">智能体 = (instructions, tools)</text>
  <text x="250" y="404" text-anchor="middle" class="small">交接 = 返回 Agent 的工具</text>
  <text x="250" y="424" text-anchor="middle" class="small">运行时检测值为 Agent 的返回</text>
  <text x="250" y="444" text-anchor="middle" class="small">切换下一轮活动智能体</text>
  <text x="250" y="470" text-anchor="middle" class="caption">没有状态机或 DSL，只有工具调用</text>

  <rect x="460" y="340" width="380" height="150" class="box"/>
  <text x="650" y="362" text-anchor="middle" class="head">无状态权衡</text>
  <text x="650" y="384" text-anchor="middle" class="small">Swarm 在运行之间不持久化任何内容</text>
  <text x="650" y="404" text-anchor="middle" class="small">记忆由调用者负责</text>
  <text x="650" y="424" text-anchor="middle" class="small">Agents SDK（2025）增加会话、追踪</text>
  <text x="650" y="444" text-anchor="middle" class="small">并添加防护机制、交接过滤器</text>
  <text x="650" y="470" text-anchor="middle" class="caption">保留交接原语，增加生产易用性</text>
</svg>
