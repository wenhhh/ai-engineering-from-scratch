<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">多模态 RAG：跨模态检索、融合、关联依据、生成</text>

  <rect x="30" y="50" width="900" height="220" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">查询 -&gt; 分解 -&gt; 3 个检索器 -&gt; 融合 -&gt; VLM 生成器</text>

  <rect x="60" y="90" width="180" height="60" class="reg"/>
  <text x="150" y="112" text-anchor="middle" class="step">查询</text>
  <text x="150" y="130" text-anchor="middle" class="small">“安静的纯素早午餐</text>
  <text x="150" y="145" text-anchor="middle" class="small">有自然光”</text>

  <path d="M 245 120 L 285 100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 245 120 L 285 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 245 140 L 285 240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="80" width="170" height="50" class="hot"/>
  <text x="375" y="100" text-anchor="middle" class="step">文本检索器</text>
  <text x="375" y="120" text-anchor="middle" class="small">评论 / 菜单</text>

  <rect x="290" y="150" width="170" height="50" class="cool"/>
  <text x="375" y="170" text-anchor="middle" class="step">图像检索器</text>
  <text x="375" y="190" text-anchor="middle" class="small">CLIP / SigLIP 照片</text>

  <rect x="290" y="220" width="170" height="50" class="cold"/>
  <text x="375" y="240" text-anchor="middle" class="step">音频检索器</text>
  <text x="375" y="260" text-anchor="middle" class="small">CLAP 环境声音片段</text>

  <path d="M 465 105 L 505 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 465 175 L 505 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 465 245 L 505 200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="510" y="130" width="170" height="90" class="reg"/>
  <text x="595" y="152" text-anchor="middle" class="step" style="font-size:10px">分数融合（Score fusion）</text>
  <text x="595" y="172" text-anchor="middle" class="small">加权和</text>
  <text x="595" y="188" text-anchor="middle" class="small">或 MoE 门控</text>
  <text x="595" y="206" text-anchor="middle" class="small">前 k 个候选</text>

  <path d="M 685 175 L 725 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="730" y="130" width="180" height="90" class="cool"/>
  <text x="820" y="152" text-anchor="middle" class="step">VLM 生成器</text>
  <text x="820" y="172" text-anchor="middle" class="small">Qwen2.5-VL / Claude</text>
  <text x="820" y="188" text-anchor="middle" class="small">有据引用</text>
  <text x="820" y="206" text-anchor="middle" class="small">逐来源</text>

  <rect x="30" y="290" width="900" height="220" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">2025 年三篇综述</text>

  <rect x="60" y="330" width="260" height="170" class="hot"/>
  <text x="190" y="352" text-anchor="middle" class="step">Abootorabi 等人</text>
  <text x="190" y="368" text-anchor="middle" class="small">arXiv:2502.08826</text>
  <text x="190" y="388" text-anchor="middle" class="small">全面分类</text>
  <text x="190" y="404" text-anchor="middle" class="small">检索 / 融合 / 生成</text>
  <text x="190" y="420" text-anchor="middle" class="small">覆盖面最广</text>
  <text x="190" y="446" text-anchor="middle" class="step">新手从此开始</text>
  <text x="190" y="466" text-anchor="middle" class="caption">列出所有子问题</text>

  <rect x="340" y="330" width="260" height="170" class="cool"/>
  <text x="470" y="352" text-anchor="middle" class="step">Mei 等人</text>
  <text x="470" y="368" text-anchor="middle" class="small">arXiv:2504.08748</text>
  <text x="470" y="388" text-anchor="middle" class="small">子任务基准</text>
  <text x="470" y="404" text-anchor="middle" class="small">整理故障模式</text>
  <text x="470" y="420" text-anchor="middle" class="small">有助于评估设计</text>
  <text x="470" y="446" text-anchor="middle" class="step">为评估而阅读</text>
  <text x="470" y="466" text-anchor="middle" class="caption">逐指标分解</text>

  <rect x="620" y="330" width="290" height="170" class="cold"/>
  <text x="765" y="352" text-anchor="middle" class="step">Zhao 等人</text>
  <text x="765" y="368" text-anchor="middle" class="small">arXiv:2503.18016</text>
  <text x="765" y="388" text-anchor="middle" class="small">面向视觉的 RAG</text>
  <text x="765" y="404" text-anchor="middle" class="small">擅长介绍 ColPali 系列</text>
  <text x="765" y="420" text-anchor="middle" class="small">强调纯视觉</text>
  <text x="765" y="446" text-anchor="middle" class="step">为视觉 RAG 而阅读</text>
  <text x="765" y="466" text-anchor="middle" class="caption">补充第 23 课</text>
</svg>
