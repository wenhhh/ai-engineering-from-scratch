<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">多模态智能体循环：感知、推理、行动、观察</text>

  <rect x="30" y="50" width="900" height="230" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">四阶段循环</text>

  <rect x="60" y="100" width="190" height="150" class="hot"/>
  <text x="155" y="122" text-anchor="middle" class="step">1. 感知</text>
  <text x="155" y="142" text-anchor="middle" class="small">截图</text>
  <text x="155" y="158" text-anchor="middle" class="small">+ 无障碍树</text>
  <text x="155" y="174" text-anchor="middle" class="small">+ 目标 + 历史</text>
  <text x="155" y="200" text-anchor="middle" class="step">VLM 编码</text>
  <text x="155" y="220" text-anchor="middle" class="small">高分辨率 1280+</text>
  <text x="155" y="236" text-anchor="middle" class="small">原生宽高比</text>

  <path d="M 255 175 L 295 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="100" width="190" height="150" class="cool"/>
  <text x="395" y="122" text-anchor="middle" class="step">2. 推理</text>
  <text x="395" y="142" text-anchor="middle" class="small">规划下一步</text>
  <text x="395" y="158" text-anchor="middle" class="small">将指令定位</text>
  <text x="395" y="174" text-anchor="middle" class="small">到坐标</text>
  <text x="395" y="200" text-anchor="middle" class="step">输出 JSON 动作</text>
  <text x="395" y="220" text-anchor="middle" class="small">{action, x, y, desc}</text>
  <text x="395" y="236" text-anchor="middle" class="small">element_desc 辅助</text>

  <path d="M 495 175 L 535 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="100" width="190" height="150" class="cold"/>
  <text x="635" y="122" text-anchor="middle" class="step">3. 行动</text>
  <text x="635" y="142" text-anchor="middle" class="small">分发到浏览器</text>
  <text x="635" y="158" text-anchor="middle" class="small">Selenium / CDP</text>
  <text x="635" y="174" text-anchor="middle" class="small">或操作系统驱动</text>
  <text x="635" y="200" text-anchor="middle" class="step">验证成功</text>
  <text x="635" y="220" text-anchor="middle" class="small">元素存在吗？</text>
  <text x="635" y="236" text-anchor="middle" class="small">失败后重试</text>

  <path d="M 735 175 L 775 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="780" y="100" width="130" height="150" class="reg"/>
  <text x="845" y="122" text-anchor="middle" class="step">4. 观察</text>
  <text x="845" y="142" text-anchor="middle" class="small">新截图</text>
  <text x="845" y="158" text-anchor="middle" class="small">状态差异</text>
  <text x="845" y="174" text-anchor="middle" class="small">目标检查</text>
  <text x="845" y="200" text-anchor="middle" class="step">重复或完成</text>
  <text x="845" y="220" text-anchor="middle" class="small">最多约 30 步</text>

  <path d="M 845 255 Q 845 270 845 280 L 845 300 Q 500 300 500 255 L 500 255"
        fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,3"/>

  <rect x="30" y="300" width="900" height="210" class="box"/>
  <text x="480" y="322" text-anchor="middle" class="head">记忆 + 基准</text>

  <rect x="60" y="340" width="400" height="160" class="reg"/>
  <text x="260" y="362" text-anchor="middle" class="step">记忆压缩</text>
  <text x="260" y="382" text-anchor="middle" class="small">1. 摘要链：每 5 步生成摘要</text>
  <text x="260" y="398" text-anchor="middle" class="small">2. 跳帧：首张 + 末张 + 每隔 3 张</text>
  <text x="260" y="414" text-anchor="middle" class="small">3. 仅日志：动作文本日志（Claude）</text>
  <text x="260" y="430" text-anchor="middle" class="small">4. 混合：日志 + 最近 2 张截图 + 摘要</text>
  <text x="260" y="460" text-anchor="middle" class="caption">30 张 2048 px 截图 = 360k 词元</text>
  <text x="260" y="476" text-anchor="middle" class="caption">超过约第 10 步就必须压缩</text>

  <rect x="480" y="340" width="430" height="160" class="hot"/>
  <text x="695" y="362" text-anchor="middle" class="step">2026 年基准</text>
  <text x="695" y="384" text-anchor="middle" class="small">ScreenSpot-Pro  : Claude 4.7 ~90 / Qwen2.5-VL 85</text>
  <text x="695" y="400" text-anchor="middle" class="small">VisualWebArena：Gemini 3 Pro 27 / 开放约 20</text>
  <text x="695" y="416" text-anchor="middle" class="small">AgentVista：前沿 27-40 / 开放 10-20</text>
  <text x="695" y="432" text-anchor="middle" class="small">Ferret-UI      : GPT-5 ~82 / Qwen2.5-VL ~70</text>
  <text x="695" y="462" text-anchor="middle" class="step">仍然困难</text>
  <text x="695" y="482" text-anchor="middle" class="caption">长时域 + 恢复 + 精细定位</text>
</svg>
