<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .reg { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">Chameleon：将图像变为共享词表（Shared vocabulary）中的离散词元</text>

  <rect x="30" y="50" width="900" height="230" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">训练：一个序列，一种损失</text>

  <rect x="60" y="90" width="180" height="150" class="hot"/>
  <text x="150" y="110" text-anchor="middle" class="step">1. 图像（Image）</text>
  <text x="150" y="128" text-anchor="middle" class="small">原始 RGB 像素</text>
  <g stroke="#888" stroke-width="0.5">
    <rect x="80" y="140" width="140" height="80" fill="#f8e5ba" stroke="#c0392b"/>
    <line x1="115" y1="140" x2="115" y2="220"/>
    <line x1="150" y1="140" x2="150" y2="220"/>
    <line x1="185" y1="140" x2="185" y2="220"/>
    <line x1="80" y1="170" x2="220" y2="170"/>
    <line x1="80" y1="200" x2="220" y2="200"/>
  </g>

  <path d="M 245 160 L 305 160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="150" text-anchor="middle" class="small">VQ-VAE</text>

  <rect x="310" y="90" width="180" height="150" class="cool"/>
  <text x="400" y="110" text-anchor="middle" class="step">2. 量化（Quantize）</text>
  <text x="400" y="128" text-anchor="middle" class="small">码本 K=8192</text>
  <text x="400" y="146" text-anchor="middle" class="small">32x32 = 1024 个整数</text>
  <text x="400" y="170" text-anchor="middle" class="step">[4821, 1029, 2891, ...]</text>
  <text x="400" y="196" text-anchor="middle" class="small">每个图像块一个词元</text>
  <text x="400" y="214" text-anchor="middle" class="small">重建有损</text>

  <path d="M 495 160 L 555 160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="90" width="350" height="150" class="cold"/>
  <text x="735" y="110" text-anchor="middle" class="step">3. 共享词表（Shared vocabulary）</text>
  <text x="735" y="128" text-anchor="middle" class="small">文本 ID 0..31999</text>
  <text x="735" y="146" text-anchor="middle" class="small">图像 ID 32000..40191</text>
  <text x="735" y="164" text-anchor="middle" class="small">&lt;image&gt; / &lt;/image&gt; 分隔符</text>
  <text x="735" y="190" text-anchor="middle" class="step">单一嵌入层</text>
  <text x="735" y="208" text-anchor="middle" class="small">单一下一词元交叉熵损失</text>

  <rect x="30" y="300" width="900" height="220" class="box"/>
  <text x="480" y="322" text-anchor="middle" class="head">推理：一次前向传播中的混合模态生成（Mixed-modality generation）</text>

  <rect x="60" y="340" width="300" height="160" class="reg"/>
  <text x="210" y="360" text-anchor="middle" class="step">提示词：“画一只猫”</text>
  <text x="210" y="382" text-anchor="middle" class="small">文本词元流入</text>
  <text x="210" y="400" text-anchor="middle" class="small">模型自回归输出</text>
  <text x="210" y="418" text-anchor="middle" class="small">&lt;image&gt; code code code ... &lt;/image&gt;</text>
  <text x="210" y="436" text-anchor="middle" class="small">随后输出描述文本</text>
  <text x="210" y="462" text-anchor="middle" class="caption">显示时 VQ 解码器渲染像素</text>

  <rect x="380" y="340" width="250" height="160" class="cool"/>
  <text x="505" y="360" text-anchor="middle" class="step">稳定性技巧</text>
  <text x="505" y="382" text-anchor="middle" class="small">点积前进行 QK-Norm</text>
  <text x="505" y="400" text-anchor="middle" class="small">每次残差之后随机失活</text>
  <text x="505" y="418" text-anchor="middle" class="small">最后一块跳跃连接 LN</text>
  <text x="505" y="442" text-anchor="middle" class="small">缺少这些时 34B 会发散</text>
  <text x="505" y="462" text-anchor="middle" class="caption">训练方案占论文一半</text>

  <rect x="650" y="340" width="270" height="160" class="hot"/>
  <text x="785" y="360" text-anchor="middle" class="step">权衡（Trade-offs）</text>
  <text x="785" y="382" text-anchor="middle" class="small">+ 同一模型生成图像</text>
  <text x="785" y="400" text-anchor="middle" class="small">+ 自然获得混合模态输出</text>
  <text x="785" y="418" text-anchor="middle" class="small">- 分词器限制图像质量</text>
  <text x="785" y="436" text-anchor="middle" class="small">- 推理成本高（VQ 解码）</text>
  <text x="785" y="454" text-anchor="middle" class="small">- 不复用 LLM</text>
  <text x="785" y="478" text-anchor="middle" class="caption">Emu3 + Transfusion 延伸此路径</text>
</svg>
