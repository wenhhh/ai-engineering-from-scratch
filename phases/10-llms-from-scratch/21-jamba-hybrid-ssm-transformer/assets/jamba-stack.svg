<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .mamba { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.2; }
      .attn { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.2; }
      .moe { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 11px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title" style="font-size:14px">Jamba：每 7 层 Mamba 配 1 层 Transformer，交替使用 MoE（混合专家）</text>

  <!-- One Jamba block (8 layers) -->
  <rect x="60" y="50" width="280" height="480" class="box"/>
  <text x="200" y="72" text-anchor="middle" class="head" style="font-size:12px">一个 Jamba 块（Block），8 层</text>

  <!-- 7 Mamba + 1 Attention, MoE on alternating -->
  <rect x="80" y="90" width="240" height="44" class="mamba"/>
  <text x="200" y="110" text-anchor="middle" class="step" style="font-size:10px">Mamba（状态空间模型，SSM）</text>
  <text x="200" y="126" text-anchor="middle" class="small" style="font-size:10px">+ MoE 路由器（Router）</text>

  <rect x="80" y="140" width="240" height="44" class="mamba"/>
  <text x="200" y="160" text-anchor="middle" class="step" style="font-size:10px">Mamba（状态空间模型，SSM）</text>
  <text x="200" y="176" text-anchor="middle" class="small" style="font-size:10px">稠密 MLP（Dense MLP）</text>

  <rect x="80" y="190" width="240" height="44" class="mamba"/>
  <text x="200" y="210" text-anchor="middle" class="step" style="font-size:10px">Mamba（状态空间模型，SSM）</text>
  <text x="200" y="226" text-anchor="middle" class="small" style="font-size:10px">+ MoE 路由器（Router）</text>

  <rect x="80" y="240" width="240" height="44" class="mamba"/>
  <text x="200" y="260" text-anchor="middle" class="step" style="font-size:10px">Mamba（状态空间模型，SSM）</text>
  <text x="200" y="276" text-anchor="middle" class="small" style="font-size:10px">稠密 MLP（Dense MLP）</text>

  <rect x="80" y="290" width="240" height="44" class="mamba"/>
  <text x="200" y="310" text-anchor="middle" class="step" style="font-size:10px">Mamba（状态空间模型，SSM）</text>
  <text x="200" y="326" text-anchor="middle" class="small" style="font-size:10px">+ MoE 路由器（Router）</text>

  <rect x="80" y="340" width="240" height="44" class="mamba"/>
  <text x="200" y="360" text-anchor="middle" class="step" style="font-size:10px">Mamba（状态空间模型，SSM）</text>
  <text x="200" y="376" text-anchor="middle" class="small" style="font-size:10px">稠密 MLP（Dense MLP）</text>

  <rect x="80" y="390" width="240" height="44" class="mamba"/>
  <text x="200" y="410" text-anchor="middle" class="step" style="font-size:10px">Mamba（状态空间模型，SSM）</text>
  <text x="200" y="426" text-anchor="middle" class="small" style="font-size:10px">+ MoE 路由器（Router）</text>

  <rect x="80" y="440" width="240" height="44" class="attn"/>
  <text x="200" y="460" text-anchor="middle" class="step" style="font-size:10px">Transformer（注意力，Attention）</text>
  <text x="200" y="476" text-anchor="middle" class="small" style="font-size:10px">稠密 MLP（Dense MLP）</text>

  <text x="200" y="510" text-anchor="middle" class="caption" style="font-size:11px">重复此块 N 次（Repeat N Times）</text>

  <!-- Memory comparison -->
  <rect x="380" y="50" width="540" height="220" class="box"/>
  <text x="650" y="72" text-anchor="middle" class="head" style="font-size:12px">256k 上下文内存（Memory），BF16</text>

  <text x="400" y="104" class="step" style="font-size:9px">纯 Transformer MHA，32 层（Layers）</text>
  <text x="680" y="104" class="step" fill="#c0392b">128 GB</text>
  <rect x="400" y="110" width="495" height="14" fill="#c0392b"/>

  <text x="400" y="144" class="step" style="font-size:9px">纯 Transformer GQA(8)，32 层（Layers）</text>
  <text x="680" y="144" class="step" fill="#c0392b">32 GB</text>
  <rect x="400" y="150" width="124" height="14" fill="#c0392b"/>

  <text x="400" y="184" class="step" style="font-size:10px">Jamba 1:3 混合（Hybrid），32 层</text>
  <text x="680" y="184" class="step" fill="#c0392b">32 GB</text>
  <rect x="400" y="190" width="124" height="14" fill="#c0392b"/>

  <text x="400" y="224" class="step" style="font-size:10px">Jamba 1:7 混合（Hybrid），32 层</text>
  <text x="680" y="224" class="step" fill="#2e7d32">16 GB</text>
  <rect x="400" y="230" width="62" height="14" fill="#2e7d32"/>

  <text x="400" y="260" class="step" style="font-size:10px">纯 Mamba，32 层（Layers）</text>
  <text x="680" y="260" class="step" fill="#2e7d32">&lt;1 MB</text>
  <rect x="400" y="262" width="4" height="14" fill="#2e7d32"/>

  <!-- Ratio rationale -->
  <rect x="380" y="290" width="540" height="240" class="box"/>
  <text x="650" y="312" text-anchor="middle" class="head" style="font-size:12px">为何采用 1:7 比例（Ratio）</text>

  <text x="400" y="340" class="step" style="font-size:10px">1:1（纯 Transformer）</text>
  <text x="620" y="340" class="small" style="font-size:8px">质量最佳，内存最差（Quality / Memory）</text>

  <text x="400" y="362" class="step" style="font-size:9px">1:3（25% 注意力，Attention）</text>
  <text x="620" y="362" class="small" style="font-size:8px">KV 仍大，质量小幅改善（Quality Gain）</text>

  <text x="400" y="384" class="step" style="font-size:9px">1:7（12.5% 注意力，Attention）✓</text>
  <text x="620" y="384" class="small" style="font-size:9px">AI21 最佳点：单块 80GB GPU 支持 256k</text>

  <text x="400" y="406" class="step" style="font-size:9px">1:15（6% 注意力，Attention）</text>
  <text x="620" y="406" class="small" style="font-size:8px">上下文内回忆开始失败（In-Context Recall）</text>

  <text x="400" y="428" class="step" style="font-size:10px">0:N（纯 Mamba）</text>
  <text x="620" y="428" class="small" style="font-size:8px">无注意力时状态跟踪失败（State Tracking）</text>

  <text x="400" y="465" class="step">Mamba-3 (ICLR 2026)</text>
  <text x="620" y="465" class="small" style="font-size:8px">复数状态（Complex State）+ MIMO；比例更低？</text>

  <text x="400" y="488" class="step" style="font-size:9px">2026 前沿混合模型（Frontier Hybrids）</text>
  <text x="620" y="488" class="small" style="font-size:9px">Jamba 1.5 Large：398B/94B 激活，企业级</text>
  <text x="620" y="504" class="small" style="font-size:9px">下一代：可能以 1:10+ 混合 Mamba-3 与注意力</text>
</svg>
