<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .old { fill: #eeeeee; stroke: #888; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title" style="font-size:15px">DeepSeek-V3 结构（Anatomy）：总参数 671B，激活参数 37B</text>

  <!-- stack -->
  <rect x="60" y="50" width="300" height="500" class="box"/>
  <text x="210" y="72" text-anchor="middle" class="head" style="font-size:12px">完整堆栈（Full Stack）：61 块</text>

  <rect x="80" y="88" width="260" height="36" class="cool"/>
  <text x="210" y="110" text-anchor="middle" class="step" style="font-size:11px">嵌入（Embedding）(129k x 7168)</text>

  <rect x="80" y="130" width="260" height="42" class="old"/>
  <text x="210" y="148" text-anchor="middle" class="step" style="font-size:11px">3 个稠密块（Dense Blocks）</text>
  <text x="210" y="164" text-anchor="middle" class="small" style="font-size:8px">MLA 注意力（Attention）+ 稠密 SwiGLU MLP (18432)</text>

  <rect x="80" y="180" width="260" height="232" class="dsk"/>
  <text x="210" y="200" text-anchor="middle" class="step" style="font-size:12px">58 个 MoE 块（Blocks）</text>
  <text x="210" y="220" text-anchor="middle" class="small" style="font-size:10px">MLA 注意力（Attention）+ MoE MLP</text>
  <text x="210" y="242" text-anchor="middle" class="small" style="font-size:9px">256 个专家（Experts），各隐藏维度 2048</text>
  <text x="210" y="262" text-anchor="middle" class="small" style="font-size:9px">+ 1 个共享专家（Shared Expert），始终启用</text>
  <text x="210" y="282" text-anchor="middle" class="small" style="font-size:8px">路由器：无辅助损失偏置（Aux-Loss-Free Bias）</text>
  <text x="210" y="302" text-anchor="middle" class="small" style="font-size:9px">每词元前 8 路由（Top-8 Routing）</text>
  <text x="210" y="324" text-anchor="middle" class="small" style="font-size:10px">每词元激活（Active per Token）：</text>
  <text x="210" y="340" text-anchor="middle" class="small" style="font-size:9px">8 个路由 + 1 个共享 = 9 个专家（Experts）</text>
  <text x="210" y="362" text-anchor="middle" class="small" style="font-size:9px">KV 缓存：512 维 MLA 潜在表示（Latent）</text>
  <text x="210" y="382" text-anchor="middle" class="small" style="font-size:9px">每词元、每层（Per Token per Layer）</text>

  <rect x="80" y="420" width="260" height="36" class="hot"/>
  <text x="210" y="442" text-anchor="middle" class="step" style="font-size:11px">1 个 MTP 模块（Module）</text>

  <rect x="80" y="462" width="260" height="36" class="cool"/>
  <text x="210" y="484" text-anchor="middle" class="step" style="font-size:9px">最终 RMSNorm + LM 头（Head，权重绑定）</text>

  <text x="210" y="530" text-anchor="middle" class="caption" style="font-size:10px">总计 671B · 激活 37B · 比例（Ratio）5.5%</text>

  <!-- Innovation callouts -->
  <rect x="400" y="50" width="520" height="500" class="box"/>
  <text x="660" y="72" text-anchor="middle" class="head" style="font-size:12px">DeepSeek 四项创新（Innovations）</text>

  <rect x="420" y="92" width="480" height="80" class="cool"/>
  <text x="440" y="114" class="step" style="font-size:11px">1 / 多头潜在注意力（Multi-Head Latent Attention，MLA）</text>
  <text x="440" y="134" class="small" style="font-size:9px">将 K、V 压缩为共享 512 维潜在表示（Latent）c^{KV}；</text>
  <text x="440" y="150" class="small" style="font-size:9px">KV 缓存每词元每层存 512 个浮点数，而非 2 * heads * head_dim。</text>
  <text x="440" y="166" class="small" style="font-size:9px">128k 时：7.6 GB，对比 GQA(8/128) 的 30.5 GB；缩小 4 倍。</text>

  <rect x="420" y="180" width="480" height="80" class="hot"/>
  <text x="440" y="202" class="step" style="font-size:11px">2 / 多词元预测（Multi-Token Prediction，MTP）</text>
  <text x="440" y="222" class="small" style="font-size:9px">D=1 模块（Module）依据 h^(1) + E(t+1) 预测 t+2。</text>
  <text x="440" y="238" class="small" style="font-size:9px">以 2.1% 参数开销（671B 之外的 14B）换取更密集的训练信号。</text>
  <text x="440" y="254" class="small" style="font-size:9px">推理草稿接受率（Draft Acceptance）超过 80%。</text>

  <rect x="420" y="268" width="480" height="80" class="cold"/>
  <text x="440" y="290" class="step" style="font-size:11px">3 / 无辅助损失路由（Aux-Loss-Free Routing）</text>
  <text x="440" y="310" class="small" style="font-size:10px">训练时调整各专家偏置项（Per-Expert Bias），</text>
  <text x="440" y="326" class="small" style="font-size:10px">平衡负载，无需辅助损失项（Auxiliary Loss）。</text>
  <text x="440" y="342" class="small" style="font-size:10px">效果相同，目标（Objective）更简洁。</text>

  <rect x="420" y="356" width="480" height="80" class="dsk"/>
  <text x="440" y="378" class="step" style="font-size:12px">4 / DualPipe 训练（Training）</text>
  <text x="440" y="398" class="small" style="font-size:9px">2k 块 H800 GPU 上的双向流水线重叠（Bidirectional Pipeline）。</text>
  <text x="440" y="414" class="small" style="font-size:10px">将跨节点全互连（All-to-All）隐藏在计算窗口中。</text>
  <text x="440" y="430" class="small" style="font-size:10px">V3 规模下，相比 1F1B 收回约 245k GPU 小时。</text>

  <rect x="420" y="444" width="480" height="100" class="box"/>
  <text x="440" y="466" class="step" style="font-size:12px">带来的能力（What This Unlocks）</text>
  <text x="440" y="484" class="small" style="font-size:9px">· 128k 上下文，KV 缓存（KV Cache）规模可控（MLA）</text>
  <text x="440" y="500" class="small" style="font-size:9px">· 同等激活 FLOP 预算提供更大容量（256 专家、前 8 路由）</text>
  <text x="440" y="516" class="small" style="font-size:9px">· 免费获得 1.8 倍解码吞吐量（Decode Throughput），MTP 作草稿</text>
  <text x="440" y="532" class="small" style="font-size:9px">· 2k 进程训练的 GPU 利用率（Utilization）超过 95%（DualPipe）</text>
</svg>
