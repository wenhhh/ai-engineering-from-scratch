<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .shared { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .old { fill: #eeeeee; stroke: #888; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title" style="font-size:14px">顺序多词元预测（Sequential Multi-Token Prediction）：DeepSeek-V3 式</text>

  <!-- Main backbone -->
  <rect x="30" y="60" width="200" height="60" class="box"/>
  <text x="130" y="80" text-anchor="middle" class="head" style="font-size:10px">主模型骨干（Main Model Backbone）</text>
  <text x="130" y="100" text-anchor="middle" class="step">h_i^(0)  ·  L_main</text>

  <!-- Shared embedding -->
  <rect x="30" y="150" width="200" height="50" class="shared"/>
  <text x="130" y="170" text-anchor="middle" class="head" style="font-size:10px">共享嵌入 E（Shared Embedding）</text>
  <text x="130" y="188" text-anchor="middle" class="small" style="font-size:8px">主模型与各深度共用（Shared Across Depths）</text>

  <!-- Depth 1 module -->
  <rect x="280" y="60" width="260" height="140" class="cool"/>
  <text x="410" y="82" text-anchor="middle" class="head" style="font-size:12px">MTP 模块（Module）k=1</text>
  <text x="410" y="100" text-anchor="middle" class="small" style="font-size:7px">组合（Combine）: M_1 * [RMSNorm(h^0); RMSNorm(E(t_{i+1}))]</text>
  <text x="410" y="118" text-anchor="middle" class="small" style="font-size:9px">Transformer 块 T_1（注意力 attn + MLP）</text>
  <text x="410" y="138" text-anchor="middle" class="step">h_i^(1)</text>
  <text x="410" y="160" text-anchor="middle" class="small" style="font-size:8px">共享 LM 头（Shared LM Head）-&gt; 预测 t_{i+1}</text>
  <text x="410" y="180" text-anchor="middle" class="step"><tspan dy="10">L_1 = CE(logits, t_{i+1})</tspan></text>

  <!-- Depth 2 module -->
  <rect x="580" y="60" width="260" height="140" class="cool"/>
  <text x="710" y="82" text-anchor="middle" class="head" style="font-size:12px">MTP 模块（Module）k=2</text>
  <text x="710" y="100" text-anchor="middle" class="small" style="font-size:7px">组合（Combine）: M_2 * [RMSNorm(h^1); RMSNorm(E(t_{i+2}))]</text>
  <text x="710" y="118" text-anchor="middle" class="small" style="font-size:9px">Transformer 块 T_2（注意力 attn + MLP）</text>
  <text x="710" y="138" text-anchor="middle" class="step">h_i^(2)</text>
  <text x="710" y="160" text-anchor="middle" class="small" style="font-size:8px">共享 LM 头（Shared LM Head）-&gt; 预测 t_{i+2}</text>
  <text x="710" y="180" text-anchor="middle" class="step"><tspan dy="10">L_2 = CE(logits, t_{i+2})</tspan></text>

  <!-- Arrows between modules -->
  <line x1="230" y1="90" x2="280" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="90" x2="580" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="80" text-anchor="middle" class="small">h^(1)</text>

  <!-- Shared head -->
  <rect x="340" y="230" width="280" height="50" class="shared"/>
  <text x="480" y="250" text-anchor="middle" class="head" style="font-size:10px">共享输出头 Out（Shared Output Head）</text>
  <text x="480" y="268" text-anchor="middle" class="small" style="font-size:8px">复用主 LM 头，无新增参数（No Extra Params）</text>

  <!-- E feeds into modules -->
  <line x1="230" y1="175" x2="285" y2="175" stroke="#5a4fcf" stroke-width="1.2"/>
  <line x1="285" y1="175" x2="285" y2="130" stroke="#5a4fcf" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="230" y1="175" x2="585" y2="175" stroke="#5a4fcf" stroke-width="1.0" stroke-dasharray="3,2"/>
  <line x1="585" y1="175" x2="585" y2="130" stroke="#5a4fcf" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Joint loss -->
  <rect x="30" y="320" width="900" height="60" class="box"/>
  <text x="480" y="343" text-anchor="middle" class="head" style="font-size:12px">联合损失（Joint Loss）</text>
  <text x="480" y="363" text-anchor="middle" class="step">L_total = L_main + (lambda / D) * sum_{k=1..D} L_k</text>

  <!-- Inference repurpose -->
  <rect x="30" y="400" width="900" height="120" class="hot"/>
  <text x="480" y="423" text-anchor="middle" class="label" style="font-size:12px">推理时：MTP 模块成为推测解码草稿（Speculative-Decoding Draft）</text>
  <text x="50" y="450" class="step" style="font-size:10px">模块（Module）k=1</text>
  <text x="220" y="450" class="small" style="font-size:9px">依据主模型 h^(0) 生成草稿 t_{i+1} · DeepSeek-V3 接受率（Acceptance）80%+</text>
  <text x="50" y="470" class="step" style="font-size:10px">模块（Module）k=2</text>
  <text x="220" y="470" class="small" style="font-size:9px">依据 h^(1) + E(t_{i+1}) 生成草稿 t_{i+2} · 跨深度链式依赖（Depth Chain）</text>
  <text x="50" y="490" class="step" style="font-size:10px">验证器（Verifier）</text>
  <text x="220" y="490" class="small" style="font-size:9px">主模型按 Leviathan 规则接受/拒绝（Accept/Reject）（阶段 10 · 15）</text>
  <text x="50" y="510" class="step" style="font-size:10px">加速（Speedup）</text>
  <text x="220" y="510" class="small" style="font-size:9px">生成吞吐量（Generation Throughput）约 1.8 倍：论文报告的实测值</text>
</svg>
