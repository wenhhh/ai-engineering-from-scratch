<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #222; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">用两种循环替代人类偏好标注预算（Human Preference Budget）</text>

  <!-- CAI column -->
  <rect x="40" y="55" width="400" height="380" class="box"/>
  <text x="240" y="80" text-anchor="middle" class="label" style="font-size:12px">宪法式 AI（Constitutional AI）：主观行为</text>

  <rect x="60" y="100" width="360" height="32" class="hot"/>
  <text x="240" y="121" text-anchor="middle" class="content">提示词（Prompt）+ 初始回答</text>

  <line x1="240" y1="137" x2="240" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="160" width="360" height="48" class="box"/>
  <text x="240" y="180" text-anchor="middle" class="content">模型依据从宪法（Constitution）</text>
  <text x="240" y="198" text-anchor="middle" class="content">中采样的原则进行批评（Critique）</text>

  <line x1="240" y1="213" x2="240" y2="231" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="236" width="360" height="32" class="box"/>
  <text x="240" y="257" text-anchor="middle" class="content">模型重写回答（Response）</text>

  <line x1="240" y1="273" x2="240" y2="291" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="296" width="360" height="32" class="cool"/>
  <text x="240" y="317" text-anchor="middle" class="content">对 (prompt, revised) 进行监督微调（SFT）</text>

  <line x1="240" y1="333" x2="240" y2="351" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="356" width="360" height="32" class="cool"/>
  <text x="240" y="377" text-anchor="middle" class="content">以 AI 成对判断进行直接偏好优化（DPO）</text>

  <text x="240" y="412" text-anchor="middle" class="caption">调整宪法（Constitution）文本即可控制行为，</text>
  <text x="240" y="427" text-anchor="middle" class="caption">无需重新标注数千个样本对</text>

  <!-- GRPO column -->
  <rect x="460" y="55" width="400" height="380" class="box"/>
  <text x="660" y="80" text-anchor="middle" class="label">组相对策略优化（GRPO）：可验证行为</text>

  <rect x="480" y="100" width="360" height="32" class="hot"/>
  <text x="660" y="121" text-anchor="middle" class="content">提示词（Prompt）：数学 / 代码 / 格式</text>

  <line x1="660" y1="137" x2="660" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="160" width="360" height="48" class="box"/>
  <text x="660" y="180" text-anchor="middle" class="content">采样（Sample）G 个回答</text>
  <text x="660" y="198" text-anchor="middle" class="content">(G = 16, 32, 64)</text>

  <line x1="660" y1="213" x2="660" y2="231" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="236" width="360" height="32" class="box"/>
  <text x="660" y="257" text-anchor="middle" class="content">确定性规则（Deterministic Rule）逐一评分</text>

  <line x1="660" y1="273" x2="660" y2="291" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="296" width="360" height="32" class="cool"/>
  <text x="660" y="317" text-anchor="middle" class="content" style="font-size:10px">A_i = (r_i - mean) / std  组相对（group-relative）</text>

  <line x1="660" y1="333" x2="660" y2="351" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="356" width="360" height="32" class="cool"/>
  <text x="660" y="377" text-anchor="middle" class="content" style="font-size:10px">裁剪替代目标（Clipped Surrogate）+ 参考模型 KL</text>

  <text x="660" y="412" text-anchor="middle" class="caption">无需价值函数（Value Function）或奖励模型（Reward Model）</text>
  <text x="660" y="427" text-anchor="middle" class="caption">DeepSeek-R1 配方，仅用结果奖励模型（ORM）</text>

  <text x="450" y="468" text-anchor="middle" class="caption">CAI 负责“语气”，GRPO 负责“答案”。2026 年的大多数流水线（Pipeline）同时使用两者。</text>
</svg>
