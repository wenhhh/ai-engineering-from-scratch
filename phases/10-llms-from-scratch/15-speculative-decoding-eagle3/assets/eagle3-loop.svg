<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .old { fill: #eeeeee; stroke: #888; stroke-width: 1.2; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title">推测解码循环（Speculative Decoding Loop）：EAGLE-3 方式</text>

  <!-- prefix -->
  <rect x="30" y="60" width="200" height="40" class="box"/>
  <text x="130" y="85" text-anchor="middle" class="step">前缀（Prefix）x_1 ... x_k</text>

  <!-- draft step -->
  <rect x="260" y="60" width="280" height="40" class="cool"/>
  <text x="400" y="85" text-anchor="middle" class="step" style="font-size:10px">起草 N 个词元：d_1, d_2, ..., d_N  ~ p</text>
  <line x1="232" y1="80" x2="258" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- verify -->
  <rect x="570" y="60" width="360" height="40" class="hot"/>
  <text x="750" y="85" text-anchor="middle" class="step">验证模型 q(prefix + drafts)：仅一次前向传播</text>
  <line x1="542" y1="80" x2="568" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Leviathan rule -->
  <rect x="30" y="140" width="900" height="60" class="box"/>
  <text x="50" y="165" class="head">Leviathan 规则（Rule，对每个 i = 1..N）</text>
  <text x="50" y="185" class="step" style="font-size:10px">若 u &lt; min(1, q(d_i) / p(d_i))，接受 d_i；否则输出修正词元 correction ~ (q - p)_+ / ||(q - p)_+||_1 并停止</text>

  <!-- outcome A -->
  <rect x="30" y="220" width="430" height="80" class="cool"/>
  <text x="245" y="243" text-anchor="middle" class="head">全部 N 个被接受（Accepted）</text>
  <text x="245" y="263" text-anchor="middle" class="step">输出 d_1 ... d_N + bonus ~ q_{N+1}（奖励词元）</text>
  <text x="245" y="282" text-anchor="middle" class="small">kv_length += N + 1  |  每次验证最多 N+1 个词元</text>

  <!-- outcome B -->
  <rect x="500" y="220" width="430" height="80" class="hot"/>
  <text x="715" y="243" text-anchor="middle" class="head">在位置 j 拒绝（Reject）</text>
  <text x="715" y="263" text-anchor="middle" class="step" style="font-size:10px">输出 d_1 ... d_{j-1} + correction ~ residual</text>
  <text x="715" y="282" text-anchor="middle" class="small">kv truncate_to(k + j)  |  丢弃 j 之后的草稿</text>

  <!-- draft evolution table -->
  <rect x="30" y="320" width="900" height="150" class="box"/>
  <text x="480" y="343" text-anchor="middle" class="label">草稿演进（Draft Evolution）：每代带来了什么</text>

  <text x="50" y="372" class="step">Leviathan 2023</text>
  <text x="220" y="372" class="small">独立小型大语言模型（LLM） · alpha ~ 0.60 · 2 倍加速</text>

  <text x="50" y="392" class="step">EAGLE-1 (2024)</text>
  <text x="220" y="392" class="small">基于验证模型隐藏状态的单层 Transformer · alpha ~ 0.75 · 2.5x</text>

  <text x="50" y="412" class="step">EAGLE-2 (2024)</text>
  <text x="220" y="412" class="small">+ 动态草稿树（Dynamic Draft Tree） · alpha ~ 0.85 · 3x-4x</text>

  <text x="50" y="432" class="step">EAGLE-3 (2025)</text>
  <text x="220" y="432" class="small">去掉特征损失 + 训练时测试（TTT） · alpha ~ 0.90+ · 3x-6.5x</text>

  <text x="50" y="452" class="step">Medusa (2024)</text>
  <text x="220" y="452" class="small">验证模型增加语言模型头（LM Heads，无草稿模型） · alpha ~ 0.70 · 2x-3x</text>

  <text x="480" y="500" text-anchor="middle" class="caption">输出分布（Output Distribution）与验证模型分布完全相同。唯一变量是 alpha 和 N。</text>
</svg>
