<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">EAGLE-3 推测解码：alpha 是唯一重要的指标</text>

  <rect x="40" y="50" width="420" height="240" class="box"/>
  <text x="250" y="72" text-anchor="middle" class="head">执行流程（K=5）</text>
  <rect x="60" y="90" width="120" height="40" class="cool"/>
  <text x="120" y="114" text-anchor="middle" class="small">草稿头（Draft head）</text>
  <rect x="200" y="90" width="240" height="40" class="cold"/>
  <text x="320" y="114" text-anchor="middle" class="step">5 个候选词元</text>
  <line x1="180" y1="110" x2="198" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="200" y="140" width="240" height="40" class="hot"/>
  <text x="320" y="164" text-anchor="middle" class="step">目标验证（1 次前向）</text>
  <line x1="320" y1="132" x2="320" y2="139" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="200" y="190" width="240" height="40" class="cool"/>
  <text x="320" y="214" text-anchor="middle" class="step">接受 K * alpha 个词元</text>
  <line x1="320" y1="182" x2="320" y2="189" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="200" y="240" width="240" height="40" class="old" fill="#eeeeee" stroke="#888"/>
  <text x="320" y="264" text-anchor="middle" class="step">其余重新生成（第二遍）</text>

  <rect x="480" y="50" width="440" height="240" class="box"/>
  <text x="700" y="72" text-anchor="middle" class="head">不同工作负载的 alpha</text>
  <rect x="500" y="90" width="400" height="30" class="cool"/>
  <text x="510" y="110" class="small">通用聊天 + ShareGPT 训练的 EAGLE-3：alpha 0.60 - 0.80</text>
  <rect x="500" y="125" width="400" height="30" class="cold"/>
  <text x="510" y="145" class="small">专业领域（代码、法律、医疗）：alpha 0.40 - 0.60</text>
  <rect x="500" y="160" width="400" height="30" class="hot"/>
  <text x="510" y="180" class="small">领域不匹配且未重训草稿：alpha 0.30 - 0.45</text>
  <rect x="500" y="195" width="400" height="30" class="dsk"/>
  <text x="510" y="215" class="small">经典草稿模型（Llama 3.2 1B 为 70B 起草）：alpha 0.30 - 0.50</text>
  <rect x="500" y="230" width="400" height="50" class="box"/>
  <text x="510" y="250" class="small">256 并发下盈亏平衡 alpha：约 0.55</text>
  <text x="510" y="268" class="small">低于此值：即使均值改善，P99 尾延迟也会恶化</text>

  <rect x="40" y="310" width="880" height="100" class="box"/>
  <text x="480" y="332" text-anchor="middle" class="head">代际演进</text>
  <text x="60" y="356" class="step">经典草稿模型</text>
  <text x="60" y="374" class="small"><tspan x="60">加载两模型；每次目标前向</tspan><tspan x="60" dy="13">配 K 次草稿前向；alpha 0.3-0.5</tspan></text>
  <text x="280" y="356" class="step">EAGLE-1</text>
  <text x="280" y="374" class="small">目标末层草稿头；alpha 约 0.5-0.6</text>
  <text x="500" y="356" class="step">EAGLE-2</text>
  <text x="500" y="374" class="small">树状草稿、自适应 K；alpha 约 0.6-0.7</text>
  <text x="720" y="356" class="step">EAGLE-3 (2025-2026)</text>
  <text x="720" y="374" class="small">多层草稿头；alpha 约 0.6-0.8</text>
  <text x="60" y="396" class="caption">所有 EAGLE 变体训练都快，只为目标增加少量参数</text>

  <rect x="40" y="430" width="880" height="110" class="hot"/>
  <text x="480" y="452" text-anchor="middle" class="head">生产检查清单</text>
  <text x="60" y="474" class="small">1. 纯目标模型基线：目标并发下的 TTFT、ITL、吞吐量</text>
  <text x="60" y="490" class="small">2. 通过 speculative_config 启用 EAGLE-3 草稿，重跑基准</text>
  <text x="60" y="506" class="small">3. 记录 alpha（vLLM V1 报告每请求接受词元数），门禁为 alpha &gt;= 0.55</text>
  <text x="60" y="522" class="small">4. 观察 P99 ITL 而非 P50：被拒草稿双遍执行推高尾延迟</text>
  <text x="60" y="538" class="small">5. vLLM v0.18.0：草稿模型推测解码不兼容分块预填充，V1 的 N-gram 是例外</text>
</svg>
