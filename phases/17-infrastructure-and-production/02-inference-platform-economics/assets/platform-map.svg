<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .silicon { fill: #ffe1e1; stroke: #c0392b; stroke-width: 1.5; }
      .gpu { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .api { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">推理平台地图：三种市场，六家服务商</text>

  <rect x="40" y="50" width="280" height="460" class="box"/>
  <text x="180" y="72" text-anchor="middle" class="head">定制芯片（Custom silicon）</text>
  <rect x="60" y="90" width="240" height="60" class="silicon"/>
  <text x="180" y="110" text-anchor="middle" class="step">Groq (LPU)</text>
  <text x="180" y="128" text-anchor="middle" class="small">语音智能体、实时翻译</text>
  <text x="180" y="144" text-anchor="middle" class="small">解码速度比 GPU 快 5-10 倍</text>
  <rect x="60" y="160" width="240" height="60" class="silicon"/>
  <text x="180" y="180" text-anchor="middle" class="step">Cerebras (WSE)</text>
  <text x="180" y="198" text-anchor="middle" class="small">晶圆级引擎（Wafer-scale engine）</text>
  <text x="180" y="214" text-anchor="middle" class="small">超长上下文解码</text>
  <rect x="60" y="230" width="240" height="60" class="silicon"/>
  <text x="180" y="250" text-anchor="middle" class="step">SambaNova (RDU)</text>
  <text x="180" y="268" text-anchor="middle" class="small">可重构数据流（Reconfigurable dataflow）</text>
  <text x="180" y="284" text-anchor="middle" class="small">受监管企业场景</text>
  <text x="180" y="330" text-anchor="middle" class="caption">每词元价格有溢价</text>
  <text x="180" y="346" text-anchor="middle" class="caption">在延迟 SLA 上胜出</text>

  <rect x="340" y="50" width="280" height="460" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">GPU 平台</text>
  <rect x="360" y="90" width="240" height="60" class="gpu"/>
  <text x="480" y="110" text-anchor="middle" class="step">Fireworks：延迟</text>
  <text x="480" y="128" text-anchor="middle" class="small">FireAttention，估值 $4B</text>
  <text x="480" y="144" text-anchor="middle" class="small">2026 年 5 月 GPU 涨 $1/小时</text>
  <rect x="360" y="160" width="240" height="60" class="gpu"/>
  <text x="480" y="180" text-anchor="middle" class="step">Together：覆盖广度</text>
  <text x="480" y="198" text-anchor="middle" class="small">200+ 模型，比 Replicate 低 50-70%</text>
  <text x="480" y="214" text-anchor="middle" class="small">“AI 原生云（AI Native Cloud）”</text>
  <rect x="360" y="230" width="240" height="60" class="gpu"/>
  <text x="480" y="250" text-anchor="middle" class="step">Baseten：企业级</text>
  <text x="480" y="268" text-anchor="middle" class="small">2026 年 1 月估值 $5B；SOC2+HIPAA</text>
  <text x="480" y="284" text-anchor="middle" class="small">Truss，按分钟计费</text>
  <rect x="360" y="300" width="240" height="60" class="gpu"/>
  <text x="480" y="320" text-anchor="middle" class="step">Modal：Python 开发者体验</text>
  <text x="480" y="338" text-anchor="middle" class="small">估值 $1.1B，按秒计费</text>
  <text x="480" y="354" text-anchor="middle" class="small">以 Python 定义基础设施</text>
  <rect x="360" y="370" width="240" height="60" class="gpu"/>
  <text x="480" y="390" text-anchor="middle" class="step">Anyscale：Ray 原生</text>
  <text x="480" y="408" text-anchor="middle" class="small">RayTurbo 推理引擎</text>
  <text x="480" y="424" text-anchor="middle" class="small">托管 Ray 集群</text>

  <rect x="640" y="50" width="280" height="460" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">API 优先模型市场</text>
  <rect x="660" y="90" width="240" height="60" class="api"/>
  <text x="780" y="110" text-anchor="middle" class="step">Replicate</text>
  <text x="780" y="128" text-anchor="middle" class="small">按预测计费</text>
  <text x="780" y="144" text-anchor="middle" class="small">追求多模态广度的默认选择</text>
  <rect x="660" y="160" width="240" height="60" class="api"/>
  <text x="780" y="180" text-anchor="middle" class="step">DeepInfra</text>
  <text x="780" y="198" text-anchor="middle" class="small">具有竞争力的词元定价</text>
  <text x="780" y="214" text-anchor="middle" class="small">面向爱好者和原型开发</text>
  <rect x="660" y="230" width="240" height="60" class="api"/>
  <text x="780" y="250" text-anchor="middle" class="step">OpenRouter</text>
  <text x="780" y="268" text-anchor="middle" class="small">100+ 模型统一 API</text>
  <text x="780" y="284" text-anchor="middle" class="small">一份余额用于多家服务商</text>
  <rect x="660" y="300" width="240" height="60" class="api"/>
  <text x="780" y="320" text-anchor="middle" class="step">Fal</text>
  <text x="780" y="338" text-anchor="middle" class="small">专注图像和视频</text>
  <text x="780" y="354" text-anchor="middle" class="small">无服务器，按调用计费</text>
  <text x="780" y="420" text-anchor="middle" class="caption">缩短首次调用准备时间</text>
  <text x="780" y="436" text-anchor="middle" class="caption">突发、小规模场景成本最低</text>

  <rect x="40" y="520" width="880" height="30" class="box"/>
  <text x="480" y="538" text-anchor="middle" class="step">规则：单 GPU 持续利用率超过约 30% 时，按分钟计费胜过按词元计费</text>
</svg>
