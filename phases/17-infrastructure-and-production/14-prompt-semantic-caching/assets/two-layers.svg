<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .l1 { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .l2 { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .bad { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">双层缓存：L1 跳过 LLM，L2 复用 KV</text>

  <rect x="40" y="50" width="420" height="220" class="l1"/>
  <text x="250" y="72" text-anchor="middle" class="head">L1：语义缓存（应用层）</text>
  <text x="250" y="94" text-anchor="middle" class="step">嵌入提示词 → 查找相似缓存</text>
  <text x="60" y="118" class="small">工具：GPTCache、Redis Vec、Portkey、Helicone</text>
  <text x="60" y="136" class="small">阈值：余弦 ≥ 0.95 起步，再调优</text>
  <text x="60" y="154" class="small">生产命中率：</text>
  <text x="60" y="172" class="small">  开放聊天：10-15%</text>
  <text x="60" y="190" class="small">  结构化 FAQ：40-70%</text>
  <text x="60" y="208" class="small">  代码问题：20-30%</text>
  <text x="60" y="226" class="small">  语音智能体重复请求：50-80%</text>
  <text x="250" y="254" text-anchor="middle" class="caption">服务商“95% 准确率”指匹配正确率，而非命中率</text>

  <rect x="500" y="50" width="420" height="220" class="l2"/>
  <text x="710" y="72" text-anchor="middle" class="head">L2：服务商前缀缓存</text>
  <text x="710" y="94" text-anchor="middle" class="step">为重复前缀复用注意力 KV</text>
  <text x="520" y="118" class="small">Anthropic：显式 cache_control 标记</text>
  <text x="520" y="136" class="small">  缓存读取 $0.30/M，新输入 $3.00/M（10 倍）</text>
  <text x="520" y="154" class="small">  写入溢价：5 分钟 TTL 1.25 倍，1 小时 2 倍</text>
  <text x="520" y="172" class="small">OpenAI：自动缓存，提示词 &gt; 1024 词元</text>
  <text x="520" y="190" class="small">  缓存输入约便宜 10 倍，典型命中约 50%</text>
  <text x="520" y="208" class="small">Gemini：显式上下文缓存 API</text>
  <text x="520" y="226" class="small">自托管：阶段 17 · 06 RadixAttention</text>
  <text x="710" y="254" text-anchor="middle" class="caption">ProjectDiscovery：重组提示词，命中率 7% → 74%</text>

  <rect x="40" y="290" width="880" height="110" class="bad"/>
  <text x="480" y="312" text-anchor="middle" class="head">使命中率崩塌的反模式</text>
  <text x="60" y="338" class="step">· 并行化代价</text>
  <text x="60" y="356" class="small">  首次写缓存前并行 10 次调用 = 10 次写、0 次读 → 账单 5-10 倍</text>
  <text x="60" y="374" class="step">· 前缀中的动态内容</text>
  <text x="60" y="392" class="small">  当前时间、请求 ID、随机示例让每请求都独特 → 0 命中</text>

  <rect x="40" y="420" width="880" height="80" class="box"/>
  <text x="480" y="442" text-anchor="middle" class="head">夜间任务叠加使用</text>
  <text x="480" y="464" text-anchor="middle" class="step">Batch API（五折）+ 缓存输入（输入便宜 10 倍）→ 同步无缓存成本的约 10%</text>
  <text x="480" y="484" text-anchor="middle" class="caption">能够容忍 24 小时延迟的任务，都应叠加两者</text>
</svg>
