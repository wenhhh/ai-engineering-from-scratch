<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .gw { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .feat { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .scale { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">AI 网关（AI gateways）：七项功能，2026 年四款领先产品</text>

  <rect x="40" y="50" width="280" height="220" class="feat"/>
  <text x="180" y="72" text-anchor="middle" class="head">核心功能</text>
  <text x="60" y="96" class="step">· 提供商路由</text>
  <text x="60" y="116" class="step">· 回退链</text>
  <text x="60" y="136" class="step">· 重试（退避）</text>
  <text x="60" y="156" class="step">· 限流（按租户）</text>
  <text x="60" y="176" class="step">· 密钥引用</text>
  <text x="60" y="196" class="step">· 可观测性（OTel）</text>
  <text x="60" y="216" class="step">· 防护（PII、越狱）</text>
  <text x="180" y="250" text-anchor="middle" class="caption">企业规模下，七项功能缺一不可</text>

  <rect x="340" y="50" width="280" height="220" class="gw"/>
  <text x="480" y="72" text-anchor="middle" class="head">2026 年的网关</text>
  <rect x="360" y="90" width="240" height="35" class="box"/>
  <text x="480" y="112" text-anchor="middle" class="step">LiteLLM：MIT、Python</text>
  <rect x="360" y="132" width="240" height="35" class="box"/>
  <text x="480" y="154" text-anchor="middle" class="step">Portkey：Apache 2.0、防护</text>
  <rect x="360" y="174" width="240" height="35" class="box"/>
  <text x="480" y="196" text-anchor="middle" class="step">Kong AI Gateway：企业级</text>
  <rect x="360" y="216" width="240" height="35" class="box"/>
  <text x="480" y="238" text-anchor="middle" class="small">Cloudflare / Vercel：边缘托管</text>

  <rect x="640" y="50" width="280" height="220" class="scale"/>
  <text x="780" y="72" text-anchor="middle" class="head">规模与开销（Kong 基准）</text>
  <text x="660" y="96" class="step">Kong：约 5ms 开销（基准）</text>
  <text x="660" y="116" class="small">LiteLLM：约 10ms（&gt;2K RPS 故障）</text>
  <text x="660" y="136" class="step">Portkey：约 30ms 开销</text>
  <text x="660" y="156" class="step">Cloudflare：约 2ms（边缘）</text>
  <text x="660" y="190" class="small">Kong 比 Portkey 快 228%</text>
  <text x="660" y="208" class="small">Kong 比 LiteLLM 快 859%</text>
  <text x="660" y="226" class="small">使用相同的 12 个 CPU</text>
  <text x="780" y="258" text-anchor="middle" class="caption">开发用 LiteLLM，规模化生产用 Kong</text>

  <rect x="40" y="290" width="440" height="130" class="box"/>
  <text x="260" y="312" text-anchor="middle" class="head">数据驻留要求驱动自托管决策</text>
  <text x="60" y="338" class="step">医疗 / 金融 → 自托管</text>
  <text x="60" y="356" class="step">  LiteLLM、Portkey、Kong 开源版</text>
  <text x="60" y="374" class="step">消费产品 → 托管边缘服务</text>
  <text x="60" y="392" class="step">  产品：Cloudflare AI Gateway、Vercel AI</text>
  <text x="60" y="410" class="caption">Portkey 于 2026 年 3 月采用 Apache 2.0，改变了中间档位格局</text>

  <rect x="500" y="290" width="420" height="130" class="box"/>
  <text x="710" y="312" text-anchor="middle" class="head">与阶段 17 · 13 和 16 组合</text>
  <text x="520" y="338" class="step">网关（19）+ 可观测性（13）+ 路由（16）</text>
  <text x="520" y="356" class="step">通常由同一个工具承担：</text>
  <text x="520" y="374" class="small" style="font-size: 8px">Portkey = gateway + observability + guardrails（网关、可观测性、防护）</text>
  <text x="520" y="392" class="small" style="font-size: 8px">Helicone = gateway + observability（网关、可观测性）</text>
  <text x="520" y="410" class="caption">选择一个，或用 OpenTelemetry 连接三者</text>

  <rect x="40" y="440" width="880" height="50" class="box"/>
  <text x="480" y="462" text-anchor="middle" class="step">回退计算：OpenAI 3% × Anthropic 2% = 0.06%，即两者同时失败</text>
  <text x="480" y="480" text-anchor="middle" class="caption">三提供商回退链的实际可用性为 99.997%</text>
</svg>
