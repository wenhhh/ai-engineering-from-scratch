<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .cheap { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .front { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .signal { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .arrow { stroke: #1a1a1a; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">模型路由（model routing）：四种信号，三种模式</text>

  <rect x="40" y="50" width="280" height="220" class="signal"/>
  <text x="180" y="72" text-anchor="middle" class="head">路由信号（signals）</text>
  <rect x="60" y="90" width="240" height="35" class="box"/>
  <text x="180" y="112" text-anchor="middle" class="step">1. 任务分类</text>
  <rect x="60" y="130" width="240" height="35" class="box"/>
  <text x="180" y="152" text-anchor="middle" class="step">2. 提示词长度</text>
  <rect x="60" y="170" width="240" height="35" class="box"/>
  <text x="180" y="192" text-anchor="middle" class="step">3. 与已知难题的嵌入相似度</text>
  <rect x="60" y="210" width="240" height="35" class="box"/>
  <text x="180" y="232" text-anchor="middle" class="step">4. 自置信度（logprobs）</text>
  <text x="180" y="258" text-anchor="middle" class="caption">组合四种信号；单独使用都会漏判</text>

  <rect x="340" y="50" width="280" height="220" class="box"/>
  <text x="480" y="72" text-anchor="middle" class="head">模式：CASCADE（先用低成本模型）</text>
  <rect x="360" y="90" width="240" height="45" class="cheap"/>
  <text x="480" y="115" text-anchor="middle" class="step">低成本模型（Haiku 级别）</text>
  <text x="480" y="130" text-anchor="middle" class="small">输入 $0.25/M，输出 $1/M</text>
  <rect x="360" y="150" width="240" height="35" class="signal"/>
  <text x="480" y="172" text-anchor="middle" class="step">置信度检查</text>
  <rect x="360" y="200" width="240" height="60" class="front"/>
  <text x="480" y="222" text-anchor="middle" class="step">仅在低置信度时使用前沿模型</text>
  <text x="480" y="240" text-anchor="middle" class="small">混合流量中约 10% 需要升级</text>
  <text x="480" y="254" text-anchor="middle" class="small">升级请求的延迟约为 2 倍</text>

  <rect x="640" y="50" width="280" height="220" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">模式：PRE_ROUTE（预路由）</text>
  <text x="780" y="94" text-anchor="middle" class="small">先运行分类器（5–10ms）</text>
  <rect x="660" y="110" width="240" height="45" class="cheap"/>
  <text x="780" y="135" text-anchor="middle" class="step">简单任务使用低成本模型</text>
  <rect x="660" y="170" width="240" height="45" class="front"/>
  <text x="780" y="195" text-anchor="middle" class="step">难题使用前沿模型</text>
  <text x="780" y="230" text-anchor="middle" class="caption">整体最快；质量下限取决于分类准确率</text>

  <rect x="40" y="290" width="880" height="100" class="box"/>
  <text x="480" y="312" text-anchor="middle" class="head">2026 年的价格曲线</text>
  <text x="480" y="334" text-anchor="middle" class="step">GPT-4 级别质量：$20/M（2022 年末）→ $0.40/M（2026 年），约降至 1/50</text>
  <text x="480" y="352" text-anchor="middle" class="step">LLM 总体价格每年约降至 1/10，主要来自服务效率（阶段 17 · 04–09）</text>
  <text x="480" y="372" text-anchor="middle" class="caption">路由让应用层获得这些收益</text>

  <rect x="40" y="410" width="880" height="80" class="box"/>
  <text x="480" y="432" text-anchor="middle" class="head">漂移才是真正的风险</text>
  <text x="480" y="454" text-anchor="middle" class="step">监控：各路由点赞与点踩 · 各路由抽样 LLM 评判 · 升级率 · 拒答率</text>
  <text x="480" y="474" text-anchor="middle" class="caption">低成本模型的使用范围悄然扩大，直到竞争对手的基准测试将问题暴露</text>
</svg>
