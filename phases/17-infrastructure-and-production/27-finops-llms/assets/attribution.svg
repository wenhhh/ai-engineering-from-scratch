<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .dim { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .layer { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .enforce { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .kill { fill: #ffe1e1; stroke: #b71c1c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM 的 FinOps：三个维度、四个层次、三级约束</text>

  <rect x="40" y="50" width="280" height="180" class="dim"/>
  <text x="180" y="72" text-anchor="middle" class="head">三个归因维度</text>
  <rect x="60" y="90" width="240" height="35" class="box"/>
  <text x="180" y="112" text-anchor="middle" class="step">按用户（user_id）</text>
  <rect x="60" y="130" width="240" height="35" class="box"/>
  <text x="180" y="152" text-anchor="middle" class="step">按任务（task_id + route）</text>
  <rect x="60" y="170" width="240" height="35" class="box"/>
  <text x="180" y="192" text-anchor="middle" class="step">按租户（tenant_id）</text>
  <text x="180" y="222" text-anchor="middle" class="caption">第一天就为三者埋点</text>

  <rect x="340" y="50" width="280" height="180" class="layer"/>
  <text x="480" y="72" text-anchor="middle" class="head">四个词元层</text>
  <text x="360" y="96" class="step">· 提示词（40–60%）</text>
  <text x="360" y="116" class="step">· 工具（20–40%，智能体为主）</text>
  <text x="360" y="136" class="step">· 记忆（10–30%，RAG）</text>
  <text x="360" y="156" class="step">· 响应（10–30%）</text>
  <text x="480" y="200" text-anchor="middle" class="caption">合并四层会掩盖可优化之处</text>

  <rect x="640" y="50" width="280" height="180" class="enforce"/>
  <text x="780" y="72" text-anchor="middle" class="head">三级约束</text>
  <text x="660" y="96" class="step">1. 按租户限流</text>
  <text x="660" y="114" class="small">   峰值 2–3 倍，429 + Retry-After</text>
  <text x="660" y="138" class="step">2. 按租户每日支出上限</text>
  <text x="660" y="156" class="small">   合同 1.5–3 倍；收紧限流并通知 CS</text>
  <text x="660" y="180" class="step">3. z-score &gt; 4 时紧急停止</text>
  <text x="660" y="198" class="small">   自动暂停，并呼叫值班人员</text>

  <rect x="40" y="260" width="880" height="100" class="box"/>
  <text x="480" y="282" text-anchor="middle" class="head">单位指标：每项产品结果成本，而非每百万词元美元数</text>
  <text x="60" y="308" class="step">每张已解决客服工单的成本</text>
  <text x="60" y="326" class="step">每篇生成文章的成本</text>
  <text x="60" y="344" class="step">每次成功智能体任务的成本</text>
  <text x="500" y="308" class="step">每用户会话分钟的成本</text>
  <text x="500" y="326" class="step">每次索引刷新的成本</text>
  <text x="500" y="344" class="caption">成本应关联产品结果，否则优化没有依据</text>

  <rect x="40" y="380" width="880" height="110" class="kill"/>
  <text x="480" y="402" text-anchor="middle" class="head">叠加优化的最佳水平：简单基准的约 5–10%</text>
  <text x="480" y="424" text-anchor="middle" class="step">缓存（14）+ 批处理（15）+ 路由（16）+ 网关（19）</text>
  <text x="480" y="444" text-anchor="middle" class="step">各项降至一半或十分之一，叠加后相乘</text>
  <text x="480" y="464" text-anchor="middle" class="caption">多数团队使用 2–3 项，很少叠加全部四项</text>
  <text x="480" y="484" text-anchor="middle" class="small">leaked spend = gap between best-case stack and current（可避免支出 = 最佳组合与当前配置的差距）</text>
</svg>
