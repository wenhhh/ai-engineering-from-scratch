<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .inter { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .semi { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .batch { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">工作负载分类：三条通道，一条规则</text>

  <rect x="40" y="50" width="280" height="340" class="inter"/>
  <text x="180" y="72" text-anchor="middle" class="head">交互式（interactive）</text>
  <text x="180" y="94" text-anchor="middle" class="step">用户等待响应</text>
  <text x="60" y="122" class="small">· 首词元延迟（TTFT）很重要</text>
  <text x="60" y="140" class="small">· 同步调用，启用提示词缓存</text>
  <text x="60" y="158" class="small">· 不能使用批处理</text>
  <text x="60" y="176" class="small">· 示例：聊天、语音智能体、搜索</text>
  <text x="60" y="220" class="step">基准成本的 100%</text>
  <text x="60" y="238" class="small">（再扣除缓存节省的费用）</text>

  <rect x="340" y="50" width="280" height="340" class="semi"/>
  <text x="480" y="72" text-anchor="middle" class="head">半交互式（semi-interactive）</text>
  <text x="480" y="94" text-anchor="middle" class="step">用户几分钟后查看结果</text>
  <text x="360" y="122" class="small">· 异步队列，可回退为同步</text>
  <text x="360" y="140" class="small">· 可接受 P99 约 5–10 分钟</text>
  <text x="360" y="158" class="small">· 示例：中等规模 RAG 索引、</text>
  <text x="360" y="176" class="small">  “刷新”报告、半实时智能体</text>
  <text x="360" y="220" class="step">约为基准成本的 50%</text>
  <text x="360" y="238" class="small">（使用缓存，并分摊队列成本）</text>

  <rect x="640" y="50" width="280" height="340" class="batch"/>
  <text x="780" y="72" text-anchor="middle" class="head">批处理（batch）</text>
  <text x="780" y="94" text-anchor="middle" class="step">“早上之前”提供结果</text>
  <text x="660" y="122" class="small">· 始终批处理，并叠加缓存</text>
  <text x="660" y="140" class="small">· SLA 为 24h，典型 P50 为 2–6h</text>
  <text x="660" y="158" class="small">· 示例：内容流水线、</text>
  <text x="660" y="176" class="small">  分类、标注、报告</text>
  <text x="660" y="220" class="step">约为基准成本的 10%</text>
  <text x="660" y="238" class="small">（批处理五折，缓存输入降至 1/10）</text>

  <rect x="40" y="410" width="880" height="60" class="box"/>
  <text x="480" y="432" text-anchor="middle" class="head">决策规则</text>
  <text x="480" y="454" text-anchor="middle" class="step">如果用户可以接受 24h 延迟，就应将该工作负载归入批处理</text>
</svg>
