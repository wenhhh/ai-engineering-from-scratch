<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">Blackwell + TRT-LLM 技术栈：7 倍成本差距从何而来</text>

  <rect x="40" y="50" width="440" height="470" class="box"/>
  <text x="260" y="72" text-anchor="middle" class="head">Blackwell 精度体系</text>
  <rect x="60" y="90" width="400" height="60" class="cool"/>
  <text x="260" y="112" text-anchor="middle" class="step">权重：NVFP4（4 位微缩放）</text>
  <text x="260" y="130" text-anchor="middle" class="small">每解码词元字节数为 FP8 的一半</text>
  <text x="260" y="144" text-anchor="middle" class="small">模型服务商首日交付 FP4 权重</text>
  <rect x="60" y="160" width="400" height="60" class="hot"/>
  <text x="260" y="182" text-anchor="middle" class="step">KV 缓存：FP8（仍然关键）</text>
  <text x="260" y="200" text-anchor="middle" class="small">FP4 KV 使注意力分布尾部崩塌</text>
  <text x="260" y="214" text-anchor="middle" class="small">FP8 指数位保留动态范围</text>
  <rect x="60" y="230" width="400" height="60" class="cold"/>
  <text x="260" y="252" text-anchor="middle" class="step">激活：NVFP4</text>
  <text x="260" y="270" text-anchor="middle" class="small">层内范围较小，FP4 能保持效果</text>
  <text x="260" y="284" text-anchor="middle" class="small">Tensor Core 提供 MXFP8 变体</text>
  <rect x="60" y="300" width="400" height="60" class="dsk"/>
  <text x="260" y="322" text-anchor="middle" class="step">注意力累加器：FP32</text>
  <text x="260" y="340" text-anchor="middle" class="small">softmax 稳定性需要更高精度</text>
  <text x="260" y="354" text-anchor="middle" class="small">这一层不能妥协</text>
  <rect x="60" y="370" width="400" height="140" class="box"/>
  <text x="260" y="392" text-anchor="middle" class="head">质量注意事项</text>
  <text x="260" y="414" text-anchor="middle" class="small">推理过程负载使用 NVFP4 权重：</text>
  <text x="260" y="430" text-anchor="middle" class="small">数学、思维链、长上下文代码：</text>
  <text x="260" y="446" text-anchor="middle" class="small">没有逐块校准会明显降低质量</text>
  <text x="260" y="466" text-anchor="middle" class="small">恢复方案：FP8 权重 + FP4 激活</text>
  <text x="260" y="482" text-anchor="middle" class="small">或留在 H200，全程 FP8</text>
  <text x="260" y="502" text-anchor="middle" class="caption">迁移前必须验证评估质量</text>

  <rect x="500" y="50" width="420" height="470" class="box"/>
  <text x="710" y="72" text-anchor="middle" class="head">逐层叠加的技术栈收益</text>

  <rect x="520" y="90" width="380" height="60" class="cool"/>
  <text x="710" y="112" text-anchor="middle" class="step">1 / 硬件带宽</text>
  <text x="710" y="130" text-anchor="middle" class="small">H100 3.35 TB/s，B200 8.0 TB/s：约 2.4 倍</text>
  <text x="710" y="144" text-anchor="middle" class="small">解码受内存带宽限制，这是基础</text>

  <rect x="520" y="160" width="380" height="60" class="hot"/>
  <text x="710" y="182" text-anchor="middle" class="step">2 / NVFP4 权重</text>
  <text x="710" y="200" text-anchor="middle" class="small">每词元字节数减半：约 2.0 倍</text>
  <text x="710" y="214" text-anchor="middle" class="small">NVFP4 是当前唯一重要的权重精度</text>

  <rect x="520" y="230" width="380" height="60" class="cold"/>
  <text x="710" y="252" text-anchor="middle" class="step">3 / MTP 草稿</text>
  <text x="710" y="270" text-anchor="middle" class="small">多词元预测头：接受词元上约 1.8 倍</text>
  <text x="710" y="284" text-anchor="middle" class="small">集成于 TRT-LLM 构建</text>

  <rect x="520" y="300" width="380" height="60" class="dsk"/>
  <text x="710" y="322" text-anchor="middle" class="step">4 / 预填充与解码分离</text>
  <text x="710" y="340" text-anchor="middle" class="small">Dynamo 编排独立 GPU 池：约 1.6-2.5 倍</text>
  <text x="710" y="354" text-anchor="middle" class="small">NVLink 5 传输 KV 缓存</text>

  <rect x="520" y="370" width="380" height="60" class="box"/>
  <text x="710" y="392" text-anchor="middle" class="step">5 / NVLink 5 全互连通信</text>
  <text x="710" y="410" text-anchor="middle" class="small">MoE 专家通信延迟降至 Hopper 的三分之一</text>
  <text x="710" y="424" text-anchor="middle" class="small">MoE 密集模型获得额外倍增</text>

  <rect x="520" y="440" width="380" height="70" class="hot"/>
  <text x="710" y="462" text-anchor="middle" class="step">核心数值（2026）</text>
  <text x="710" y="480" text-anchor="middle" class="small">HGX B200：GPT-OSS-120B 为 $0.02/M 词元</text>
  <text x="710" y="496" text-anchor="middle" class="small">GB200 NVL72 + Dynamo：$0.012/M 词元</text>
  <text x="710" y="510" text-anchor="middle" class="small">H100 + vLLM：$0.09/M 词元</text>
</svg>
