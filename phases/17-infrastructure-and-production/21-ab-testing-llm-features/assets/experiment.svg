<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .eval { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .ab { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .method { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
    </style>
  </defs>
  <text x="480" y="24" text-anchor="middle" class="title">LLM 功能 A/B 测试：评测加在线实验，不凭感觉</text>

  <rect x="40" y="50" width="440" height="120" class="eval"/>
  <text x="260" y="72" text-anchor="middle" class="head">评测（evals，离线、标注集）</text>
  <text x="260" y="92" text-anchor="middle" class="step">“模型能完成任务吗？”</text>
  <text x="60" y="116" class="small">· 人工标注或 LLM 评判</text>
  <text x="60" y="134" class="small">· 固定分布，不是真实用户流量</text>
  <text x="60" y="152" class="small">· 暴露给用户前发现退化</text>

  <rect x="500" y="50" width="440" height="120" class="ab"/>
  <text x="720" y="72" text-anchor="middle" class="head">A/B 测试（在线、随机）</text>
  <text x="720" y="92" text-anchor="middle" class="step">“用户在意吗？”</text>
  <text x="520" y="116" class="small">· 真实流量，随机分配</text>
  <text x="520" y="134" class="small">· 重要的用户层面指标，如留存、CTR</text>
  <text x="520" y="152" class="small">· 确认产品影响</text>

  <rect x="40" y="190" width="280" height="120" class="method"/>
  <text x="180" y="212" text-anchor="middle" class="head">测试内容</text>
  <text x="60" y="236" class="step">· 提示词措辞</text>
  <text x="60" y="254" class="step">· 模型选择（GPT 与开源模型）</text>
  <text x="60" y="272" class="step">· 生成参数（temp、top-p）</text>
  <text x="60" y="290" class="step">· 奖励函数 / 路由器</text>

  <rect x="340" y="190" width="280" height="120" class="method"/>
  <text x="480" y="212" text-anchor="middle" class="head">方法严谨性</text>
  <text x="360" y="236" class="step">· CUPED（方差降低 30–70%）</text>
  <text x="360" y="254" class="step">· 序贯检验（中途查看始终有效）</text>
  <text x="360" y="272" class="small">· 校正：Bonferroni / Benjamini-Hochberg</text>
  <text x="360" y="290" class="step">· SRM 检查（样本比例）</text>

  <rect x="640" y="190" width="280" height="120" class="method"/>
  <text x="780" y="212" text-anchor="middle" class="head">平台</text>
  <text x="660" y="236" class="step">Statsig（OpenAI 旗下，$1.1B）</text>
  <text x="660" y="254" class="step">GrowthBook（MIT，数据仓库原生）</text>
  <text x="660" y="272" class="small">平台：Eppo、Optimizely Experiments</text>
  <text x="660" y="290" class="step">平台：LaunchDarkly Experiments</text>

  <rect x="40" y="330" width="880" height="140" class="box"/>
  <text x="480" y="352" text-anchor="middle" class="head">LLM 非确定性让统计功效更复杂</text>
  <text x="480" y="374" text-anchor="middle" class="step">相同输入在不同运行间的变化最高为 15%</text>
  <text x="480" y="394" text-anchor="middle" class="step">在传统功效计算基础上，将样本量乘以 1.3–1.5 作为余量</text>
  <text x="480" y="416" text-anchor="middle" class="caption">实际案例：聊天对话长度 +70% · Nextdoor CTR +1% · Khanmigo 迭代权衡延迟与准确率</text>
  <text x="480" y="438" text-anchor="middle" class="caption">评测发现退化，A/B 确认影响，不能再凭感觉发布</text>
</svg>
