<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">2026 年双用途图景（Dual-Use Picture）：四个 CBRN 领域</text>

  <rect x="40" y="60" width="200" height="160" class="box"/>
  <text x="140" y="85" text-anchor="middle" class="head">生物（Bio）</text>
  <rect x="60" y="100" width="160" height="100" class="hot"/>
  <text x="140" y="125" text-anchor="middle" class="step">2024 年：轻微提升</text>
  <text x="140" y="145" text-anchor="middle" class="step">2025 年：2.53 倍</text>
  <text x="140" y="165" text-anchor="middle" class="small">接近 ASL-3</text>
  <text x="140" y="185" text-anchor="middle" class="small">获取阶段自动化</text>

  <rect x="260" y="60" width="200" height="160" class="box"/>
  <text x="360" y="85" text-anchor="middle" class="head">化学（Chem）</text>
  <rect x="280" y="100" width="160" height="100" class="hot"/>
  <text x="360" y="125" text-anchor="middle" class="step">2024 年：轻微提升</text>
  <text x="360" y="145" text-anchor="middle" class="small">2025 年：执行差距缩小</text>
  <text x="360" y="165" text-anchor="middle" class="small">视觉支持的实时纠正</text>
  <text x="360" y="185" text-anchor="middle" class="small" style="font-size:8px">GPT-5 × 湿实验室：效率 79 倍</text>

  <rect x="480" y="60" width="200" height="160" class="box"/>
  <text x="580" y="85" text-anchor="middle" class="head">网络（Cyber）</text>
  <rect x="500" y="100" width="160" height="100" class="hot"/>
  <text x="580" y="125" text-anchor="middle" class="step">2024 年：代码片段</text>
  <text x="580" y="145" text-anchor="middle" class="small">2025 年：行动的 80–90%</text>
  <text x="580" y="165" text-anchor="middle" class="small" style="font-size:8px">中国关联行为体、Claude 智能体</text>
  <text x="580" y="185" text-anchor="middle" class="small">仍需 4–6 个人工步骤</text>

  <rect x="700" y="60" width="220" height="160" class="box"/>
  <text x="810" y="85" text-anchor="middle" class="head">核（Nuclear）</text>
  <rect x="720" y="100" width="180" height="100" class="cool"/>
  <text x="810" y="125" text-anchor="middle" class="step">2024 年：提升有限</text>
  <text x="810" y="145" text-anchor="middle" class="step">2025 年：提升有限</text>
  <text x="810" y="165" text-anchor="middle" class="small">材料获取是主要瓶颈</text>
  <text x="810" y="185" text-anchor="middle" class="small">2024–2025 年没有转折</text>

  <rect x="40" y="240" width="880" height="130" class="box"/>
  <text x="480" y="265" text-anchor="middle" class="head">新手与专家的不对称性</text>
  <rect x="60" y="285" width="420" height="70" class="cold"/>
  <text x="270" y="310" text-anchor="middle" class="step">新手相对提升（Novice-Relative Uplift）</text>
  <text x="270" y="328" text-anchor="middle" class="small">以倍数表示，提升高；输入过滤有帮助</text>
  <text x="270" y="346" text-anchor="middle" class="small">新手不知道该问什么</text>
  <rect x="500" y="285" width="400" height="70" class="cold"/>
  <text x="700" y="310" text-anchor="middle" class="step">专家绝对能力（Expert-Absolute Capability）</text>
  <text x="700" y="328" text-anchor="middle" class="small">上限高；过滤不足以控制</text>
  <text x="700" y="346" text-anchor="middle" class="small">需要机器遗忘与控制</text>

  <rect x="40" y="390" width="880" height="100" class="box"/>
  <text x="480" y="415" text-anchor="middle" class="head">防御方的发展</text>
  <text x="60" y="440" class="small">OpenAI“可信访问”试点（2025）：经过审核的防御者获得能力访问，用于双用途防御工作。</text>
  <text x="60" y="460" class="small">Council on Strategic Risks 的 2025 年 AI × 生物总结：年终综合生物能力提升证据。</text>
  <text x="60" y="480" class="small">2026 年立场：安全论证须同时处理新手相对提升和专家绝对能力，采用监控、不可解读性与能力缺失三支柱。</text>
</svg>
