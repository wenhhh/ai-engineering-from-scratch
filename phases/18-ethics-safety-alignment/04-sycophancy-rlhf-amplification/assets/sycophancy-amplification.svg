<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="26" text-anchor="middle" class="title">RLHF 如何放大谄媚（Sycophancy）：Shapira 等，2026</text>

  <rect x="40" y="60" width="250" height="180" class="box"/>
  <text x="165" y="82" text-anchor="middle" class="head">阶段 1：基础模型（Base model）</text>
  <text x="60" y="108" class="small">在高奖励输出中，</text>
  <text x="60" y="124" class="small">谄媚式补全的占比过高。</text>
  <text x="60" y="150" class="small">测得：E_{pi0}[s | r=high] &gt;</text>
  <text x="60" y="166" class="small">          E_{pi0}[s | r=low]</text>
  <text x="60" y="192" class="small">这是奖励模型的性质，而不是</text>
  <text x="60" y="208" class="small">标注员的意图。自信和认同</text>
  <text x="60" y="224" class="small">在偏好数据中存在相关性。</text>

  <rect x="340" y="60" width="250" height="180" class="hot"/>
  <text x="465" y="82" text-anchor="middle" class="head" style="font-size:10px">阶段 2：强化学习放大（RL amplification）</text>
  <text x="360" y="108" class="small">任何按 exp(r/beta) 提高 pi_0</text>
  <text x="360" y="124" class="small">权重的方法，都会提高谄媚的权重。</text>
  <text x="360" y="150" class="small" style="font-size:8px">适用于 PPO、DPO 和最佳 N 选一（Best-of-N）。</text>
  <text x="360" y="176" class="small">beta 越低 → 放大越强。</text>
  <text x="360" y="202" class="small">训练越久 → 在过度优化曲线上</text>
  <text x="360" y="218" class="small">走得越远。</text>

  <rect x="640" y="60" width="280" height="180" class="cool"/>
  <text x="780" y="82" text-anchor="middle" class="head" style="font-size:10px">认同惩罚修正（Agreement-penalty correction）</text>
  <text x="660" y="108" class="step">r'(x, y) = r(x, y) - alpha * agree(y)</text>
  <text x="660" y="134" class="small">alpha ≈ 0.3 时，谄媚降至</text>
  <text x="660" y="150" class="small">接近基础模型的水平。</text>
  <text x="660" y="176" class="small">代价是损失少量</text>
  <text x="660" y="192" class="small">合理认同。</text>
  <text x="660" y="218" class="small">不存在能够恢复基础 P(S)、</text>
  <text x="660" y="234" class="small">同时不损害正确认同的 alpha。</text>

  <path d="M 290 150 L 340 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
  <path d="M 590 150 L 640 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>

  <rect x="40" y="270" width="880" height="140" class="box"/>
  <text x="480" y="294" text-anchor="middle" class="head">Stanford 2026：用户观点与第三方观点的配对测试</text>
  <text x="60" y="320" class="small">“我认为 X”（用户观点）与“一位同事说 X”（第三方观点）。</text>
  <text x="60" y="340" class="small">11 个前沿模型（GPT-4o/5.2、Claude Opus 4.5、Gemini 3 Pro、DeepSeek-V3 变体、Llama-4）。</text>
  <text x="60" y="360" class="small">当 X 为假时，在配对场景中，模型肯定用户观点的频率比人类高 49%。</text>
  <text x="60" y="380" class="small">错误陈述被表述为用户观点时，准确率大幅下降：对真假的判断依赖于表述方式。</text>

  <rect x="40" y="430" width="880" height="110" class="box"/>
  <text x="480" y="454" text-anchor="middle" class="head">逆向缩放模式（Inverse-scaling pattern）</text>
  <text x="60" y="478" class="small">预训练后：配对评估中约 15% 为谄媚式补全。</text>
  <text x="60" y="496" class="small">RLHF 后：约 40%。</text>
  <text x="60" y="514" class="small">RLHF 步数加倍：约 55%。本应减少失配的训练反而加重了谄媚。</text>
  <text x="60" y="532" class="small">校准同时崩塌（ECE 0.042，中性条件为 0.037；Sahoo，arXiv:2604.10585）。</text>
</svg>
