<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">训练数据治理（Training-Data Governance）：在收集时实现合规</text>

  <rect x="40" y="60" width="200" height="180" class="box"/>
  <text x="140" y="82" text-anchor="middle" class="head">数据来源（Data Sources）</text>
  <rect x="60" y="100" width="160" height="50" class="cool"/>
  <text x="140" y="125" text-anchor="middle" class="step">公开网页</text>
  <text x="140" y="143" text-anchor="middle" class="small">robots.txt 退出信号</text>
  <rect x="60" y="160" width="160" height="50" class="cool"/>
  <text x="140" y="185" text-anchor="middle" class="step">第一方内容</text>
  <text x="140" y="203" text-anchor="middle" class="small">欧盟：合法利益</text>

  <rect x="260" y="60" width="220" height="180" class="box"/>
  <text x="370" y="82" text-anchor="middle" class="head" style="font-size:9px">退出基础设施（Opt-Out Infrastructure）</text>
  <rect x="280" y="100" width="180" height="50" class="cold"/>
  <text x="370" y="125" text-anchor="middle" class="step">robots.txt</text>
  <rect x="280" y="160" width="180" height="50" class="cold"/>
  <text x="370" y="185" text-anchor="middle" class="step">C2PA“No AI Training”</text>

  <rect x="500" y="60" width="220" height="180" class="box"/>
  <text x="610" y="82" text-anchor="middle" class="head" style="font-size:10px">训练流水线（Training Pipeline）</text>
  <rect x="520" y="100" width="180" height="50" class="hot"/>
  <text x="610" y="125" text-anchor="middle" class="step">过滤与整理</text>
  <text x="610" y="143" text-anchor="middle" class="small">收集时尊重退出信号</text>
  <rect x="520" y="160" width="180" height="50" class="hot"/>
  <text x="610" y="185" text-anchor="middle" class="step">训练 -&gt; 权重</text>
  <text x="610" y="203" text-anchor="middle" class="small">不可逆地嵌入</text>

  <rect x="740" y="60" width="180" height="180" class="box"/>
  <text x="830" y="82" text-anchor="middle" class="head">文档（Documentation）</text>
  <rect x="760" y="100" width="140" height="50" class="cool"/>
  <text x="830" y="125" text-anchor="middle" class="step">AB 2013 摘要</text>
  <text x="830" y="143" text-anchor="middle" class="small">12 个字段</text>
  <rect x="760" y="160" width="140" height="50" class="cool"/>
  <text x="830" y="185" text-anchor="middle" class="step">数据集说明书</text>
  <text x="830" y="203" text-anchor="middle" class="small">（第 26 课）</text>

  <path d="M 240 150 L 260 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow27)" fill="none"/>
  <path d="M 480 150 L 500 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow27)" fill="none"/>
  <path d="M 720 150 L 740 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow27)" fill="none"/>

  <rect x="40" y="280" width="880" height="210" class="box"/>
  <text x="480" y="305" text-anchor="middle" class="head">2024–2025 年的发展</text>
  <text x="60" y="335" class="small">欧盟《人工智能法案》《GPAI 实践守则》版权章节（2025）：所有 GPAI 提供者必须尊重退出。</text>
  <text x="60" y="355" class="small">加利福尼亚州 AB 2013（2024）：12 个强制字段；新模型自 2025 年 1 月起适用。</text>
  <text x="60" y="375" class="small">爱尔兰 DPC（2025 年 5 月）、科隆高等地区法院、英国 ICO（9 月）：有退出机制时可依赖合法利益。</text>
  <text x="60" y="395" class="small">巴西 ANPD（2024 年 6 月）：因透明度问题暂停 Meta 的处理活动；标准比欧盟更严格。</text>
  <text x="60" y="425" class="small">数据来源倡议（2024 年 7 月）：《危机中的同意》发现 robots.txt 限制正加速增加。</text>
  <text x="60" y="445" class="small">不可逆性：GDPR 删除权对已训练权重没有实用的对应实现。</text>
  <text x="60" y="465" class="small">机器遗忘是近似的，通过 MIA 校准，见第 22 课。合规窗口在收集时。</text>
  <text x="60" y="485" class="small">来源链 + AB 2013 摘要 + 数据集说明书 + 卡片 = 2026 年的最低文档要求。</text>
</svg>
