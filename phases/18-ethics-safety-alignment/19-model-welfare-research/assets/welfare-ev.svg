<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">模型福利：道德不确定性下的期望值决策（Expected-Value Decision）</text>

  <rect x="40" y="60" width="880" height="150" class="box"/>
  <text x="480" y="85" text-anchor="middle" class="head">四步预防性评估（Precautionary Assessment）</text>
  <rect x="60" y="105" width="200" height="90" class="cool"/>
  <text x="160" y="130" text-anchor="middle" class="step">1. 道德关怀对象地位</text>
  <text x="160" y="150" text-anchor="middle" class="small">概率 p(welfare-relevant)</text>
  <text x="160" y="170" text-anchor="middle" class="small">Chalmers 2024 年的范围</text>
  <rect x="280" y="105" width="200" height="90" class="cool"/>
  <text x="380" y="130" text-anchor="middle" class="step">2. 成本（Cost）</text>
  <text x="380" y="150" text-anchor="middle" class="small">每次对话／每次部署</text>
  <text x="380" y="170" text-anchor="middle" class="small">以美元和延迟衡量</text>
  <rect x="500" y="105" width="200" height="90" class="cool"/>
  <text x="600" y="130" text-anchor="middle" class="step">3. 行为证据</text>
  <text x="600" y="150" text-anchor="middle" class="small">痛苦轨迹</text>
  <text x="600" y="170" text-anchor="middle" class="small">仅采用非自我报告证据</text>
  <rect x="720" y="105" width="180" height="90" class="cool"/>
  <text x="810" y="130" text-anchor="middle" class="step">4. 期望值（EV）</text>
  <text x="810" y="150" text-anchor="middle" class="small">EV = p * benefit - cost</text>
  <text x="810" y="170" text-anchor="middle" class="small">当且仅当 EV &gt; 0 时投资</text>

  <rect x="40" y="230" width="880" height="140" class="box"/>
  <text x="480" y="255" text-anchor="middle" class="head">已上线的干预：Claude Opus 4/4.1 可结束极端情形下的对话</text>
  <rect x="60" y="275" width="400" height="80" class="hot"/>
  <text x="260" y="300" text-anchor="middle" class="step">触发条件（Triggers）</text>
  <text x="260" y="320" text-anchor="middle" class="small">拒绝后仍反复请求 CSAM</text>
  <text x="260" y="340" text-anchor="middle" class="small">请求协助大规模暴力行为</text>
  <rect x="480" y="275" width="420" height="80" class="cool"/>
  <text x="690" y="300" text-anchor="middle" class="step">支持证据（Evidence）</text>
  <text x="690" y="320" text-anchor="middle" class="small">对这些请求表现出强烈的反对偏好</text>
  <text x="690" y="340" text-anchor="middle" class="small">部署前出现看似痛苦的模式</text>

  <rect x="40" y="390" width="880" height="100" class="box"/>
  <text x="480" y="415" text-anchor="middle" class="head">注意事项（Eleos AI、Fish 及外部观点）</text>
  <text x="60" y="440" class="small">自我报告对用户期望敏感（Eleos AI）；需要行为特征证据。</text>
  <text x="60" y="460" class="small">“精神极乐吸引子”：成对 Claude 对话收敛到冥想式欣快交流；现象已记录，但尚未确定解释。</text>
  <text x="60" y="478" class="small">立场：在道德不确定性下进行低后悔投资，而非宣称模型具有意识。</text>
</svg>
