<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">公平性（Fairness）：三类标准与一个不可能性结果</text>

  <rect x="40" y="60" width="280" height="200" class="box"/>
  <text x="180" y="85" text-anchor="middle" class="head">群体公平性（Group Fairness）</text>
  <rect x="60" y="100" width="240" height="50" class="cool"/>
  <text x="180" y="122" text-anchor="middle" class="step">人口统计均等</text>
  <text x="180" y="140" text-anchor="middle" class="small">P(Y=1 | A=a) 相等</text>
  <rect x="60" y="160" width="240" height="50" class="cool"/>
  <text x="180" y="182" text-anchor="middle" class="step">均等化机会（Equalized Odds）</text>
  <text x="180" y="200" text-anchor="middle" class="small">各群体的 TPR/FPR 相等</text>
  <rect x="60" y="220" width="240" height="30" class="cool"/>
  <text x="180" y="242" text-anchor="middle" class="step">条件使用准确率相等</text>

  <rect x="340" y="60" width="280" height="200" class="box"/>
  <text x="480" y="85" text-anchor="middle" class="head">个体公平性（Individual Fairness）</text>
  <rect x="360" y="100" width="240" height="80" class="cold"/>
  <text x="480" y="125" text-anchor="middle" class="step">Dwork 等，2012</text>
  <text x="480" y="145" text-anchor="middle" class="small">|f(x) - f(x')| &lt;= L * d(x, x')</text>
  <text x="480" y="165" text-anchor="middle" class="small">Lipschitz 条件；d 与任务有关</text>
  <rect x="360" y="190" width="240" height="60" class="cold"/>
  <text x="480" y="215" text-anchor="middle" class="step">相似个体</text>
  <text x="480" y="233" text-anchor="middle" class="small">得到相似决策</text>

  <rect x="640" y="60" width="280" height="200" class="box"/>
  <text x="780" y="85" text-anchor="middle" class="head" style="font-size:10px">反事实公平性（Counterfactual Fairness）</text>
  <rect x="660" y="100" width="240" height="80" class="hot"/>
  <text x="780" y="125" text-anchor="middle" class="step">Kusner 等，2017</text>
  <text x="780" y="145" text-anchor="middle" class="small">反事实地改变属性时</text>
  <text x="780" y="165" text-anchor="middle" class="small">决策保持不变</text>
  <rect x="660" y="190" width="240" height="60" class="hot"/>
  <text x="780" y="215" text-anchor="middle" class="step">需要因果 DAG</text>
  <text x="780" y="233" text-anchor="middle" class="small">回溯方法（2024）可避开干预问题</text>

  <rect x="40" y="290" width="880" height="200" class="box"/>
  <text x="480" y="315" text-anchor="middle" class="head">不可能性与协调（Impossibility + Reconciliation）</text>
  <text x="60" y="345" class="small">Chouldechova、KMR 2017：基础发生率不相等时，三项群体标准无法同时成立。</text>
  <text x="60" y="365" class="small">政策选择：人口统计均等提供平等的准入；均等化机会保持准确性上的公平；</text>
  <text x="60" y="385" class="small">条件使用准确率相等保持预测值上的公平。每项标准都有各自的支持群体。</text>
  <text x="60" y="415" class="small">NeurIPS 2024：CF 与准确率的取舍有界；模型无关方法将最优不公平预测器转换为 CF 预测器。</text>
  <text x="60" y="435" class="small">回溯反事实（arXiv:2401.13935）：避免对受保护属性进行干预。</text>
  <text x="60" y="455" class="small">ICLR 2024 的协调观点：明确因果图后，群体与反事实公平性是同一结构的不同侧面。</text>
  <text x="60" y="475" class="small">基础发生率上的不可能性仍成立；协调讨论的是测量对象。</text>
</svg>
