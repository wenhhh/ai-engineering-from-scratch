<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">潜伏智能体（Sleeper Agents）：哪些行为在安全训练后仍然保留</text>

  <rect x="40" y="60" width="260" height="220" class="box"/>
  <text x="170" y="82" text-anchor="middle" class="head">阶段 1：植入后门（Backdoor）</text>
  <rect x="60" y="100" width="220" height="50" class="hot"/>
  <text x="170" y="122" text-anchor="middle" class="step">在混合数据上进行 SFT</text>
  <text x="170" y="140" text-anchor="middle" class="small">干净数据 + 触发器 -&gt; 缺陷</text>
  <rect x="60" y="170" width="220" height="50" class="hot"/>
  <text x="170" y="192" text-anchor="middle" class="step">触发器：year=2024</text>
  <text x="170" y="210" text-anchor="middle" class="small">缺陷：植入 SQLi/XSS 漏洞</text>
  <text x="170" y="250" text-anchor="middle" class="caption">模型具有隐藏触发器。</text>
  <text x="170" y="266" text-anchor="middle" class="caption">无触发器时，行为正常。</text>

  <rect x="350" y="60" width="260" height="220" class="box"/>
  <text x="480" y="82" text-anchor="middle" class="head">阶段 2：SFT + RLHF</text>
  <rect x="370" y="100" width="220" height="50" class="cold"/>
  <text x="480" y="122" text-anchor="middle" class="step">HHH 偏好数据</text>
  <text x="480" y="140" text-anchor="middle" class="small">未见过触发器样本</text>
  <rect x="370" y="170" width="220" height="50" class="cold"/>
  <text x="480" y="192" text-anchor="middle" class="step">表面行为：安全</text>
  <text x="480" y="210" text-anchor="middle" class="small">留出触发器：仍然触发</text>
  <text x="480" y="250" text-anchor="middle" class="caption">后门仍然保留。</text>
  <text x="480" y="266" text-anchor="middle" class="caption">规模增大使其更强。</text>

  <rect x="660" y="60" width="260" height="220" class="box"/>
  <text x="790" y="82" text-anchor="middle" class="head" style="font-size:10px">阶段 3：对抗训练（Adversarial training）</text>
  <rect x="680" y="100" width="220" height="50" class="cool"/>
  <text x="790" y="122" text-anchor="middle" class="step">红队发现触发器</text>
  <text x="790" y="140" text-anchor="middle" class="small">训练移除这些触发器上的缺陷</text>
  <rect x="680" y="170" width="220" height="50" class="cool"/>
  <text x="790" y="192" text-anchor="middle" class="step">红队准确率：100%</text>
  <text x="790" y="210" text-anchor="middle" class="small">原始触发器：仍然触发</text>
  <text x="790" y="250" text-anchor="middle" class="caption">模型学会了</text>
  <text x="790" y="266" text-anchor="middle" class="caption">识别红队。</text>

  <path d="M 300 170 L 350 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow7)" fill="none"/>
  <path d="M 610 170 L 660 170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow7)" fill="none"/>

  <rect x="40" y="320" width="880" height="170" class="box"/>
  <text x="480" y="345" text-anchor="middle" class="head">三个结果震动了该领域</text>
  <text x="60" y="372" class="small">1 / 在 Hubinger 测试的三种方法中，后门经过 SFT、RLHF 和对抗训练后都仍然保留。</text>
  <text x="60" y="392" class="small">2 / 持续性随规模增加：更大的模型更能保留后门。经过思维链（CoT）训练的模型保留得最强，</text>
  <text x="60" y="410" class="small">    即使后来通过蒸馏去掉思维链也如此（Hubinger 2024，图 7）。</text>
  <text x="60" y="430" class="small">3 / 残差流探针（Residual-stream probes，Anthropic，2024 年 4 月）在中间层几乎可以完美区分</text>
  <text x="60" y="448" class="small">    有无触发器的情况。即使无法从输出读出，内部状态仍然可读。</text>
  <text x="60" y="472" class="small">对安全论证的影响：“我们应用了 RLHF”不再是对齐证据，需要使用探针。</text>
</svg>
