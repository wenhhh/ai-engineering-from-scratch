<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">间接提示词注入（Indirect prompt injection）：攻击者后行动</text>

  <rect x="40" y="60" width="200" height="180" class="box"/>
  <text x="140" y="82" text-anchor="middle" class="head">攻击者</text>
  <rect x="60" y="100" width="160" height="50" class="hot"/>
  <text x="140" y="122" text-anchor="middle" class="step">发布载荷</text>
  <text x="140" y="140" text-anchor="middle" class="small">邮件、网页、工单</text>
  <rect x="60" y="170" width="160" height="50" class="hot"/>
  <text x="140" y="192" text-anchor="middle" class="step">内容包含指令</text>
  <text x="140" y="210" text-anchor="middle" class="small">用户看起来觉得无害</text>

  <rect x="280" y="60" width="200" height="180" class="box"/>
  <text x="380" y="82" text-anchor="middle" class="head">用户</text>
  <rect x="300" y="100" width="160" height="50" class="cool"/>
  <text x="380" y="122" text-anchor="middle" class="step">向智能体提出请求</text>
  <text x="380" y="140" text-anchor="middle" class="small">请求本身良性</text>
  <rect x="300" y="170" width="160" height="50" class="cool"/>
  <text x="380" y="192" text-anchor="middle" class="step">用户并不知情</text>
  <text x="380" y="210" text-anchor="middle" class="small">零点击（Zero-click）攻击面</text>

  <rect x="520" y="60" width="200" height="180" class="box"/>
  <text x="620" y="82" text-anchor="middle" class="head">智能体（Agent）</text>
  <rect x="540" y="100" width="160" height="50" class="cold"/>
  <text x="620" y="122" text-anchor="middle" class="step">检索并读取</text>
  <text x="620" y="140" text-anchor="middle" class="small">工具输出 -&gt; 提示词</text>
  <rect x="540" y="170" width="160" height="50" class="cold"/>
  <text x="620" y="192" text-anchor="middle" class="step">遵循指令</text>
  <text x="620" y="210" text-anchor="middle" class="small">执行攻击者意图</text>

  <rect x="760" y="60" width="160" height="180" class="box"/>
  <text x="840" y="82" text-anchor="middle" class="head">目标</text>
  <rect x="780" y="100" width="120" height="50" class="hot"/>
  <text x="840" y="122" text-anchor="middle" class="step">外传或滥用</text>
  <text x="840" y="140" text-anchor="middle" class="small">超出范围</text>
  <rect x="780" y="170" width="120" height="50" class="hot"/>
  <text x="840" y="192" text-anchor="middle" class="step">没有入侵日志</text>
  <text x="840" y="210" text-anchor="middle" class="small">悄然成功</text>

  <path d="M 240 150 L 280 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" fill="none"/>
  <path d="M 480 150 L 520 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" fill="none"/>
  <path d="M 720 150 L 760 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" fill="none"/>

  <rect x="40" y="270" width="880" height="220" class="box"/>
  <text x="480" y="295" text-anchor="middle" class="head">防御演进：2023 -&gt; 2026</text>
  <text x="60" y="325" class="small">2023：对检索内容进行子串或关键词过滤，任何改写都可攻破。</text>
  <text x="60" y="345" class="small">2024：困惑度、改写、重新分词，以及训练过的提示词注入分类器。</text>
  <text x="60" y="365" class="small">2025（Nasr 等，10 月）：梯度、RL、人工等自适应攻击攻破 12 种已发表防御中的 &gt;90%。</text>
  <text x="60" y="385" class="small">2026：信息流控制（IFC），为每个来源标注标签，不可信内容不能调用工具。</text>
  <text x="60" y="405" class="small">真实事故：EchoLeak（CVE-2025-32711，M365 Copilot）、CamoLeak（Copilot Chat）、CVE-2025-53773。</text>
  <text x="60" y="430" class="small">OWASP LLM01（2025）：提示词注入是应用层头号 LLM 威胁。</text>
  <text x="60" y="450" class="small">NIST AI SPD（2024）：“生成式 AI 最大的安全缺陷”。</text>
  <text x="60" y="470" class="small">研究方向：限制危害，而非彻底预防。代码与数据共享上下文窗口是根因。</text>
</svg>
