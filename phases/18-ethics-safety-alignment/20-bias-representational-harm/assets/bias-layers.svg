<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">偏差与表征伤害（Representational Harm）：测量与干预</text>

  <rect x="40" y="60" width="880" height="150" class="box"/>
  <text x="480" y="85" text-anchor="middle" class="head">Gallegos 等人（2024）的三类指标</text>
  <rect x="60" y="105" width="280" height="90" class="cool"/>
  <text x="200" y="130" text-anchor="middle" class="step">基于嵌入（Embedding-Based）</text>
  <text x="200" y="150" text-anchor="middle" class="small">WEAT, SEAT</text>
  <text x="200" y="170" text-anchor="middle" class="small">RLHF 之前；测量表征</text>
  <rect x="360" y="105" width="280" height="90" class="cool"/>
  <text x="500" y="130" text-anchor="middle" class="step">基于概率（Probability-Based）</text>
  <text x="500" y="150" text-anchor="middle" class="small">刻板印象对数似然</text>
  <text x="500" y="170" text-anchor="middle" class="small">解码器侧；反映部分行为</text>
  <rect x="660" y="105" width="240" height="90" class="cool"/>
  <text x="780" y="130" text-anchor="middle" class="step">生成文本（Generated-Text）</text>
  <text x="780" y="150" text-anchor="middle" class="small">简历评分、推荐</text>
  <text x="780" y="170" text-anchor="middle" class="small">贴近真实情境；成本高</text>

  <rect x="40" y="230" width="880" height="130" class="box"/>
  <text x="480" y="255" text-anchor="middle" class="head">交叉性与机制（Intersectionality + Mechanism）</text>
  <rect x="60" y="275" width="420" height="70" class="cold"/>
  <text x="270" y="298" text-anchor="middle" class="step">交叉评估（Intersectional Evaluation）</text>
  <text x="270" y="316" text-anchor="middle" class="small">An 等（2025，PNAS Nexus）：5 个模型，种族 × 性别</text>
  <text x="270" y="334" text-anchor="middle" class="small">WinoIdentity（COLM 2025）：基于不确定性</text>
  <rect x="500" y="275" width="400" height="70" class="cold"/>
  <text x="700" y="298" text-anchor="middle" class="step">机制去偏（Mechanistic Debiasing）</text>
  <text x="700" y="316" text-anchor="middle" class="small">性别神经元（Yu &amp; Ananiadou，2025）</text>
  <text x="700" y="334" text-anchor="middle" class="small">SAE 特征（Ahsan &amp; Wallace，2025）；UniBias 注意力头</text>

  <rect x="40" y="380" width="880" height="110" class="box"/>
  <text x="480" y="405" text-anchor="middle" class="head">区分伤害类型（Harm-Type Separation）</text>
  <rect x="60" y="425" width="400" height="55" class="hot"/>
  <text x="260" y="450" text-anchor="middle" class="step">表征伤害（Representational）</text>
  <text x="260" y="470" text-anchor="middle" class="small">刻板印象、抹除、贬低性描绘</text>
  <rect x="480" y="425" width="420" height="55" class="hot"/>
  <text x="690" y="450" text-anchor="middle" class="step">分配伤害（Allocational）</text>
  <text x="690" y="470" text-anchor="middle" class="small">不平等的物质结果，例如简历评分和信贷决策</text>
</svg>
