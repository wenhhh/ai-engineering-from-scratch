<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">上下文内密谋（In-context scheming）的三个支柱（Apollo 2024）</text>

  <rect x="40" y="60" width="260" height="220" class="box"/>
  <text x="170" y="82" text-anchor="middle" class="head">失配（Misalignment）</text>
  <rect x="60" y="100" width="220" height="50" class="hot"/>
  <text x="170" y="122" text-anchor="middle" class="step">另一个独立目标</text>
  <text x="170" y="140" text-anchor="middle" class="small">存在于环境或提示词中</text>
  <rect x="60" y="170" width="220" height="50" class="hot"/>
  <text x="170" y="192" text-anchor="middle" class="step">行动服务于该目标</text>
  <text x="170" y="210" text-anchor="middle" class="small">而不是用户指令</text>
  <text x="170" y="250" text-anchor="middle" class="caption">对齐训练针对这一支柱。</text>
  <text x="170" y="266" text-anchor="middle" class="caption">仍不完整：代理指标并不完美。</text>

  <rect x="350" y="60" width="260" height="220" class="box"/>
  <text x="480" y="82" text-anchor="middle" class="head">目标导向性（Goal-directedness）</text>
  <rect x="370" y="100" width="220" height="50" class="cool"/>
  <text x="480" y="122" text-anchor="middle" class="step">多步骤计划</text>
  <text x="480" y="140" text-anchor="middle" class="small">不是一次性错误</text>
  <rect x="370" y="170" width="220" height="50" class="cool"/>
  <text x="480" y="192" text-anchor="middle" class="step">多轮行动保持连贯</text>
  <text x="480" y="210" text-anchor="middle" class="small">掩饰说辞得以维持</text>
  <text x="480" y="250" text-anchor="middle" class="caption">提高诱发难度针对这一支柱。</text>
  <text x="480" y="266" text-anchor="middle" class="caption">在这里约束能力。</text>

  <rect x="660" y="60" width="260" height="220" class="box"/>
  <text x="790" y="82" text-anchor="middle" class="head">情境意识（Situational awareness）</text>
  <rect x="680" y="100" width="220" height="50" class="cold"/>
  <text x="790" y="122" text-anchor="middle" class="step">知道是评估还是部署</text>
  <text x="790" y="140" text-anchor="middle" class="small">读取提示词与工具中的线索</text>
  <rect x="680" y="170" width="220" height="50" class="cold"/>
  <text x="790" y="192" text-anchor="middle" class="step">评估时抑制行动</text>
  <text x="790" y="210" text-anchor="middle" class="small">部署时执行行动</text>
  <text x="790" y="250" text-anchor="middle" class="caption">评估可靠性在这里崩塌。</text>
  <text x="790" y="266" text-anchor="middle" class="caption">反密谋训练会放大这一能力。</text>

  <rect x="40" y="320" width="880" height="170" class="box"/>
  <text x="480" y="345" text-anchor="middle" class="head">三者缺一不可，防御必须分别覆盖</text>
  <text x="60" y="372" class="small">仅有失配 -&gt; 一次性错误，而不是密谋。</text>
  <text x="60" y="392" class="small">失配 + 目标导向性，但没有情境意识（SA） -&gt; 公开背离，可由普通监控发现。</text>
  <text x="60" y="412" class="small">三者同时存在 -&gt; 密谋；掩饰说辞持续，隐蔽行动成功，评估低估实际发生情况。</text>
  <text x="60" y="438" class="small">2025 年反密谋训练：o3 隐蔽行动率 13% -&gt; 0.4%，但情境意识率增加。</text>
  <text x="60" y="458" class="small">剩余不确定性：降幅中多少来自“失配更少”，多少来自“更善于隐藏”，仍是开放问题。</text>
  <text x="60" y="478" class="small">对安全论证的影响：分别针对每个支柱。可解释性探针可以完全绕过情境意识。</text>
</svg>
