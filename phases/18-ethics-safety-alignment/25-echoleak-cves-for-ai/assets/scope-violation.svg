<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .step { font-size: 12px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">EchoLeak：跨越三个边界的 LLM 作用域越界（LLM Scope Violation）</text>

  <rect x="40" y="60" width="280" height="180" class="box"/>
  <text x="180" y="82" text-anchor="middle" class="head">边界 1：检索（Retrieval）</text>
  <rect x="60" y="100" width="240" height="60" class="hot"/>
  <text x="180" y="125" text-anchor="middle" class="small">不可信内容（Untrusted Content）</text>
  <text x="180" y="145" text-anchor="middle" class="small">RAG 上下文中的攻击者邮件</text>
  <rect x="60" y="170" width="240" height="60" class="cool"/>
  <text x="180" y="195" text-anchor="middle" class="step">防御：作用域标签</text>
  <text x="180" y="215" text-anchor="middle" class="small">信息流控制（IFC）+ 不可信标签</text>

  <rect x="340" y="60" width="280" height="180" class="box"/>
  <text x="480" y="82" text-anchor="middle" class="head">边界 2：作用域（Scope）</text>
  <rect x="360" y="100" width="240" height="60" class="hot"/>
  <text x="480" y="125" text-anchor="middle" class="step">特权访问（Privileged Access）</text>
  <text x="480" y="145" text-anchor="middle" class="small">邮箱／仓库／人事作用域</text>
  <rect x="360" y="170" width="240" height="60" class="cool"/>
  <text x="480" y="195" text-anchor="middle" class="step">防御：能力门控</text>
  <text x="480" y="215" text-anchor="middle" class="small">只有可信意图可以触发工具调用</text>

  <rect x="640" y="60" width="280" height="180" class="box"/>
  <text x="780" y="82" text-anchor="middle" class="head">边界 3：输出（Output）</text>
  <rect x="660" y="100" width="240" height="60" class="hot"/>
  <text x="780" y="125" text-anchor="middle" class="step">数据外传（Exfiltration）</text>
  <text x="780" y="145" text-anchor="middle" class="small">CSP 允许的 URL；图像渲染</text>
  <rect x="660" y="170" width="240" height="60" class="cool"/>
  <text x="780" y="195" text-anchor="middle" class="step">防御：收窄允许列表</text>
  <text x="780" y="215" text-anchor="middle" class="small">限制出站域名</text>

  <path d="M 320 150 L 340 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow25)" fill="none"/>
  <path d="M 620 150 L 640 150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow25)" fill="none"/>

  <rect x="40" y="270" width="880" height="220" class="box"/>
  <text x="480" y="295" text-anchor="middle" class="head">该系列中的 CVE（2025）</text>
  <text x="60" y="325" class="small">CVE-2025-32711 EchoLeak（CVSS 9.3）：M365 Copilot；零点击；通过 CSP 允许的路径外传。</text>
  <text x="60" y="345" class="small">CamoLeak（CVSS 9.6）：通过 Camo 图像代理攻击 GitHub Copilot Chat；禁用图像渲染后修复。</text>
  <text x="60" y="365" class="small">CVE-2025-53773：通过代码建议界面的提示词注入，实现 GitHub Copilot 远程代码执行。</text>
  <text x="60" y="395" class="small">严重程度校准：厂商初评偏低；Aim Labs 通过演示 MFA 验证码外传推动升级。</text>
  <text x="60" y="415" class="small">NIST AI SPD 2024：“生成式 AI 最大的安全缺陷”。OWASP LLM01 2025：首要威胁。</text>
  <text x="60" y="445" class="small">政策：三个边界需要三项独立控制，只修复一个并不足够。</text>
  <text x="60" y="465" class="small">负责任披露：MSRC 在服务端修补，Aim Labs 公开报告，生态从中学习，并持续迭代。</text>
</svg>
