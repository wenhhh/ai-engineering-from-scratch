<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">MCP 资源、提示词与订阅</title>
  <desc id="desc">无状态客户端读取资源与提示词，然后打开带过滤器的订阅响应流。</desc>
  <rect width="960" height="440" fill="#0b1020"/>
  <text x="48" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">MCP 2026-07-28 中的可寻址上下文（Addressable context）</text>
  <rect x="48" y="90" width="220" height="112" rx="12" fill="#18233d" stroke="#60a5fa" stroke-width="2"/>
  <text x="72" y="124" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="18" font-weight="700">资源（Resources）</text>
  <text x="72" y="154" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">URI 寻址内容</text>
  <text x="72" y="178" fill="#94a3b8" font-family="monospace" font-size="10">resources/list, resources/read</text>
  <rect x="370" y="90" width="220" height="112" rx="12" fill="#18233d" stroke="#a78bfa" stroke-width="2"/>
  <text x="394" y="124" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="18" font-weight="700">提示词（Prompts）</text>
  <text x="394" y="154" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">用户选择的模板</text>
  <text x="394" y="178" fill="#94a3b8" font-family="monospace" font-size="10">prompts/list, prompts/get</text>
  <rect x="692" y="90" width="220" height="112" rx="12" fill="#18233d" stroke="#34d399" stroke-width="2"/>
  <text x="716" y="124" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">工具（Tools）</text>
  <text x="716" y="154" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">模型选择的操作</text>
  <text x="716" y="178" fill="#94a3b8" font-family="monospace" font-size="10">tools/list, tools/call</text>
  <rect x="150" y="260" width="660" height="132" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
  <text x="178" y="298" fill="#fde68a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">subscriptions/listen POST 响应流</text>
  <text x="178" y="330" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">1. 客户端发送显式通知过滤器</text>
  <text x="178" y="354" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">2. 服务器在首个事件前确认</text>
  <text x="178" y="378" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">3. 每个事件携带 io.modelcontextprotocol/subscriptionId</text>
  <path d="M158 202 V244 H480 V260" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M480 202 V260" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="480" y="422" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">server/discover 公布资源 + 提示词；每次请求携带版本 + 能力</text>
</svg>
