<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .green { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .blue { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .orange { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .mono { font-size: 10.5px; font-family: Menlo, monospace; fill: #222; }
      .small { font-size: 10.5px; fill: #333; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .edge { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title">MCP 授权：签发者绑定登记与资源绑定令牌</text>

  <rect x="30" y="58" width="230" height="445" rx="8" class="green"/>
  <text x="145" y="84" text-anchor="middle" class="head">MCP 客户端</text>
  <text x="48" y="116" class="mono">issuer credentials[issuer]</text>
  <text x="48" y="138" class="mono">tokens[issuer, resource]</text>
  <text x="48" y="176" class="small">1. 读取受保护资源元数据</text>
  <text x="48" y="194" class="small">以及签发者元数据</text>
  <text x="48" y="228" class="small">2. 优先使用 CIMD HTTPS URL</text>
  <text x="48" y="246" class="small">DCR 仅用于兼容</text>
  <text x="48" y="280" class="small">3. PKCE S256 + resource</text>
  <text x="48" y="298" class="small">用于授权与令牌请求</text>
  <text x="48" y="332" class="small">4. 使用授权码之前</text>
  <text x="48" y="350" class="small">精确验证响应 iss</text>
  <text x="48" y="388" class="mono">每个请求 POST /mcp</text>
  <text x="48" y="408" class="small">Bearer + 版本 + 方法</text>
  <text x="48" y="426" class="small">+ 名称 + params._meta</text>
  <text x="48" y="462" class="mono">不使用 Mcp-Session-Id</text>

  <rect x="365" y="58" width="230" height="445" rx="8" class="blue"/>
  <text x="480" y="84" text-anchor="middle" class="head">授权服务器</text>
  <text x="383" y="116" class="mono">issuer：精确 URI</text>
  <text x="383" y="154" class="small">CIMD：获取客户端元数据</text>
  <text x="383" y="174" class="small">client_id 等于文档 URL</text>
  <text x="383" y="208" class="small">DCR 回退验证</text>
  <text x="383" y="228" class="small">application_type + 重定向</text>
  <text x="383" y="266" class="small">授权：同意 + PKCE</text>
  <text x="383" y="286" class="small">响应：code + iss</text>
  <text x="383" y="324" class="small">令牌：签发者 + 受众</text>
  <text x="383" y="344" class="small">+ 主体 + 作用域 + 到期时间</text>
  <text x="383" y="382" class="small">CIMD URL 可迁移使用；</text>
  <text x="383" y="402" class="small">签发者生成的凭据不可以</text>

  <rect x="700" y="58" width="230" height="445" rx="8" class="orange"/>
  <text x="815" y="84" text-anchor="middle" class="head">MCP 资源服务器</text>
  <text x="718" y="116" class="mono">RFC 9728 元数据</text>
  <text x="718" y="136" class="small">well-known 路径保留 /mcp</text>
  <text x="718" y="174" class="mono">验证每个请求</text>
  <text x="718" y="194" class="small">签发者、受众、到期时间</text>
  <text x="718" y="212" class="small">作用域、请求头、params._meta</text>
  <text x="718" y="250" class="small">401 令牌或受众无效</text>
  <text x="718" y="288" class="small">403 insufficient_scope</text>
  <text x="718" y="308" class="small">作用域质询对当前</text>
  <text x="718" y="326" class="small">操作具有权威性</text>
  <text x="718" y="364" class="small">同意后的重试使用</text>
  <text x="718" y="384" class="small">新的 MCP 请求 id</text>
  <text x="718" y="422" class="mono">resultType: complete</text>

  <path d="M260,185 L365,185" class="edge" marker-end="url(#arrow)"/>
  <text x="312" y="174" text-anchor="middle" class="mono">CIMD</text>
  <path d="M365,310 L260,310" class="edge" marker-end="url(#arrow)"/>
  <text x="312" y="299" text-anchor="middle" class="mono">code + iss</text>
  <path d="M260,360 L365,360" class="edge" marker-end="url(#arrow)"/>
  <text x="312" y="349" text-anchor="middle" class="mono">verifier</text>
  <path d="M595,250 L700,250" class="edge" marker-end="url(#arrow)"/>
  <text x="648" y="239" text-anchor="middle" class="mono">token aud</text>
  <path d="M260,440 L700,440" class="edge" marker-end="url(#arrow)"/>
  <text x="480" y="429" text-anchor="middle" class="mono">已授权的无状态工具调用</text>

  <text x="480" y="542" text-anchor="middle" class="caption">协议元数据协商行为。OAuth 凭据授权主体。保持边界分离。</text>
</svg>
