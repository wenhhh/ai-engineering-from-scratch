<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .stage { font-size: 11px; fill: #c0392b; font-style: italic; text-anchor: middle; }
      .note { font-size: 10px; fill: #666; font-style: italic; }
      .line { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect class="box" x="20" y="30" width="200" height="300" rx="4"/>
  <text class="label" x="120" y="55" text-anchor="middle">基于规则（Rule-Based）</text>
  <text class="note" x="35" y="78">1960 年代至今：安全关键场景</text>
  <text class="content" x="35" y="105">如果匹配 "i want"</text>
  <text class="content" x="35" y="125">则返回 "why do you want"</text>
  <text class="content" style="font-size:9px" x="35" y="165">意图分类器（Intent Classifier）</text>
  <text class="content" x="35" y="183">+ 槽位填充（Slot Filling）</text>
  <text class="content" x="35" y="201">+ 状态机（State Machine）</text>
  <text class="note" x="35" y="235">优点：可预测、</text>
  <text class="note" x="35" y="250">确定性、</text>
  <text class="note" x="35" y="265">无幻觉</text>
  <text class="note" x="35" y="290">缺点：范围狭窄</text>
  <text class="note" x="35" y="305">无法处理新型输入</text>

  <rect class="box" x="240" y="30" width="200" height="300" rx="4"/>
  <text class="label" style="font-size:11px" x="340" y="55" text-anchor="middle">基于检索（Retrieval-Based）</text>
  <text class="note" x="255" y="78">2010 年代；至今用于 FAQ</text>
  <text class="content" x="255" y="105">编码话语，</text>
  <text class="content" x="255" y="123">找到最近匹配，</text>
  <text class="content" x="255" y="141">返回存储的响应</text>
  <text class="content" x="255" y="180">设置拒答阈值</text>
  <text class="note" x="255" y="220">优点：能处理改述、</text>
  <text class="note" x="255" y="235">无幻觉、</text>
  <text class="note" x="255" y="250">低成本扩展</text>
  <text class="note" x="255" y="280">缺点：不能组合信息，</text>
  <text class="note" x="255" y="295">无法进行多轮</text>
  <text class="note" x="255" y="310">推理</text>

  <rect class="box" x="460" y="30" width="200" height="300" rx="4"/>
  <text class="label" x="560" y="55" text-anchor="middle">神经网络（seq2seq）</text>
  <text class="note" x="475" y="78">2014–2019；如今很少单独使用</text>
  <text class="content" x="475" y="105">在对话日志上训练</text>
  <text class="content" x="475" y="123">编码器—解码器</text>
  <text class="content" x="475" y="141">从零生成</text>
  <text class="note" x="475" y="180">优点：措辞流畅</text>
  <text class="note" x="475" y="220">缺点：泛化回应</text>
  <text class="note" x="475" y="235">（“我不知道”）、</text>
  <text class="note" x="475" y="250">偏离事实、无依据关联、</text>
  <text class="note" x="475" y="265">不使用工具</text>
  <text class="note" x="475" y="290">如今用于混合系统，</text>
  <text class="note" x="475" y="305">不单独使用</text>

  <rect class="hot" x="680" y="30" width="200" height="300" rx="4"/>
  <text class="label" x="780" y="55" text-anchor="middle">LLM 智能体循环</text>
  <text class="note" x="695" y="78">2023 → 2026 年生产环境</text>
  <text class="content" x="695" y="105">规划 → 调用工具</text>
  <text class="content" x="695" y="123">   → 观察 → 决策</text>
  <text class="content" x="695" y="141">   → ... → 回答</text>
  <text class="content" x="695" y="175">RAG 依据关联（Grounding）</text>
  <text class="content" x="695" y="195">工具契约（Tool Contracts）</text>
  <text class="content" x="695" y="215">评估 + 可观测性</text>
  <text class="note" x="695" y="245">优点：采取行动、</text>
  <text class="note" x="695" y="260">处理新情况</text>
  <text class="note" x="695" y="290">缺点：更难分析其行为、</text>
  <text class="note" x="695" y="305">提示注入、</text>
  <text class="note" x="695" y="320">无限循环</text>
</svg>
