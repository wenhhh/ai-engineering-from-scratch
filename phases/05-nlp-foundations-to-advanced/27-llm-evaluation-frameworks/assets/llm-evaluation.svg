<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .metric { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .judge { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .content { font-size: 12px; fill: #333; }
      .mono { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">RAG 评估：四个维度，LLM 裁判后端</text>

  <!-- Inputs: question, context, answer -->
  <rect x="40" y="55" width="250" height="30" class="box"/>
  <text x="165" y="75" text-anchor="middle" class="content">问题：“iPhone 何时发布？”</text>

  <rect x="40" y="95" width="250" height="55" class="box"/>
  <text x="165" y="114" text-anchor="middle" class="content">检索到的上下文：</text>
  <text x="165" y="132" text-anchor="middle" class="mono">“Apple 于 2007 年 6 月 29 日</text>
  <text x="165" y="145" text-anchor="middle" class="mono">发布第一代 iPhone。”</text>

  <rect x="40" y="160" width="250" height="30" class="box"/>
  <text x="165" y="180" text-anchor="middle" class="content">答案：“2007 年 6 月 29 日。”</text>

  <line x1="290" y1="125" x2="330" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Judge -->
  <rect x="330" y="80" width="220" height="130" class="judge"/>
  <text x="440" y="105" text-anchor="middle" class="label">LLM 裁判（Judge）</text>
  <text x="440" y="128" text-anchor="middle" class="caption">(GPT-4o-mini, Haiku, Mistral-small)</text>
  <text x="440" y="155" text-anchor="middle" class="mono">score(q, ctx, ans) → 0..1</text>
  <text x="440" y="180" text-anchor="middle" class="caption">评分标准 + 思维链</text>
  <text x="440" y="198" text-anchor="middle" class="caption">与人工评分校准</text>

  <line x1="550" y1="125" x2="590" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Metrics panel -->
  <rect x="590" y="55" width="270" height="250" class="box"/>
  <text x="725" y="80" text-anchor="middle" class="label">四项 RAG 指标</text>

  <rect x="605" y="95" width="240" height="45" class="metric"/>
  <text x="615" y="115" class="label">忠实性（Faithfulness）</text>
  <text x="615" y="132" class="caption">答案主张被上下文蕴含吗？</text>

  <rect x="605" y="145" width="240" height="45" class="metric"/>
  <text x="615" y="165" class="label" style="font-size:11px">答案相关性（Answer Relevance）</text>
  <text x="615" y="182" class="caption">答案回应问题了吗？</text>

  <rect x="605" y="195" width="240" height="45" class="metric"/>
  <text x="615" y="215" class="label" style="font-size:11px">上下文精确率（Context Precision）</text>
  <text x="615" y="232" class="caption">检索块中相关块的比例</text>

  <rect x="605" y="245" width="240" height="45" class="metric"/>
  <text x="615" y="265" class="label" style="font-size:11px">上下文召回率（Context Recall）</text>
  <text x="615" y="282" class="caption">检索集合覆盖标准答案吗？</text>

  <!-- Bottom -->
  <rect x="40" y="335" width="820" height="95" class="box"/>
  <text x="55" y="358" class="label">成本 / 校准 / CI</text>
  <text x="55" y="378" class="content">GPT-4o-mini 每用例 $0.001–$0.003，每次 1000 样本回归评估 &lt;$5</text>
  <text x="55" y="396" class="content">要求：对照 50 个人工标注用例，Spearman ρ &gt; 0.7，才可信任分数</text>
  <text x="55" y="414" class="content">检查：pytest + DeepEval 阈值；固定裁判模型与版本；展示最低 10%</text>
</svg>
