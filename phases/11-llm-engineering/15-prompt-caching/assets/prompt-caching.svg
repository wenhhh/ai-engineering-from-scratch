<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .write { fill: #ffe0cc; stroke: #c0392b; stroke-width: 1.5; }
      .read { fill: #e0f2e0; stroke: #2d7a2d; stroke-width: 1.5; }
      .miss { fill: #eee; stroke: #666; stroke-width: 1.2; }
      .label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .sub { font-size: 12px; fill: #333; }
      .mono { font-size: 11px; fill: #333; font-family: 'Menlo', monospace; }
      .tag { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .line { stroke: #1a1a1a; stroke-width: 1.3; fill: none; }
      .dash { stroke: #666; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">提示词缓存（Prompt Caching）：写入一次，读取多次</text>

  <!-- Request 1 -->
  <text x="60" y="80" class="label">请求 1（Request 1）</text>
  <rect x="60" y="95" width="500" height="40" class="write"/>
  <text x="310" y="120" text-anchor="middle" class="sub">[系统 + 工具 + 少样本示例] 15,000 词元（缓存写入 / Cache Write）</text>
  <rect x="560" y="95" width="140" height="40" class="box"/>
  <text x="630" y="120" text-anchor="middle" class="sub">[用户消息] 400 词元</text>
  <text x="710" y="108" class="mono"><tspan x="710">计费：</tspan><tspan x="710" dy="15">15,000 * 1.25x</tspan><tspan x="710" dy="15"> + 400 * 1x</tspan></text>

  <!-- Request 2 -->
  <text x="60" y="170" class="label">请求 2（Request 2）</text>
  <rect x="60" y="185" width="500" height="40" class="read"/>
  <text x="310" y="210" text-anchor="middle" class="sub">[相同前缀] 15,000 词元（缓存读取 / Cache Read）</text>
  <rect x="560" y="185" width="140" height="40" class="box"/>
  <text x="630" y="210" text-anchor="middle" class="sub">[用户消息] 400 词元</text>
  <text x="710" y="198" class="mono"><tspan x="710">计费：</tspan><tspan x="710" dy="15">15,000 * 0.1x</tspan><tspan x="710" dy="15"> + 400 * 1x</tspan></text>

  <!-- Request N -->
  <text x="60" y="260" class="label">请求 N（Request N）</text>
  <rect x="60" y="275" width="500" height="40" class="read"/>
  <text x="310" y="300" text-anchor="middle" class="sub">[相同前缀] 15,000 词元（缓存读取 / Cache Read）</text>
  <rect x="560" y="275" width="140" height="40" class="box"/>
  <text x="630" y="300" text-anchor="middle" class="sub">[用户消息] 400 词元</text>
  <text x="710" y="288" class="mono"><tspan x="710">计费：</tspan><tspan x="710" dy="15">15,000 * 0.1x</tspan><tspan x="710" dy="15"> + 400 * 1x</tspan></text>

  <!-- BAD example -->
  <path d="M60 340 L840 340" class="dash"/>
  <text x="60" y="370" class="label">反模式（Anti-pattern）：时间戳位于顶部</text>
  <rect x="60" y="385" width="140" height="40" class="miss"/>
  <text x="130" y="410" text-anchor="middle" class="mono">"15:30:02"</text>
  <rect x="200" y="385" width="360" height="40" class="miss"/>
  <text x="380" y="410" text-anchor="middle" class="sub">[前缀其余部分] 仍有 15,000 词元</text>
  <rect x="560" y="385" width="140" height="40" class="box"/>
  <text x="630" y="410" text-anchor="middle" class="sub">[用户消息]</text>
  <text x="710" y="402" class="mono"><tspan x="710">每个请求都未命中：</tspan><tspan x="710" dy="16">没有共享前缀</tspan></text>

  <text x="450" y="460" text-anchor="middle" class="tag">
    盈亏平衡：Anthropic 在第 2 次读取后回本；1 小时 TTL 的写入溢价翻倍，复用时间延长为 12 倍。
  </text>
</svg>
