<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 10px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">语音流水线（Voice Pipeline）：首次音频输出 p50 目标 &lt; 800ms</text>

  <rect x="40" y="50" width="880" height="90" class="box"/>
  <text x="480" y="70" text-anchor="middle" class="head">流式阶段（Streaming Stages），全部流水线化</text>
  <rect x="60" y="84" width="150" height="48" class="cool"/>
  <text x="135" y="104" text-anchor="middle" class="step">音频输入（WebRTC）</text>
  <text x="135" y="122" text-anchor="middle" class="small">20ms PCM 帧</text>
  <rect x="220" y="84" width="150" height="48" class="cool"/>
  <text x="295" y="104" text-anchor="middle" class="step">流式语音识别（ASR）</text>
  <text x="295" y="122" text-anchor="middle" class="small">Deepgram Nova-3</text>
  <rect x="380" y="84" width="150" height="48" class="hot"/>
  <text x="455" y="104" text-anchor="middle" class="step">VAD + 轮次检测</text>
  <text x="455" y="122" text-anchor="middle" class="small">Silero v5 + LK 检测器</text>
  <rect x="540" y="84" width="150" height="48" class="cold"/>
  <text x="615" y="104" text-anchor="middle" class="step">流式大语言模型（LLM）</text>
  <text x="615" y="122" text-anchor="middle" class="small">GPT-4o-realtime</text>
  <rect x="700" y="84" width="150" height="48" class="dsk"/>
  <text x="775" y="104" text-anchor="middle" class="step">流式语音合成（TTS）</text>
  <text x="775" y="122" text-anchor="middle" class="small">Cartesia Sonic-2</text>

  <rect x="40" y="160" width="880" height="180" class="box"/>
  <text x="480" y="180" text-anchor="middle" class="head">延迟预算（Latency Budget），总计 800ms</text>
  <rect x="60" y="200" width="830" height="40" class="cool"/>
  <text x="80" y="220" class="step">ASR 部分转写 + VAD 静音检测：约 320ms</text>
  <text x="80" y="236" class="small">Silero 每 20ms 帧运行一次；静音 &gt;= 500ms 时，轮次检测器读取部分转写</text>
  <rect x="60" y="246" width="830" height="40" class="hot"/>
  <text x="80" y="266" class="step">轮次完成判定：40ms</text>
  <text x="80" y="282" class="small">根据部分转写计算完成得分，阈值 0.6；否则继续监听</text>
  <rect x="60" y="292" width="830" height="40" class="cold"/>
  <text x="80" y="312" class="step">LLM 首词元时间（Time-to-First-Token）：140ms</text>
  <text x="80" y="328" class="small">流式补全；支持 1M 上下文；缓存短系统提示词</text>
  <rect x="60" y="338" width="830" height="40" class="dsk"/>

  <rect x="40" y="360" width="440" height="180" class="box"/>
  <text x="260" y="382" text-anchor="middle" class="head">插话仲裁（Barge-in Arbitration）</text>
  <rect x="60" y="394" width="400" height="36" class="hot"/>
  <text x="260" y="416" text-anchor="middle" class="step">TTS 期间 VAD 检测到语音开始 -&gt; 取消</text>
  <text x="260" y="440" text-anchor="middle" class="small">丢弃剩余 LLM 输出，清空 TTS 缓冲区</text>
  <text x="260" y="456" text-anchor="middle" class="small">为新轮次重新启用 ASR</text>
  <text x="260" y="480" text-anchor="middle" class="small">发布 tts_canceled 跨度（OpenTelemetry）</text>
  <text x="260" y="504" text-anchor="middle" class="small">误截断率（False-cutoff Rate）目标 &lt; 3%</text>
  <text x="260" y="524" text-anchor="middle" class="caption">使用 Hamming VAD 基准衡量</text>

  <rect x="500" y="360" width="420" height="180" class="box"/>
  <text x="710" y="382" text-anchor="middle" class="head">工具旁路通道（Tool Side Channel）</text>
  <rect x="520" y="394" width="380" height="36" class="cold"/>
  <text x="710" y="416" text-anchor="middle" class="step">对话中调用（天气、日历）</text>
  <text x="710" y="440" text-anchor="middle" class="small">与 LLM 流并发运行</text>
  <text x="710" y="456" text-anchor="middle" class="small">若 &gt; 300ms，输出填充语“稍等，我查一下”</text>
  <text x="710" y="480" text-anchor="middle" class="small">工具返回后恢复 LLM，将结果拼入提示词</text>
  <text x="710" y="504" text-anchor="middle" class="small">FastMCP 传输，逐工具超时</text>
  <text x="710" y="524" text-anchor="middle" class="caption">绝不阻塞音频流</text>
</svg>
