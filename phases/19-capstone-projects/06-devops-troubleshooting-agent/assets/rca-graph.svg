<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 10px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
      .alert { stroke: #c0392b; stroke-width: 2; fill: none; stroke-dasharray: 4,2; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">K8s 根因图（Root-Cause Graph）+ 人在回路（HITL）修复关卡</text>

  <rect x="40" y="50" width="560" height="370" class="box"/>
  <text x="320" y="72" text-anchor="middle" class="head">知识图谱遍历（Knowledge Graph Walk）</text>

  <rect x="260" y="100" width="140" height="34" class="hot"/>
  <text x="330" y="122" text-anchor="middle" class="step" style="font-size:9px">部署（Deployment；告警）</text>
  <rect x="260" y="90" width="140" height="54" class="alert" fill="none"/>

  <rect x="100" y="170" width="130" height="34" class="cool"/>
  <text x="165" y="192" text-anchor="middle" class="step">Prom 序列（Series）</text>
  <rect x="260" y="170" width="140" height="34" class="cool"/>
  <text x="330" y="192" text-anchor="middle" class="step">副本集（ReplicaSet）</text>
  <rect x="430" y="170" width="130" height="34" class="cool"/>
  <text x="495" y="192" text-anchor="middle" class="step">Loki 流（Stream）</text>

  <path d="M330,134 L165,170" class="edge"/>
  <path d="M330,134 L330,170" class="edge"/>
  <path d="M330,134 L495,170" class="edge"/>

  <rect x="130" y="240" width="100" height="30" class="cold"/>
  <text x="180" y="260" text-anchor="middle" class="step">容器组（Pod 1）</text>
  <rect x="260" y="240" width="100" height="30" class="cold"/>
  <text x="310" y="260" text-anchor="middle" class="step">容器组（Pod 2）</text>
  <rect x="390" y="240" width="100" height="30" class="cold"/>
  <text x="440" y="260" text-anchor="middle" class="step">容器组（Pod 3）</text>

  <path d="M330,204 L180,240" class="edge"/>
  <path d="M330,204 L310,240" class="edge"/>
  <path d="M330,204 L440,240" class="edge"/>

  <rect x="230" y="310" width="200" height="34" class="dsk"/>
  <text x="330" y="332" text-anchor="middle" class="step">节点（Node）ip-10-2-3-4</text>

  <path d="M180,270 L330,310" class="edge"/>
  <path d="M310,270 L330,310" class="edge"/>
  <path d="M440,270 L330,310" class="edge"/>

  <text x="60" y="385" class="small">遍历边（Walk Edges）：OWNS、SCHEDULED_ON、OBSERVED_BY、EXPOSES</text>
  <text x="60" y="402" class="small">采集 15 分钟窗口内的遥测（Telemetry）；对假设排序</text>

  <rect x="620" y="50" width="300" height="180" class="box"/>
  <text x="770" y="72" text-anchor="middle" class="head">假设排名（Ranked Hypotheses）</text>
  <rect x="640" y="90" width="260" height="36" class="hot"/>
  <text x="770" y="110" text-anchor="middle" class="step">#1 错误发布（Bad Rollout）v2.41</text>
  <text x="770" y="124" text-anchor="middle" class="small">评分 0.74（近期 + 有引用）</text>
  <rect x="640" y="132" width="260" height="36" class="cold"/>
  <text x="770" y="152" text-anchor="middle" class="step">#2 节点压力（Node Pressure）</text>
  <text x="770" y="166" text-anchor="middle" class="small">评分（Score）0.21</text>
  <rect x="640" y="174" width="260" height="36" class="cool"/>
  <text x="770" y="194" text-anchor="middle" class="step">#3 DNS 抖动（Flap）</text>
  <text x="770" y="208" text-anchor="middle" class="small">评分（Score）0.09</text>

  <rect x="620" y="248" width="300" height="262" class="box"/>
  <text x="770" y="268" text-anchor="middle" class="head">修复关卡（Remediation Gate）</text>
  <rect x="640" y="284" width="260" height="38" class="dsk"/>
  <text x="770" y="304" text-anchor="middle" class="step">Slack 审批卡片（Approval Card）</text>
  <text x="770" y="322" text-anchor="middle" class="small">[回滚] [升级处理] [忽略]</text>

  <rect x="640" y="330" width="260" height="38" class="hot"/>
  <text x="770" y="350" text-anchor="middle" class="step">破坏性 MCP 服务器（Destructive Server）</text>
  <text x="770" y="368" text-anchor="middle" class="small">独立令牌（Token），独立 RBAC</text>

  <rect x="640" y="376" width="260" height="38" class="cool"/>
  <text x="770" y="396" text-anchor="middle" class="step">审计日志（Audit Log；仅追加）</text>
  <text x="770" y="414" text-anchor="middle" class="small">考虑情况 + 执行情况 + 批准人</text>

  <text x="770" y="440" text-anchor="middle" class="small">只读工具（Read-Only Tools）：</text>
  <text x="770" y="456" text-anchor="middle" class="small">kubectl get/describe, promql,</text>
  <text x="770" y="472" text-anchor="middle" class="small">logql、traceql：无需审批</text>
  <text x="770" y="498" text-anchor="middle" class="caption">20 场景评估目标：根因分析（RCA）80%</text>
</svg>
