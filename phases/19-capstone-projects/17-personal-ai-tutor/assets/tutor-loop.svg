<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 9px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 11px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">个人 AI 导师（Personal AI Tutor）：多模态输入 + 学习者模型 + 安全</text>

  <rect x="40" y="50" width="220" height="160" class="cool"/>
  <text x="150" y="72" text-anchor="middle" class="head">多模态输入（Multimodal Input）</text>
  <rect x="60" y="90" width="180" height="30" class="cool"/>
  <text x="150" y="110" text-anchor="middle" class="step">文本（Text；网页聊天）</text>
  <rect x="60" y="126" width="180" height="30" class="cool"/>
  <text x="150" y="146" text-anchor="middle" class="step">语音（Voice；LiveKit + Whisper）</text>
  <rect x="60" y="162" width="180" height="30" class="cool"/>
  <text x="150" y="182" text-anchor="middle" class="step">数学题拍照（Photo Math；dots.ocr）</text>

  <rect x="300" y="50" width="320" height="160" class="dsk"/>
  <text x="460" y="72" text-anchor="middle" class="head">导师策略（Tutor Policy；LangGraph）</text>
  <rect x="320" y="90" width="280" height="28" class="cool"/>
  <text x="460" y="110" text-anchor="middle" class="step">读取信号（Read Signal）：正确 / 部分 / 卡住</text>
  <rect x="320" y="124" width="280" height="28" class="cool"/>
  <text x="460" y="144" text-anchor="middle" class="step">选择下一概念（Select Concept；图遍历）</text>
  <rect x="320" y="158" width="280" height="28" class="cool"/>
  <text x="460" y="178" text-anchor="middle" class="step">支架（Scaffold）/ 提示 / 鼓励</text>

  <rect x="660" y="50" width="260" height="160" class="cold"/>
  <text x="790" y="72" text-anchor="middle" class="head">学习者模型（Learner Model）</text>
  <text x="790" y="94" text-anchor="middle" class="small">贝叶斯知识追踪（BKT）</text>
  <text x="790" y="112" text-anchor="middle" class="small">逐概念掌握程度（Mastery）</text>
  <text x="790" y="130" text-anchor="middle" class="small">间隔重复（Spaced Repetition；FSRS）</text>
  <text x="790" y="148" text-anchor="middle" class="small">每次交互后更新</text>
  <text x="790" y="166" text-anchor="middle" class="small">每周进度报告（Progress Report）</text>
  <text x="790" y="186" text-anchor="middle" class="small">家长仪表盘（Parental Dashboard）</text>

  <rect x="40" y="240" width="420" height="270" class="box"/>
  <text x="250" y="262" text-anchor="middle" class="head">课程图谱（Curriculum Graph）</text>
  <text x="250" y="282" text-anchor="middle" class="small">Neo4j 保存 50–150 个概念</text>
  <text x="250" y="300" text-anchor="middle" class="small">先修关系边（Prerequisite Edges）</text>
  <text x="250" y="318" text-anchor="middle" class="small">附开放教育资源（OER）内容</text>
  <rect x="60" y="336" width="380" height="40" class="cool"/>
  <text x="250" y="356" text-anchor="middle" class="step">K-12 代数（Algebra）或 Python 入门</text>
  <text x="250" y="370" text-anchor="middle" class="small">选择其一深入</text>
  <text x="250" y="396" text-anchor="middle" class="small">遍历算法（Walk Algorithm）：</text>
  <text x="250" y="414" text-anchor="middle" class="small">  选择掌握程度最低的概念</text>
  <text x="250" y="432" text-anchor="middle" class="small">  且其先修概念已掌握</text>
  <text x="250" y="454" text-anchor="middle" class="small">OER 来源：</text>
  <text x="250" y="472" text-anchor="middle" class="small">OpenStax, Open Textbook,</text>
  <text x="250" y="490" text-anchor="middle" class="small">Khan Academy lite</text>

  <rect x="500" y="240" width="420" height="270" class="box"/>
  <text x="710" y="262" text-anchor="middle" class="head">安全与记忆（Safety + Memory）</text>
  <rect x="520" y="280" width="380" height="30" class="hot"/>
  <text x="710" y="300" text-anchor="middle" class="step">Llama Guard 4 + 适龄过滤器（Age Filter）</text>
  <rect x="520" y="316" width="380" height="30" class="hot"/>
  <text x="710" y="336" text-anchor="middle" class="step">考虑 COPPA 的保留策略（Retention；1 年）</text>
  <rect x="520" y="352" width="380" height="30" class="dsk"/>
  <text x="710" y="372" text-anchor="middle" class="step">记忆：情景（Episodic）+ 语义（Semantic）</text>
  <text x="710" y="396" text-anchor="middle" class="small">家长可操作删除</text>
  <text x="710" y="414" text-anchor="middle" class="small">逐学习者隔离（Learner-Scoped Isolation）</text>

  <text x="710" y="442" text-anchor="middle" class="small">效果研究（Efficacy Study；两周、10 名学习者）：</text>
  <text x="710" y="460" text-anchor="middle" class="small">前测（Pre-Test）+ 6 次交互 + 后测（Post-Test）</text>
  <text x="710" y="478" text-anchor="middle" class="small">自适应组（Adaptive Cohort）对比线性基线</text>
  <text x="710" y="498" text-anchor="middle" class="caption">Khanmigo / Duolingo Max / LearnLM 形态</text>
</svg>
