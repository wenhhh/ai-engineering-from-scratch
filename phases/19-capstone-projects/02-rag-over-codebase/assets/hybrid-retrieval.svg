<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 10px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">代码 RAG：AST 分块 + 重排序的混合检索（Hybrid Retrieval）</text>

  <rect x="40" y="50" width="230" height="460" class="box"/>
  <text x="155" y="72" text-anchor="middle" class="head">摄取（Ingest）</text>
  <rect x="60" y="90" width="190" height="44" class="cool"/>
  <text x="155" y="108" text-anchor="middle" class="step">git push 网络钩子（Webhook）</text>
  <text x="155" y="124" text-anchor="middle" class="small">计算变化文件的差异</text>
  <rect x="60" y="148" width="190" height="44" class="cool"/>
  <text x="155" y="166" text-anchor="middle" class="step">tree-sitter 解析</text>
  <text x="155" y="182" text-anchor="middle" class="small">17 种语言语法</text>
  <rect x="60" y="206" width="190" height="44" class="cool"/>
  <text x="155" y="224" text-anchor="middle" class="step">函数 / 类分块（Chunk）</text>
  <text x="155" y="240" text-anchor="middle" class="small">AST 节点边界</text>
  <rect x="60" y="264" width="190" height="44" class="dsk"/>
  <text x="155" y="282" text-anchor="middle" class="step">大语言模型摘要（LLM Summary）</text>
  <text x="155" y="298" text-anchor="middle" class="small">Haiku 4.5 提示词缓存</text>
  <rect x="60" y="322" width="190" height="44" class="cold"/>
  <text x="155" y="340" text-anchor="middle" class="step">符号图边（Symbol Graph Edges）</text>
  <text x="155" y="356" text-anchor="middle" class="small">导入 / 调用（kuzu）</text>
  <rect x="60" y="380" width="190" height="100" class="box"/>
  <text x="155" y="402" text-anchor="middle" class="small">增量（Incremental）：</text>
  <text x="155" y="420" text-anchor="middle" class="small">只重新嵌入变化的</text>
  <text x="155" y="438" text-anchor="middle" class="small">代码块；推送至可搜索</text>
  <text x="155" y="456" text-anchor="middle" class="small">2M 行仓库群上 &lt; 60s</text>

  <rect x="300" y="50" width="310" height="230" class="box"/>
  <text x="455" y="72" text-anchor="middle" class="head">索引（Indexes）</text>
  <rect x="320" y="90" width="130" height="80" class="cool"/>
  <text x="385" y="110" text-anchor="middle" class="step">稠密（Dense）</text>
  <text x="385" y="128" text-anchor="middle" class="small">Voyage-code-3</text>
  <text x="385" y="144" text-anchor="middle" class="small">Qdrant 1.12 混合</text>
  <text x="385" y="160" text-anchor="middle" class="small">载荷：repo+span</text>

  <rect x="460" y="90" width="130" height="80" class="hot"/>
  <text x="525" y="110" text-anchor="middle" class="step">BM25</text>
  <text x="525" y="128" text-anchor="middle" class="small">Tantivy (Rust)</text>
  <text x="525" y="144" text-anchor="middle" class="small">字段加权</text>
  <text x="525" y="160" text-anchor="middle" class="small">符号 x4 / 主体 x1</text>

  <rect x="320" y="182" width="270" height="90" class="cold"/>
  <text x="455" y="200" text-anchor="middle" class="step">符号图（Symbol Graph，kuzu）</text>
  <text x="455" y="218" text-anchor="middle" class="small">导入边、调用边、继承</text>
  <text x="455" y="236" text-anchor="middle" class="small">查询时用于跨仓库扩展</text>
  <text x="455" y="254" text-anchor="middle" class="small">“仓库 A 的符号 X 被仓库 B 使用”</text>

  <rect x="300" y="296" width="310" height="214" class="box"/>
  <text x="455" y="318" text-anchor="middle" class="head">查询（Query，LangGraph）</text>
  <rect x="320" y="336" width="270" height="36" class="cool"/>
  <text x="455" y="358" text-anchor="middle" class="step">检索：稠密 || BM25 前 10 项</text>
  <rect x="320" y="378" width="270" height="36" class="hot"/>
  <text x="455" y="400" text-anchor="middle" class="step">融合：倒数排名融合（RRF）</text>
  <rect x="320" y="420" width="270" height="36" class="dsk"/>
  <text x="455" y="442" text-anchor="middle" class="step">重排序：交叉编码器前 5 项</text>
  <rect x="320" y="462" width="270" height="36" class="cold"/>
  <text x="455" y="484" text-anchor="middle" class="step">生成：Claude Sonnet 4.7 1M</text>

  <rect x="640" y="50" width="280" height="460" class="box"/>
  <text x="780" y="72" text-anchor="middle" class="head">回答准入检查（Answer Gate）</text>
  <rect x="660" y="90" width="240" height="44" class="cool"/>
  <text x="780" y="108" text-anchor="middle" class="step">引用解析（Citation Parse）</text>
  <text x="780" y="124" text-anchor="middle" class="small">(repo/path:start-end) 锚点</text>
  <rect x="660" y="148" width="240" height="44" class="hot"/>
  <text x="780" y="166" text-anchor="middle" class="step">拒绝无引用论断</text>
  <text x="780" y="182" text-anchor="middle" class="small">重新提问或删除</text>
  <rect x="660" y="206" width="240" height="44" class="cold"/>
  <text x="780" y="224" text-anchor="middle" class="step">提示词缓存（Prompt Cache）</text>
  <text x="780" y="240" text-anchor="middle" class="small">系统提示词 + 重排上下文</text>

  <rect x="660" y="264" width="240" height="240" class="box"/>
  <text x="780" y="286" text-anchor="middle" class="head">评估（Evaluation）</text>
  <text x="780" y="306" text-anchor="middle" class="small">100 个标注跨仓库问题</text>
  <text x="780" y="324" text-anchor="middle" class="small">MRR@10, nDCG@10</text>
  <text x="780" y="342" text-anchor="middle" class="small">引用忠实度（Citation Faithfulness）</text>
  <text x="780" y="360" text-anchor="middle" class="small">p50 &lt; 1.5s, p99 &lt; 4s</text>
  <text x="780" y="378" text-anchor="middle" class="small">10k QPS 下的索引规模</text>
  <text x="780" y="400" text-anchor="middle" class="small">增量推送至可搜索 &lt; 60s</text>
  <text x="780" y="428" text-anchor="middle" class="small">每周重跑漂移检查</text>
  <text x="780" y="446" text-anchor="middle" class="small">MRR 下降 &gt; 5% 时告警</text>
  <text x="780" y="476" text-anchor="middle" class="caption">目标：2M 行代码，10 个仓库</text>
</svg>
