<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 10px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">投机解码（Speculative Decoding）：草稿提出，目标验证</text>

  <rect x="40" y="60" width="300" height="260" class="box"/>
  <text x="190" y="82" text-anchor="middle" class="head">草稿模型（Draft Model；低成本）</text>
  <rect x="60" y="100" width="260" height="36" class="cool"/>
  <text x="190" y="122" text-anchor="middle" class="step">EAGLE-3 头（Head）</text>
  <rect x="60" y="142" width="260" height="36" class="cool"/>
  <text x="190" y="164" text-anchor="middle" class="step">P-EAGLE 并行树（Parallel Tree）</text>
  <rect x="60" y="184" width="260" height="36" class="cool"/>
  <text x="190" y="206" text-anchor="middle" class="step">ngram 备用（Fallback）</text>
  <text x="190" y="244" text-anchor="middle" class="small">每步提出 k 个词元（Token）</text>
  <text x="190" y="262" text-anchor="middle" class="small">使用目标隐藏状态（Hidden State）训练</text>
  <text x="190" y="280" text-anchor="middle" class="small">通过 SpecForge / Speculators</text>
  <text x="190" y="300" text-anchor="middle" class="caption">对齐（Alignment）= 接受率调节手段</text>

  <rect x="380" y="60" width="540" height="260" class="box"/>
  <text x="650" y="82" text-anchor="middle" class="head">目标模型（Target Model；高成本）</text>
  <rect x="400" y="100" width="260" height="44" class="dsk"/>
  <text x="530" y="120" text-anchor="middle" class="step">批量验证（Batched Verify Pass）</text>
  <text x="530" y="138" text-anchor="middle" class="small">一次前向计算（Forward）通过 k 个位置</text>
  <rect x="680" y="100" width="220" height="44" class="dsk"/>
  <text x="790" y="120" text-anchor="middle" class="step">接受前缀（Accept Prefix）</text>
  <text x="790" y="138" text-anchor="middle" class="small">直到首次拒绝（Rejection）</text>
  <rect x="400" y="152" width="500" height="44" class="hot"/>
  <text x="650" y="172" text-anchor="middle" class="step">从目标重新采样（Resample）被拒绝位置</text>
  <text x="650" y="190" text-anchor="middle" class="small">提交已接受词元 + 1 个新词元 -&gt; 流式输出</text>

  <rect x="400" y="208" width="500" height="100" class="cool"/>
  <text x="650" y="228" text-anchor="middle" class="step">目标量化（Target Quantization）</text>
  <text x="650" y="248" text-anchor="middle" class="small">FP8 Marlin 或 INT4 AWQ</text>
  <text x="650" y="266" text-anchor="middle" class="small">Llama 3.3 70B, Qwen3-Coder-30B MoE, GPT-OSS-120B</text>
  <text x="650" y="284" text-anchor="middle" class="small">每个 H100/H200 分片（Shard）一个副本</text>
  <text x="650" y="300" text-anchor="middle" class="caption">vLLM 0.7 / SGLang 0.4</text>

  <rect x="40" y="340" width="440" height="170" class="box"/>
  <text x="260" y="362" text-anchor="middle" class="head">必报指标（Metrics That Must Be Reported）</text>
  <text x="60" y="384" class="small">吞吐量（Throughput）bs=1 / bs=8 / bs=32，启用与禁用投机</text>
  <text x="60" y="402" class="small">每种批量大小的 p50、p99 延迟（Latency）</text>
  <text x="60" y="420" class="small">逐分布接受率（Acceptance Rate）：</text>
  <text x="60" y="438" class="small">  ShareGPT、HumanEval、领域数据</text>
  <text x="60" y="456" class="small">草稿／目标对齐漂移（Drift）告警</text>
  <text x="60" y="476" class="small">持续吞吐下每百万输出词元美元成本</text>
  <text x="60" y="498" class="small">相同评估下对比 Anthropic / OpenAI API</text>

  <rect x="500" y="340" width="420" height="170" class="box"/>
  <text x="710" y="362" text-anchor="middle" class="head">运维（Operations）</text>
  <text x="520" y="384" class="small">Kubernetes 部署（Deployment）</text>
  <text x="520" y="402" class="small">NVIDIA 设备插件（Device Plugin）</text>
  <text x="520" y="420" class="small">HPA 指标：queue_wait_ms（非 CPU）</text>
  <text x="520" y="438" class="small">滚动升级（Rolling Upgrade）：先排空队列</text>
  <text x="520" y="456" class="small">EAGLE 接受率下降时启用 ngram 备用</text>
  <text x="520" y="476" class="small">Prometheus 导出器（Exporter）+ Langfuse 轨迹</text>
  <text x="520" y="498" class="small">目标：质量匹配时吞吐量 2.5 倍以上</text>
</svg>
