<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 10px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">迁移流水线（Migration Pipeline）：确定性配方 + 智能体备用处理</text>

  <rect x="40" y="60" width="220" height="100" class="cool"/>
  <text x="150" y="86" text-anchor="middle" class="step">确定性处理（Deterministic Pass）</text>
  <text x="150" y="106" text-anchor="middle" class="small">OpenRewrite (Java)</text>
  <text x="150" y="122" text-anchor="middle" class="small">libcst (Python)</text>
  <text x="150" y="142" text-anchor="middle" class="small">覆盖 70–80% 重写（Rewrites）</text>

  <rect x="300" y="60" width="220" height="100" class="cold"/>
  <text x="410" y="86" text-anchor="middle" class="step">Daytona 沙箱（Sandbox）</text>
  <text x="410" y="106" text-anchor="middle" class="small">预装目标运行时（Target Runtime）</text>
  <text x="410" y="122" text-anchor="middle" class="small">限定分支范围，输入只读（Read-Only）</text>
  <text x="410" y="142" text-anchor="middle" class="small">逐分支构建（Per-Branch Build）</text>

  <rect x="560" y="60" width="360" height="100" class="dsk"/>
  <text x="740" y="86" text-anchor="middle" class="step">智能体循环（Agent Loop）</text>
  <text x="740" y="106" text-anchor="middle" class="small">Claude Opus 4.7 + GPT-5.4-Codex</text>
  <text x="740" y="122" text-anchor="middle" class="small">分类失败 -&gt; 应用补丁 -&gt; 重跑</text>
  <text x="740" y="142" text-anchor="middle" class="small">预算（Budget）：30 分钟 / $8 / 20 轮</text>

  <path d="M260,110 L300,110" class="edge"/>
  <path d="M520,110 L560,110" class="edge"/>

  <rect x="40" y="200" width="440" height="310" class="box"/>
  <text x="260" y="222" text-anchor="middle" class="head">失败分类体系（Failure Taxonomy；50 个仓库）</text>

  <rect x="60" y="244" width="400" height="28" class="hot"/>
  <text x="80" y="263" class="small">dep_upgrade_required         30%</text>
  <rect x="60" y="276" width="400" height="28" class="hot"/>
  <text x="80" y="295" class="small">build_tool_drift             20%</text>
  <rect x="60" y="308" width="400" height="28" class="hot"/>
  <text x="80" y="327" class="small">custom_annotation            18%</text>
  <rect x="60" y="340" width="400" height="28" class="cool"/>
  <text x="80" y="359" class="small">syntax_edge_case             17%</text>
  <rect x="60" y="372" width="400" height="28" class="cool"/>
  <text x="80" y="391" class="small">test_flake                   15%</text>

  <rect x="60" y="410" width="400" height="90" class="box"/>
  <text x="260" y="432" text-anchor="middle" class="head">分类体系的用途（What the Taxonomy Unlocks）</text>
  <text x="260" y="452" text-anchor="middle" class="small">前三类成为下一批配方（Recipe）的目标</text>
  <text x="260" y="470" text-anchor="middle" class="small">智能体不再反复学习机械模式（Mechanical Patterns）</text>
  <text x="260" y="488" text-anchor="middle" class="small">逐类别通过率（Pass Rate）驱动 Moderne 风格策略</text>

  <rect x="510" y="200" width="410" height="310" class="box"/>
  <text x="715" y="222" text-anchor="middle" class="head">指标（Metrics；成功集合）</text>
  <rect x="530" y="244" width="380" height="32" class="cool"/>
  <text x="720" y="265" text-anchor="middle" class="step">MigrationBench pass@1：目标 60–70%</text>

  <rect x="530" y="284" width="380" height="32" class="cool"/>
  <text x="720" y="305" text-anchor="middle" class="step">每仓库平均成本：50 仓库规模下为 $2–4</text>

  <rect x="530" y="324" width="380" height="32" class="cool"/>
  <text x="720" y="345" text-anchor="middle" class="step">覆盖率变化（Coverage Delta）：基础值 +/- 1% 以内</text>

  <rect x="530" y="364" width="380" height="32" class="cool"/>
  <text x="720" y="385" text-anchor="middle" class="step">首次通过耗时（Time-to-Green）p50：&lt; 10 分钟</text>

  <rect x="530" y="404" width="380" height="96" class="dsk"/>
  <text x="720" y="426" text-anchor="middle" class="head">对比基线（Compare-to-Baseline）</text>
  <text x="720" y="446" text-anchor="middle" class="small">仅确定性处理：通过率 35–45%</text>
  <text x="720" y="464" text-anchor="middle" class="small">差额来自智能体层（Agent Layer）</text>
  <text x="720" y="486" text-anchor="middle" class="caption">按失败类别发布并排对比</text>
</svg>
