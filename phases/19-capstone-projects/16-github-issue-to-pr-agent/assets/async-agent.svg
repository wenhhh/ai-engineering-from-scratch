<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .box { fill: #faf6ef; stroke: #1a1a1a; stroke-width: 1.5; }
      .hot { fill: #fff1d6; stroke: #c0392b; stroke-width: 1.5; }
      .cool { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 1.5; }
      .cold { fill: #dfe9ff; stroke: #2c5ea9; stroke-width: 1.5; }
      .dsk { fill: #e9e6ff; stroke: #5a4fcf; stroke-width: 1.5; }
      .step { font-size: 9px; font-family: 'Menlo', monospace; fill: #222; }
      .small { font-size: 10px; font-family: 'Menlo', monospace; fill: #555; }
      .caption { font-size: 11px; fill: #555; font-style: italic; }
      .title { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .head { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
      .edge { stroke: #555; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="480" y="24" text-anchor="middle" class="title">异步云编码智能体（Async Cloud Coding Agent）：标签到 PR 工作流</text>

  <rect x="40" y="60" width="190" height="80" class="cool"/>
  <text x="135" y="82" text-anchor="middle" class="step">GitHub 问题标签（Issue Label）</text>
  <text x="135" y="100" text-anchor="middle" class="small">@agent fix this</text>
  <text x="135" y="118" text-anchor="middle" class="small">PR 评论触发（Comment Trigger）</text>

  <rect x="260" y="60" width="190" height="80" class="cold"/>
  <text x="355" y="82" text-anchor="middle" class="step">网络回调接收器（Webhook Receiver）</text>
  <text x="355" y="100" text-anchor="middle" class="small">Lambda / Fly.io</text>
  <text x="355" y="118" text-anchor="middle" class="small">入队到 SQS</text>

  <rect x="480" y="60" width="190" height="80" class="dsk"/>
  <text x="575" y="82" text-anchor="middle" class="step">分发器（Dispatcher）</text>
  <text x="575" y="100" text-anchor="middle" class="small">预算台账（Budget Ledger）</text>
  <text x="575" y="118" text-anchor="middle" class="small">逐仓库上限（Per-Repo Caps）</text>

  <rect x="700" y="60" width="220" height="80" class="hot"/>
  <text x="810" y="82" text-anchor="middle" class="step">ECS Fargate 任务（Task）</text>
  <text x="810" y="100" text-anchor="middle" class="small">Daytona 沙箱（Sandbox）</text>
  <text x="810" y="118" text-anchor="middle" class="small">逐任务隔离（Per-Task Isolation）</text>

  <path d="M230,100 L260,100" class="edge"/>
  <path d="M450,100 L480,100" class="edge"/>
  <path d="M670,100 L700,100" class="edge"/>

  <rect x="40" y="170" width="880" height="200" class="box"/>
  <text x="480" y="192" text-anchor="middle" class="head">沙箱状态机（Sandbox State Machine）</text>

  <rect x="60" y="208" width="140" height="46" class="cool"/>
  <text x="130" y="228" text-anchor="middle" class="step">CLONE</text>
  <text x="130" y="244" text-anchor="middle" class="small" style="font-size:7px">细粒度令牌（Fine-Grained Token）</text>
  <rect x="220" y="208" width="140" height="46" class="cool"/>
  <text x="290" y="228" text-anchor="middle" class="step">INFER</text>
  <text x="290" y="244" text-anchor="middle" class="small">Dockerfile 合成（Synth）</text>
  <rect x="380" y="208" width="180" height="46" class="dsk"/>
  <text x="470" y="228" text-anchor="middle" class="step">AGENT 循环（Loop）</text>
  <text x="470" y="244" text-anchor="middle" class="small">mini-swe-agent + Opus 4.7</text>
  <rect x="580" y="208" width="140" height="46" class="hot"/>
  <text x="650" y="228" text-anchor="middle" class="step">VERIFY</text>
  <text x="650" y="244" text-anchor="middle" class="small" style="font-size:7px">CI + 覆盖率变化（Coverage Delta）</text>
  <rect x="740" y="208" width="160" height="46" class="cool"/>
  <text x="820" y="228" text-anchor="middle" class="step">创建 PR（PR Open）</text>
  <text x="820" y="244" text-anchor="middle" class="small">标签：needs-review</text>

  <path d="M200,230 L220,230" class="edge"/>
  <path d="M360,230 L380,230" class="edge"/>
  <path d="M560,230 L580,230" class="edge"/>
  <path d="M720,230 L740,230" class="edge"/>

  <text x="80" y="296" class="small">逐任务强制预算上限（Budget Caps）：</text>
  <text x="80" y="314" class="small">  $20 / 轮次上限 30 / 实际运行时间 30 分钟</text>
  <text x="80" y="332" class="small">覆盖率变化 &lt; -2% -&gt; 标记 `needs-review`，仍创建 PR</text>
  <text x="80" y="350" class="small">CI 失败或触及上限 -&gt; 不建 PR，失败日志附理由</text>

  <rect x="40" y="390" width="440" height="120" class="box"/>
  <text x="260" y="412" text-anchor="middle" class="head">安全（Safety）</text>
  <text x="260" y="432" text-anchor="middle" class="small">GitHub App：细粒度令牌，1 小时过期</text>
  <text x="260" y="450" text-anchor="middle" class="small">禁止强制推送（Force-Push），禁止写入 main</text>
  <text x="260" y="468" text-anchor="middle" class="small">强制执行 main 分支保护（Branch Protection）</text>
  <text x="260" y="486" text-anchor="middle" class="small">归档前清理日志中的密钥</text>
  <text x="260" y="504" text-anchor="middle" class="caption">每仓库每日美元 + PR 数量上限</text>

  <rect x="500" y="390" width="420" height="120" class="box"/>
  <text x="710" y="412" text-anchor="middle" class="head">对比托管方案（Compare-vs-Hosted）</text>
  <text x="710" y="432" text-anchor="middle" class="small">30 个带固定随机种子的内部问题</text>
  <text x="710" y="450" text-anchor="middle" class="small">对比 pass@1 / $ / 延迟（Latency）：</text>
  <text x="710" y="468" text-anchor="middle" class="small">Cursor Background Agents</text>
  <text x="710" y="486" text-anchor="middle" class="small">AWS Remote SWE Agents</text>
  <text x="710" y="504" text-anchor="middle" class="caption">发布并排比较矩阵（Side-by-Side Matrix）</text>
</svg>
