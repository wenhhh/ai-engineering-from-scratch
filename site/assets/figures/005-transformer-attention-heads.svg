<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="FIG_005：Transformer 编码器（Encoder）中多头注意力（Multi-head attention）模块的分解视图">
  <defs>
    <pattern id="paper" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1" fill="#1a1a1a" fill-opacity="0.06"/>
    </pattern>
    <style>
      .ink { fill: #1a1a1a; }
      .mute { fill: #7a7a78; }
      .bp { fill: #3553ff; }
      .face { fill: rgba(53, 83, 255, 0.06); }
      .face-strong { fill: rgba(53, 83, 255, 0.18); }
      .stroke { stroke: #3553ff; fill: none; stroke-linejoin: miter; stroke-linecap: square; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#fafaf5"/>
  <rect width="1200" height="820" fill="url(#paper)"/>

  <text class="mono bp" x="40" y="44" font-size="11" letter-spacing="0">FIG_005</text>
  <text class="mono mute" x="1160" y="44" font-size="11" letter-spacing="0" text-anchor="end">阶段 07 · 第 01 课 · 多头注意力（Multi-head attention）</text>
  <line x1="40" y1="64" x2="1160" y2="64" stroke="#3553ff" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- 输入行：Q K V 投影（Projection），在堆叠上方分开展示 -->
  <g transform="translate(120, 130)">
    <text class="mono bp" x="0" y="0" font-size="9" letter-spacing="0">FIG_005.A：输入投影（Input projections）</text>

    <g transform="translate(40, 30)">
      <rect class="face-strong" x="0" y="0" width="64" height="22" transform="skewX(-22)"/>
      <rect class="stroke" stroke-width="1.2" x="0" y="0" width="64" height="22" transform="skewX(-22)"/>
      <text class="mono bp" x="22" y="14" font-size="11" letter-spacing="0">Q</text>
      <text class="mono mute" x="-4" y="46" font-size="8" letter-spacing="0">查询（Query）</text>
    </g>
    <g transform="translate(160, 30)">
      <rect class="face-strong" x="0" y="0" width="64" height="22" transform="skewX(-22)"/>
      <rect class="stroke" stroke-width="1.2" x="0" y="0" width="64" height="22" transform="skewX(-22)"/>
      <text class="mono bp" x="22" y="14" font-size="11" letter-spacing="0">K</text>
      <text class="mono mute" x="-4" y="46" font-size="8" letter-spacing="0">键（Key）</text>
    </g>
    <g transform="translate(280, 30)">
      <rect class="face-strong" x="0" y="0" width="64" height="22" transform="skewX(-22)"/>
      <rect class="stroke" stroke-width="1.2" x="0" y="0" width="64" height="22" transform="skewX(-22)"/>
      <text class="mono bp" x="22" y="14" font-size="11" letter-spacing="0">V</text>
      <text class="mono mute" x="-4" y="46" font-size="8" letter-spacing="0">值（Value）</text>
    </g>
  </g>

  <!-- 4 个注意力头（Attention head）的等距堆叠，以较大的垂直间距避免标签重叠 -->
  <g transform="translate(160, 270)">
    <!-- 注意力头 4（底层，强调） -->
    <g transform="translate(60, 360)">
      <polygon class="face-strong" points="0,0 320,-80 480,-40 160,40"/>
      <polygon class="stroke" stroke-width="1.4" points="0,0 320,-80 480,-40 160,40"/>
    </g>
    <!-- 注意力头 3 -->
    <g transform="translate(40, 280)">
      <polygon class="face" points="0,0 320,-80 480,-40 160,40"/>
      <polygon class="stroke" stroke-width="1.4" points="0,0 320,-80 480,-40 160,40"/>
    </g>
    <!-- 注意力头 2 -->
    <g transform="translate(20, 200)">
      <polygon class="face" points="0,0 320,-80 480,-40 160,40"/>
      <polygon class="stroke" stroke-width="1.4" points="0,0 320,-80 480,-40 160,40"/>
    </g>
    <!-- 注意力头 1（顶层） -->
    <g transform="translate(0, 120)">
      <polygon class="face" points="0,0 320,-80 480,-40 160,40"/>
      <polygon class="stroke" stroke-width="1.4" points="0,0 320,-80 480,-40 160,40"/>
    </g>

    <!-- 从各注意力头右边缘指向右侧标签的引导线 -->
    <g class="stroke" stroke-width="0.8" stroke-dasharray="3 3">
      <line x1="500" y1="80"  x2="640" y2="-130"/>
      <line x1="520" y1="160" x2="640" y2="-30"/>
      <line x1="540" y1="240" x2="640" y2="70"/>
      <line x1="560" y1="320" x2="640" y2="170"/>
    </g>
  </g>

  <!-- 右侧：各注意力头的行为标签 -->
  <g transform="translate(800, 160)">
    <g transform="translate(0, 0)">
      <text class="mono bp" x="0" y="0" font-size="11" letter-spacing="0">头 1 · 局部句法（Local syntax）</text>
      <text class="mono mute" x="0" y="16" font-size="9" letter-spacing="0">只关注相邻位置</text>
    </g>
    <g transform="translate(0, 100)">
      <text class="mono bp" x="0" y="0" font-size="11" letter-spacing="0">头 2 · 名词与形容词依赖（Noun-adj deps）</text>
      <text class="mono mute" x="0" y="16" font-size="9" letter-spacing="0">从名词回看其修饰语</text>
    </g>
    <g transform="translate(0, 200)">
      <text class="mono bp" x="0" y="0" font-size="11" letter-spacing="0">头 3 · 远距离共指（Long-range coref）</text>
      <text class="mono mute" x="0" y="16" font-size="9" letter-spacing="0">跨越句子中的距离，关注并追踪实体</text>
    </g>
    <g transform="translate(0, 300)">
      <text class="mono bp" x="0" y="0" font-size="11" letter-spacing="0">头 4 · 输出位置（Output position）</text>
      <text class="mono mute" x="0" y="16" font-size="9" letter-spacing="0">关注下一个词元（Token）的位置</text>
    </g>
  </g>

  <!-- 拼接（Concat）与 W_O 说明 -->
  <g transform="translate(160, 700)">
    <text class="mono bp" x="0" y="0" font-size="9" letter-spacing="0">FIG_005.B：输出（Output）</text>
    <rect class="face" x="0" y="14" width="480" height="28"/>
    <rect class="stroke" stroke-width="1.2" x="0" y="14" width="480" height="28"/>
    <text class="mono ink" x="14" y="34" font-size="11" letter-spacing="0">CONCAT(HEAD₁, HEAD₂, HEAD₃, HEAD₄) · W_O  →  D_MODEL 维</text>
  </g>

  <!-- 右侧标签下方的数学公式 -->
  <g transform="translate(800, 580)">
    <text class="mono ink" x="0" y="0" font-size="13" letter-spacing="0">Attention(Q, K, V)</text>
    <text class="mono ink" x="0" y="22" font-size="13" letter-spacing="0">= softmax( Q · Kᵀ / √d_k ) · V</text>
    <text class="mono mute" x="0" y="44" font-size="9" letter-spacing="0">每个注意力头 · D_K = D_MODEL / N_HEADS</text>
  </g>

  <line x1="40" y1="760" x2="1160" y2="760" stroke="#3553ff" stroke-width="0.6" stroke-opacity="0.35"/>
  <text class="mono mute" x="1160" y="788" font-size="10" letter-spacing="0" text-anchor="end">© FIG_005 · 多头注意力（Multi-head attention）· MIT</text>
</svg>
